// digit per press, so only the first 9 tools (index 0-8) have one (main.js's own handler is
// `n >= 1 && n <= TOOLBAR_TOOLS.length`, but no single keypress ever produces '10'-'14'). Derived
// from TOOLBAR_TOOLS' own order so it can never drift from the handler it describes.
function toolbarShortcut(tool) {
  const i = TOOLBAR_TOOLS.findIndex((t) => t.tool === tool);
  return i >= 0 && i < 9 ? i + 1 : null;
}

// The hover/focus tooltip's content for a toolbar tool: its name, then its cost and key shortcut
// when that data exists. Never invents anything -- QUERY has no treasury cost, and five tools
// (Constabulary onward) have no reachable key -- so those lines are simply omitted.
function toolbarTooltipLines(tool) {
  const entry = TOOLBAR_TOOLS.find((t) => t.tool === tool);
  if (!entry) return null;
  const lines = [entry.label];
  const cost = TOOL_COST[tool];
  const shortcut = toolbarShortcut(tool);
  const bits = [];
  if (Number.isFinite(cost)) bits.push(`$${cost}`);
  if (shortcut) bits.push(`key ${shortcut}`);
  if (bits.length) lines.push(bits.join('   '));
  return lines;
}

// The query window layout at a top-left origin. Pure. Returns the frame, title bar, and close box.
// `opts.lines` may be the actual array of body strings (preferred: the window is sized to the widest
// line so no readout clips, M8 text-overflow) or a plain count (older callers get the default width).
// `opts.title` widens the frame for a long title bar too.
function buildQueryWindow(x, y, opts = {}) {
  const src = opts.lines;
  const titleH = sc(18);
  let w;
  let bodyLines = null;
  if (Array.isArray(src)) {
    // Size the body to its widest line (so short readouts get a snug box), capped at a comfortable
    // width; any line past that cap wraps rather than clips (M8 text-overflow). The window is the
    // player's full readout, so it never truncates — it grows in height instead. Body lines draw at
    // 12px, PANEL_PAD in from each side (the shared padding standard, M10); the title (12px) must
    // also clear the close box.
    const titleNeed = opts.title ? monoWidth(opts.title, sc(12)) + sc(PANEL_PAD) + titleH + sc(6) : 0;
    const bodyNeed = Math.max(0, ...src.map((l) => monoWidth(l, sc(12)))) + sc(PANEL_PAD) * 2;
    w = Math.max(sc(150), Math.min(sc(opts.maxW || 360), Math.ceil(Math.max(bodyNeed, titleNeed))));
    bodyLines = src.flatMap((l) => wrapMono(l, w - sc(PANEL_PAD) * 2, sc(12), 3));
  } else {
    w = sc(opts.w || 210);
  }
  const lineCount = bodyLines ? bodyLines.length : (typeof src === 'number' ? src : 5);
  const bodyH = sc(10) + lineCount * sc(16);
  const h = titleH + bodyH;
  return {
    frame: { x, y, w, h },
    titleBar: { x, y, w, h: titleH },
    close: { x: x + w - titleH + sc(3), y: y + sc(3), w: titleH - sc(6), h: titleH - sc(6) },
    body: { x, y: y + titleH, w, h: bodyH },
    titleH, bodyLines,
  };
}

// The top status bar: city readout on the left, speed buttons on the right. Pure layout.
const SPEED_ORDER = [SPEED.PAUSED, SPEED.CREEP, SPEED.SLOW, SPEED.MEDIUM, SPEED.FAST];

function buildTopBar(viewportW) {
  const h = sc(26);
  const btn = sc(22);
  const gap = sc(3);
  const n = SPEED_ORDER.length;
  const startX = viewportW - (btn * n + gap * (n - 1)) - sc(8);
  const speeds = SPEED_ORDER.map((speed, i) => ({
    speed,
    rect: { x: startX + i * (btn + gap), y: sc(2), w: btn, h: btn },
  }));
  // The window buttons march leftward from the speed buttons: Ledger, Gods, Wrath, save, mute,
  // volume, text-size, motion.
  const by = sc(3);
  const bh = sc(20);
  const ledger = { x: startX - sc(78), y: by, w: sc(70), h: bh };
  const gods = { x: ledger.x - sc(62), y: by, w: sc(56), h: bh };
  const disasters = { x: gods.x - sc(68), y: by, w: sc(62), h: bh };
  const save = { x: disasters.x - sc(60), y: by, w: sc(46), h: bh };
  const mute = { x: save.x - sc(28), y: by, w: sc(22), h: bh }; // the music toggle (speaker)
  const vol = { x: mute.x - sc(28), y: by, w: sc(22), h: bh }; // the bed-volume step (bars)
  const textscale = { x: vol.x - sc(28), y: by, w: sc(22), h: bh }; // the chrome text-size cycle
  const motion = { x: textscale.x - sc(28), y: by, w: sc(22), h: bh }; // the ambient-motion toggle (gull)
  return { panel: { x: 0, y: 0, w: viewportW, h }, speeds, ledger, gods, disasters, save, mute, vol, textscale, motion };
}

function hitSpeed(topbar, px, py) {
  for (const b of topbar.speeds) if (inRect(b.rect, px, py)) return b.speed;
  return null;
}

function overTopBar(topbar, px, py) {
  return inRect(topbar.panel, px, py);
}

// --- drawing (browser) -------------------------------------------------------------------

// A raised (or pressed) beveled panel: light top+left, shadow bottom+right (STUDY 3).
function drawBevel(ctx, x, y, w, h, pressed = false) {
  ctx.fillStyle = CHROME.windowFace;
  ctx.fillRect(x, y, w, h);
  const light = pressed ? CHROME.bevelShadow : CHROME.bevelLight;
  const shadow = pressed ? CHROME.bevelLight : CHROME.bevelShadow;
  ctx.fillStyle = light;
  ctx.fillRect(x, y, w, 2); // top
  ctx.fillRect(x, y, 2, h); // left
  ctx.fillStyle = shadow;
  ctx.fillRect(x, y + h - 2, w, 2); // bottom
  ctx.fillRect(x + w - 2, y, 2, h); // right
}

function drawToolbar(ctx, toolbar, activeTool) {
  // Deep frame then the panel face.
  const p = toolbar.panel;
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillRect(p.x - 1, p.y - 1, p.w + 2, p.h + 2);
  drawBevel(ctx, p.x, p.y, p.w, p.h, false);
  for (const b of toolbar.buttons) {
    const active = b.tool === activeTool;
    drawBevel(ctx, b.rect.x, b.rect.y, b.rect.w, b.rect.h, active);
    drawToolIcon(ctx, b.tool, b.rect.x + b.rect.w / 2, b.rect.y + b.rect.h / 2, b.rect.w, active);
  }
}

// A small pictographic icon per tool, drawn from primitives (no bitmap assets, no letters).
function drawToolIcon(ctx, tool, cx, cy, size, pressed = false) {
  const s = size * 0.5;
  const off = pressed ? 1 : 0; // nudge when the button is pressed
  ctx.save();
  ctx.translate(cx + off, cy + off);
  ctx.lineWidth = 2;
  ctx.strokeStyle = CHROME.ink;
  ctx.fillStyle = CHROME.ink;

  if (tool === TOOL.QUERY) {
    // Magnifying glass: circle + handle.
    ctx.beginPath();
    ctx.arc(-s * 0.15, -s * 0.15, s * 0.45, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s * 0.18, s * 0.18);
    ctx.lineTo(s * 0.5, s * 0.5);
    ctx.stroke();
  } else if (tool === TOOL.BULLDOZE) {
    // A dozer blade: a filled wedge over a small tread bar.
    ctx.fillStyle = RAMP.rock[LIGHT];
    ctx.beginPath();
    ctx.moveTo(-s * 0.5, -s * 0.1);
    ctx.lineTo(s * 0.1, -s * 0.5);
    ctx.lineTo(s * 0.3, -s * 0.25);
    ctx.lineTo(-s * 0.3, s * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = CHROME.ink;
    ctx.stroke();
    ctx.fillStyle = CHROME.ink;
    ctx.fillRect(-s * 0.5, s * 0.3, s * 0.9, s * 0.22);
  } else if (tool === TOOL.ROAD) {
    // A dirt lane running diagonally with a centre rut.
    ctx.fillStyle = RAMP.dirt[BASE];
    ctx.beginPath();
    ctx.moveTo(-s * 0.5, s * 0.15);
    ctx.lineTo(s * 0.15, -s * 0.5);
    ctx.lineTo(s * 0.5, -s * 0.15);
    ctx.lineTo(-s * 0.15, s * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = RAMP.dirt[LIGHT];
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-s * 0.5, s * 0.0);
    ctx.lineTo(s * 0.0, -s * 0.5);
    ctx.stroke();
  } else if (tool === TOOL.POWERLINE) {
    // A pole with two cross wires.
    ctx.strokeStyle = CHROME.ink;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.5);
    ctx.lineTo(0, -s * 0.5);
    ctx.moveTo(-s * 0.4, -s * 0.3);
    ctx.lineTo(s * 0.4, -s * 0.3);
    ctx.moveTo(-s * 0.35, -s * 0.1);
    ctx.lineTo(s * 0.35, -s * 0.1);
    ctx.stroke();
  } else if (tool === TOOL.ZONE_R) {
    drawBuildingGlyph(ctx, s, ZONE_TINT.residential, 'house');
  } else if (tool === TOOL.ZONE_C) {
    drawBuildingGlyph(ctx, s, ZONE_TINT.commercial, 'store');
  } else if (tool === TOOL.ZONE_I) {
    drawBuildingGlyph(ctx, s, ZONE_TINT.industrial, 'factory');
  } else if (tool === TOOL.GASWORKS) {
    // A gasholder drum.
    ctx.fillStyle = RAMP.rock[LIGHT]; ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
    ctx.fillRect(-s * 0.35, -s * 0.35, s * 0.7, s * 0.75);
    ctx.strokeRect(-s * 0.35, -s * 0.35, s * 0.7, s * 0.75);
    ctx.beginPath(); ctx.moveTo(-s * 0.35, -s * 0.05); ctx.lineTo(s * 0.35, -s * 0.05); ctx.stroke();
    ctx.beginPath(); ctx.ellipse ? ctx.ellipse(0, -s * 0.35, s * 0.35, s * 0.12, 0, 0, Math.PI * 2) : ctx.arc(0, -s * 0.35, s * 0.35, 0, Math.PI * 2); ctx.stroke();
  } else if (tool === TOOL.WHALEOIL) {
    // A tank with a smoking chimney.
    ctx.fillStyle = RAMP.rock[BASE]; ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
    ctx.fillRect(-s * 0.45, -s * 0.05, s * 0.55, s * 0.5);
    ctx.strokeRect(-s * 0.45, -s * 0.05, s * 0.55, s * 0.5);
    ctx.fillRect(s * 0.2, -s * 0.5, s * 0.16, s * 0.95); // chimney
    ctx.strokeRect(s * 0.2, -s * 0.5, s * 0.16, s * 0.95);
    ctx.fillStyle = 'rgba(120,120,120,0.7)';
    ctx.beginPath(); ctx.arc(s * 0.28, -s * 0.55, s * 0.14, 0, Math.PI * 2); ctx.fill();
  } else if (tool === TOOL.CONSTABULARY) {
    // A watch-house with a blue lamp.
    ctx.fillStyle = RAMP.clapboard[LIGHT]; ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
    ctx.fillRect(-s * 0.4, -s * 0.25, s * 0.8, s * 0.7);
    ctx.strokeRect(-s * 0.4, -s * 0.25, s * 0.8, s * 0.7);
    ctx.fillStyle = '#2f5fa0';
    ctx.beginPath(); ctx.arc(0, -s * 0.4, s * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8fb6e0'; ctx.stroke();
  } else if (tool === TOOL.ASYLUM) {
    // An institutional block with a cupola.
    ctx.fillStyle = RAMP.rock[LIGHT]; ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
    ctx.fillRect(-s * 0.45, -s * 0.15, s * 0.9, s * 0.6);
    ctx.strokeRect(-s * 0.45, -s * 0.15, s * 0.9, s * 0.6);
    ctx.fillRect(-s * 0.12, -s * 0.45, s * 0.24, s * 0.32); // cupola
    ctx.strokeRect(-s * 0.12, -s * 0.45, s * 0.24, s * 0.32);
    ctx.beginPath(); ctx.moveTo(-s * 0.12, -s * 0.45); ctx.lineTo(0, -s * 0.58); ctx.lineTo(s * 0.12, -s * 0.45); ctx.stroke();
  } else if (tool === TOOL.CHAPEL) {
    // A church with a steeple.
    ctx.fillStyle = RAMP.clapboard[HIGHLIGHT]; ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
    ctx.fillRect(-s * 0.4, -s * 0.1, s * 0.7, s * 0.55);
    ctx.strokeRect(-s * 0.4, -s * 0.1, s * 0.7, s * 0.55);
    ctx.beginPath(); // spire
    ctx.moveTo(-s * 0.3, -s * 0.1); ctx.lineTo(-s * 0.15, -s * 0.55); ctx.lineTo(0, -s * 0.1);
    ctx.closePath(); ctx.fillStyle = RAMP.slate[BASE]; ctx.fill(); ctx.stroke();
  } else if (tool === TOOL.SHRINE) {
    // A dark canted monolith with a cold glow.
    ctx.fillStyle = RAMP.slate[SHADOW]; ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-s * 0.22, s * 0.45); ctx.lineTo(s * 0.12, s * 0.45);
    ctx.lineTo(s * 0.22, -s * 0.5); ctx.lineTo(-s * 0.08, -s * 0.5);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6a9c8b';
    ctx.beginPath(); ctx.arc(s * 0.07, -s * 0.5, s * 0.14, 0, Math.PI * 2); ctx.fill();
  } else if (tool === TOOL.UNIVERSITY) {
    // A college hall with a battlemented tower and a violet containment lamp.
    ctx.fillStyle = RAMP.rock[LIGHT]; ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
    ctx.fillRect(-s * 0.45, -s * 0.1, s * 0.9, s * 0.55);
    ctx.strokeRect(-s * 0.45, -s * 0.1, s * 0.9, s * 0.55);
    ctx.fillRect(-s * 0.4, -s * 0.5, s * 0.26, s * 0.42); // tower
    ctx.strokeRect(-s * 0.4, -s * 0.5, s * 0.26, s * 0.42);
    ctx.fillStyle = CHROME.ink; // crenellations
    ctx.fillRect(-s * 0.4, -s * 0.56, s * 0.07, s * 0.08);
    ctx.fillRect(-s * 0.27, -s * 0.56, s * 0.07, s * 0.08);
    ctx.fillStyle = '#c3a8e0'; // containment lamp
    ctx.beginPath(); ctx.arc(s * 0.28, -s * 0.2, s * 0.12, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawBuildingGlyph(ctx, s, color, kind) {
  ctx.fillStyle = color;
  ctx.strokeStyle = CHROME.ink;
  ctx.lineWidth = 1.5;
  if (kind === 'house') {
    ctx.beginPath(); // gable roof
    ctx.moveTo(-s * 0.45, -s * 0.05);
    ctx.lineTo(0, -s * 0.5);
    ctx.lineTo(s * 0.45, -s * 0.05);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillRect(-s * 0.35, -s * 0.05, s * 0.7, s * 0.5);
    ctx.strokeRect(-s * 0.35, -s * 0.05, s * 0.7, s * 0.5);
  } else if (kind === 'store') {
    ctx.fillRect(-s * 0.45, -s * 0.4, s * 0.9, s * 0.85);
    ctx.strokeRect(-s * 0.45, -s * 0.4, s * 0.9, s * 0.85);
    ctx.fillStyle = CHROME.ink; // awning bar
    ctx.fillRect(-s * 0.45, -s * 0.15, s * 0.9, s * 0.12);
  } else {
    // factory: block plus a smokestack.
    ctx.fillRect(-s * 0.45, -s * 0.2, s * 0.9, s * 0.65);
    ctx.strokeRect(-s * 0.45, -s * 0.2, s * 0.9, s * 0.65);
    ctx.fillRect(s * 0.15, -s * 0.5, s * 0.18, s * 0.35); // stack
    ctx.strokeRect(s * 0.15, -s * 0.5, s * 0.18, s * 0.35);
  }
}

// The toolbar tooltip's layout (M10): a small popup beside the hovered or keyboard-focused button,
// sized to its own text (M8 text-overflow discipline) and clamped inside the viewport -- it flips
// to the button's left if the right edge would clip, and never runs off the top, bottom, or a
// narrow left edge either. Text-bearing (unlike the pictographic toolbar itself), so it honours the
// chrome text scale like every other readout.
function buildToolbarTooltip(rect, lines, viewportW, viewportH) {
  const px = sc(11);
  // PANEL_PAD (the one shared padding standard, M10 sweep) both sides, plus a minimum content
  // width so a single short word ("Road") never renders as a bare sliver.
  const padX = sc(PANEL_PAD); const padY = sc(10); const lineH = sc(16);
  const widest = Math.max(0, ...lines.map((l) => monoWidth(l, px)));
  const w = Math.max(sc(MIN_POPUP_W), Math.ceil(widest) + padX * 2);
  const h = lines.length * lineH + padY * 2;
  let x = rect.x + rect.w + sc(8);
  if (x + w > viewportW - sc(4)) x = rect.x - w - sc(8); // flip left of the icon if it would clip
  x = Math.max(sc(4), Math.min(x, viewportW - w - sc(4)));
  const y = Math.max(sc(4), Math.min(Math.round(rect.y + rect.h / 2 - h / 2), viewportH - h - sc(4)));
  return { x, y, w, h, px, padX, padY, lineH };
}

function drawToolbarTooltip(ctx, layout, lines) {
  const { x, y, w, h, px, padX, padY, lineH } = layout;
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  drawBevel(ctx, x, y, w, h, false);
  ctx.fillStyle = CHROME.ink;
  ctx.font = `${px}px monospace`;
  ctx.textBaseline = 'middle';
  lines.forEach((line, i) => {
    ctx.fillText(line, x + padX, y + padY + lineH * i + lineH / 2);
  });
}

// The Ledger (budget) window layout, centred. Pure geometry with interactive row rects.
function buildBudgetWindow(viewportW, viewportH) {
  const w = sc(340);
  const h = sc(452);
  const x = Math.round((viewportW - w) / 2);
  const y = Math.max(34, Math.round((viewportH - h) / 2));
  const titleH = sc(20);
  const pad = sc(PANEL_PAD);
  // Below the income/expense text block (Treasury, a power gauge, and 7 budget lines).
  let cy = y + titleH + sc(182);

  const taxRows = CLASS_LIST.map((cls) => {
    const row = {
      cls,
      y: cy,
      minus: { x: x + w - sc(96), y: cy, w: sc(20), h: sc(18) },
      plus: { x: x + w - sc(30), y: cy, w: sc(20), h: sc(18) },
    };
    cy += sc(24);
    return row;
  });
  cy += sc(26); // room for the Ordinances header
  const ordRows = Object.keys(ORDINANCE_INFO).map((key) => {
    const row = { key, y: cy, box: { x: x + pad, y: cy, w: sc(16), h: sc(16) } };
    cy += sc(22);
    return row;
  });

  return {
    frame: { x, y, w, h },
    titleBar: { x, y, w, h: titleH },
    close: { x: x + w - titleH + sc(3), y: y + sc(3), w: titleH - sc(6), h: titleH - sc(6) },
    pad, titleH, taxRows, ordRows,
    incomeY: y + titleH + sc(8),
  };
}

// Which budget control is under a point: {type:'close'} | {type:'tax', cls, dir} | {type:'ordinance', key}.
function budgetHit(layout, px, py) {
  if (inRect(layout.close, px, py)) return { type: 'close' };
  for (const r of layout.taxRows) {
    if (inRect(r.minus, px, py)) return { type: 'tax', cls: r.cls, dir: -1 };
    if (inRect(r.plus, px, py)) return { type: 'tax', cls: r.cls, dir: 1 };
  }
  for (const r of layout.ordRows) {
    if (inRect(r.box, px, py)) return { type: 'ordinance', key: r.key };
  }
  return null;
}

function overBudget(layout, px, py) {
  return inRect(layout.frame, px, py);
}

// The Ledger's interactive controls in tab order (M7 keyboard chrome): tax minus/plus per class,
// then the ordinance checkboxes, then the close box. Each entry carries the same action object the
// click path returns (budgetHit), plus its rect for the focus ring, so keyboard and mouse run the
// exact same code. Pure over the layout.
function budgetControls(layout) {
  const controls = [];
  for (const r of layout.taxRows) {
    controls.push({ action: { type: 'tax', cls: r.cls, dir: -1 }, rect: r.minus });
    controls.push({ action: { type: 'tax', cls: r.cls, dir: 1 }, rect: r.plus });
  }
  for (const r of layout.ordRows) {
    controls.push({ action: { type: 'ordinance', key: r.key }, rect: r.box });
  }
  controls.push({ action: { type: 'close' }, rect: layout.close });
  return controls;
}

// Draw a focus ring around a control's rect (the keyboard focus indicator).
function drawFocusRing(ctx, rect) {
  if (!rect) return;
  ctx.strokeStyle = '#f4d67a';
  ctx.lineWidth = 2;
  ctx.strokeRect(rect.x - 2, rect.y - 2, rect.w + 4, rect.h + 4);
}

function drawBudgetWindow(ctx, layout, sim) {
  const { frame, titleBar, close } = layout;
  const b = computeBudget(sim);
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillRect(frame.x - 1, frame.y - 1, frame.w + 2, frame.h + 2);
  drawBevel(ctx, frame.x, frame.y, frame.w, frame.h, false);
  ctx.fillStyle = CHROME.titleBar;
  ctx.fillRect(titleBar.x + 2, titleBar.y + 2, titleBar.w - 4, titleBar.h - 2);
  ctx.fillStyle = CHROME.titleText;
  ctx.font = fpx(13);
  ctx.textBaseline = 'middle';
  ctx.fillText('The Town Ledger', titleBar.x + sc(PANEL_PAD), titleBar.y + titleBar.h / 2 + 1);
  drawBevel(ctx, close.x, close.y, close.w, close.h, false);
  ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(close.x + 3, close.y + 3); ctx.lineTo(close.x + close.w - 3, close.y + close.h - 3);
  ctx.moveTo(close.x + close.w - 3, close.y + 3); ctx.lineTo(close.x + 3, close.y + close.h - 3);
  ctx.stroke();

  ctx.fillStyle = CHROME.ink;
  ctx.font = fpx(12);
  const lx = frame.x + layout.pad;
  const rx = frame.x + frame.w - layout.pad;
  const money = (n) => `$${n}`;
  const rightText = (t, y) => { const width = ctx.measureText(t).width; ctx.fillText(t, rx - width, y); };
  let y = layout.incomeY + sc(6);
  const line = (label, val) => { ctx.fillText(label, lx, y); rightText(money(val), y); y += sc(16); };
  if (sim.treasury < 0) ctx.fillStyle = '#8a2a22'; // the coffers are in the red
  ctx.fillText(`Treasury: ${money(sim.treasury)}`, lx, y); y += sc(18);
  ctx.fillStyle = CHROME.ink;

  // Power gauge: demand against capacity, a recessed well that reddens when the grid is over-taxed.
  const power = sim.power && sim.power.totals ? sim.power.totals : { demand: 0, capacity: 0 };
  const over = power.demand > power.capacity;
  ctx.fillText('Power', lx, y);
  const gx = lx + sc(54); const gw = frame.w - sc(54) - layout.pad * 2 - sc(62); const gh = sc(10); const gy = y - sc(8);
  drawBevel(ctx, gx, gy, gw, gh, true);
  if (power.capacity > 0) {
    const frac = Math.min(1, power.demand / power.capacity);
    ctx.fillStyle = over ? '#8a2a22' : '#2f6f4a';
    ctx.fillRect(gx + 2, gy + 2, Math.max(0, (gw - 4) * frac), gh - 4);
  }
  ctx.fillStyle = over ? '#8a2a22' : CHROME.ink;
  rightText(`${power.demand}/${power.capacity}`, y);
  ctx.fillStyle = CHROME.ink; y += sc(18);

  line('Taxes', b.lines.tax);
  line('Sea bounty', b.lines.bounty);
  line('Commerce', b.lines.commerce);
  line('Upkeep', -b.lines.maintenance);
  line('Services', -b.lines.services);
  line('Ordinances', -b.lines.ordinanceUpkeep);
  ctx.fillStyle = b.net >= 0 ? '#2e5a2e' : '#8a2a22';
  ctx.fillText('Each month', lx, y); rightText(money(b.net), y);
  ctx.fillStyle = CHROME.ink;
  // Insolvency note (M8): a town in the red has its ordinances forced off; a sustained one has its
  // services cut. This sits in the gap above the tax section.
  if (sim.treasury < 0 || sim.servicesCut) {
    y += sc(16);
    ctx.fillStyle = '#8a2a22';
    ctx.fillText(sim.servicesCut ? 'Insolvent. The watch is unpaid.' : 'The town is insolvent.', lx, y);
    ctx.fillStyle = CHROME.ink;
  }

  // Section headers.
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillText('Tax rates', lx, layout.taxRows[0].y - 8);
  ctx.fillText('Ordinances', lx, layout.ordRows[0].y - 10);
  ctx.fillStyle = CHROME.ink;
  // Tax controls.
  for (const r of layout.taxRows) {
    ctx.fillText(CLASS_LABEL[r.cls], lx, r.y + 9);
    drawBevel(ctx, r.minus.x, r.minus.y, r.minus.w, r.minus.h, false);
    drawBevel(ctx, r.plus.x, r.plus.y, r.plus.w, r.plus.h, false);
    ctx.fillStyle = CHROME.ink;
    ctx.fillText('-', r.minus.x + 7, r.minus.y + 10);
    ctx.fillText('+', r.plus.x + 6, r.plus.y + 10);
    const pct = `${Math.round(sim.taxRates[r.cls] * 100)}%`;
    ctx.fillText(pct, r.minus.x + 28, r.minus.y + 10);
  }
  // Ordinance toggles.
  for (const r of layout.ordRows) {
    drawBevel(ctx, r.box.x, r.box.y, r.box.w, r.box.h, true);
    if (sim.ordinances[r.key]) {
      ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r.box.x + 3, r.box.y + 8);
      ctx.lineTo(r.box.x + 7, r.box.y + 12);
      ctx.lineTo(r.box.x + 13, r.box.y + 3);
      ctx.stroke();
    }
    ctx.fillStyle = CHROME.ink;
    const info = ORDINANCE_INFO[r.key];
    ctx.fillText(`${info.label}  ($${info.upkeep}/mo)`, r.box.x + 24, r.box.y + 9);
  }
}

// Draw the top status bar: date, population, funds, a dread meter, the Ledger button and speeds.
function drawTopBar(ctx, topbar, sim, activeSpeed, muted = false, reducedMotion = false,
  volumeIdx = DEFAULT_VOLUME_IDX, volumeSteps = VOLUME_LEVELS.length) {
  const p = topbar.panel;
  drawBevel(ctx, p.x, p.y, p.w, p.h, false);
  ctx.fillStyle = CHROME.ink;
  ctx.font = fpx(13);
  ctx.textBaseline = 'middle';
  const cy = p.y + p.h / 2 + 1;
  // The left readouts flow left-to-right by measured width, so they hold together at any text scale.
  // The gap shrinks with the font so the whole strip still fits at 1.5x on a 1280-wide viewport.
  let fx = sc(10);
  const flow = (t, gap = 12) => { ctx.fillText(t, fx, cy); fx += ctx.measureText(t).width + sc(gap); };
  const pop = sim.totalPopulation();
  flow(sim.formatDate());
  flow(`Innsmouth ${townTitle(pop)}`); // the town's growth title (Landing..City)
  flow(`Pop ${pop}`);
  flow(`$${sim.treasury}`);

  // Dread meter: a recessed well with a fill that reddens as dread climbs. Its width is capped by
  // the remaining space before the right-hand chrome buttons so the top bar never overlaps at the
  // largest chrome scale on a narrow viewport.
  const mx = fx;
  const rightEdge = topbar.motion ? topbar.motion.x - sc(8) : p.w - sc(8);
  const mw = Math.min(sc(118), Math.max(sc(48), rightEdge - mx - sc(6)));
  const my = p.y + sc(6);
  const mh = p.h - sc(12);
  drawBevel(ctx, mx, my, mw, mh, true);
  const frac = Math.max(0, Math.min(1, sim.dread / 100));
  const gg = Math.round(150 * (1 - frac));
  ctx.fillStyle = `rgb(${120 + Math.round(80 * frac)}, ${70 + gg}, 60)`;
  ctx.fillRect(mx + 2, my + 2, Math.max(0, (mw - 4) * frac), mh - 4);
  // Numeric readout paired with the bar (M7); the label is dropped when the bar is squeezed.
  ctx.fillStyle = CHROME.ink;
  const dnum = `${Math.round(sim.dread)}`;
  const dnumW = ctx.measureText(dnum).width;
  const labelX = mx + sc(6);
  const numX = mx + mw - sc(6) - dnumW;
  const labelW = ctx.measureText('Dread').width;
  if (labelX + labelW + sc(4) <= numX) ctx.fillText('Dread', labelX, cy);
  ctx.fillText(dnum, numX, cy);

  // The window buttons: Ledger, Gods, Wrath, Save.
  const button = (r, text) => {
    if (!r) return;
    drawBevel(ctx, r.x, r.y, r.w, r.h, false);
    ctx.fillStyle = CHROME.ink;
    ctx.fillText(text, r.x + sc(8), r.y + r.h / 2 + 1);
  };
  button(topbar.ledger, 'Ledger');
  button(topbar.gods, 'Gods');
  button(topbar.disasters, 'Wrath');
  button(topbar.save, 'Save');

  // The chrome text-size cycle button: a small A over a larger A.
  if (topbar.textscale) {
    const T = topbar.textscale;
    drawBevel(ctx, T.x, T.y, T.w, T.h, getChromeScale() > 1);
    ctx.fillStyle = CHROME.ink;
    ctx.textBaseline = 'alphabetic';
    ctx.font = fpx(10);
    ctx.fillText('A', T.x + T.w * 0.18, T.y + T.h * 0.5);
    ctx.font = fpx(14);
    ctx.fillText('A', T.x + T.w * 0.42, T.y + T.h * 0.78);
    ctx.textBaseline = 'middle';
    ctx.font = fpx(13);
  }

  // The music mute toggle: a little speaker, crossed out when muted.
  if (topbar.mute) {
    const M = topbar.mute;
    drawBevel(ctx, M.x, M.y, M.w, M.h, muted);
    const cx = M.x + M.w / 2 - 2;
    const cy = M.y + M.h / 2;
    ctx.fillStyle = CHROME.ink;
    ctx.beginPath();
    ctx.moveTo(cx - 4, cy - 2); ctx.lineTo(cx - 1, cy - 2); ctx.lineTo(cx + 2, cy - 5);
    ctx.lineTo(cx + 2, cy + 5); ctx.lineTo(cx - 1, cy + 2); ctx.lineTo(cx - 4, cy + 2);
    ctx.closePath(); ctx.fill();
    if (muted) {
      ctx.strokeStyle = '#8a2a22'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx + 4, cy - 4); ctx.lineTo(cx + 9, cy + 4); ctx.stroke();
    } else {
      ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx + 4, cy, 3, -0.7, 0.7); ctx.stroke();
    }
  }

  // The bed-volume step: a small ascending bar graph, filled up to the current level.
  if (topbar.vol) {
    const V = topbar.vol;
    drawBevel(ctx, V.x, V.y, V.w, V.h, false);
    const bars = Math.max(1, volumeSteps);
    const bw = Math.max(2, Math.floor((V.w - sc(6)) / bars) - 1);
    for (let i = 0; i < bars; i++) {
      const barH = sc(4) + i * sc(3);
      const bx = V.x + sc(3) + i * (bw + 1);
      const bly = V.y + V.h - sc(4) - barH;
      ctx.fillStyle = i <= volumeIdx && !muted ? CHROME.ink : CHROME.bevelShadow;
      ctx.fillRect(bx, bly, bw, barH);
    }
  }

  // The ambient-motion toggle: a small gull (a shallow V), crossed out when the living world is
  // stilled (the reduced-motion / low-power path).
  if (topbar.motion) {
    const G = topbar.motion;
    drawBevel(ctx, G.x, G.y, G.w, G.h, reducedMotion);
    const gx = G.x + G.w / 2 - 1;
    const gy = G.y + G.h / 2;
    ctx.strokeStyle = CHROME.ink;
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(gx - 5, gy + 1); ctx.lineTo(gx - 1, gy - 2); ctx.lineTo(gx + 3, gy + 1);
    ctx.stroke();
    ctx.lineCap = 'butt';
    if (reducedMotion) {
      ctx.strokeStyle = '#8a2a22'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(G.x + G.w - 6, G.y + 4); ctx.lineTo(G.x + 5, G.y + G.h - 4); ctx.stroke();
    }
  }

  for (const b of topbar.speeds) {
    const active = b.speed === activeSpeed;
    drawBevel(ctx, b.rect.x, b.rect.y, b.rect.w, b.rect.h, active);
    drawSpeedIcon(ctx, b.speed, b.rect);
  }
}

function drawSpeedIcon(ctx, speed, r) {
  const cx = r.x + r.w / 2;
  const cy = r.y + r.h / 2;
  ctx.fillStyle = CHROME.ink;
  if (speed === SPEED.PAUSED) {
    ctx.fillRect(cx - 4, cy - 5, 3, 10);
    ctx.fillRect(cx + 1, cy - 5, 3, 10);
    return;
  }
  if (speed === SPEED.CREEP) {
    // One hollow arrow: slower even than a single filled arrow (the contemplative step).
    const w = 6;
    const x = cx - w / 2 - 1;
    ctx.strokeStyle = CHROME.ink;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x, cy - 5);
    ctx.lineTo(x + w, cy);
    ctx.lineTo(x, cy + 5);
    ctx.closePath();
    ctx.stroke();
    return;
  }
  const arrows = speed === SPEED.SLOW ? 1 : speed === SPEED.MEDIUM ? 2 : 3;
  const w = 5;
  const startX = cx - (arrows * w) / 2 - 1;
  for (let i = 0; i < arrows; i++) {
    const x = startX + i * w;
    ctx.beginPath();
    ctx.moveTo(x, cy - 5);
    ctx.lineTo(x + w, cy);
    ctx.lineTo(x, cy + 5);
    ctx.closePath();
    ctx.fill();
  }
}

function drawQueryWindow(ctx, layout, desc) {
  const { frame, titleBar, close, body } = layout;
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillRect(frame.x - 1, frame.y - 1, frame.w + 2, frame.h + 2);
  drawBevel(ctx, frame.x, frame.y, frame.w, frame.h, false);
  // Title bar.
  ctx.fillStyle = CHROME.titleBar;
  ctx.fillRect(titleBar.x + 2, titleBar.y + 2, titleBar.w - 4, titleBar.h - 2);
  ctx.fillStyle = CHROME.titleText;
  ctx.font = fpx(12);
  ctx.textBaseline = 'middle';
  const titleMax = titleBar.w - sc(PANEL_PAD) - close.w - sc(8);
  ctx.fillText(fitMono(desc.title, titleMax, sc(12)), titleBar.x + sc(PANEL_PAD), titleBar.y + titleBar.h / 2 + 1);
  // Close box.
  drawBevel(ctx, close.x, close.y, close.w, close.h, false);
  ctx.strokeStyle = CHROME.ink;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(close.x + 3, close.y + 3);
  ctx.lineTo(close.x + close.w - 3, close.y + close.h - 3);
  ctx.moveTo(close.x + close.w - 3, close.y + 3);
  ctx.lineTo(close.x + 3, close.y + close.h - 3);
  ctx.stroke();
  // Body lines.
  ctx.fillStyle = CHROME.ink;
  ctx.font = fpx(12);
  const bodyMax = body.w - sc(PANEL_PAD) * 2;
  // Prefer the layout's pre-wrapped lines (content-sized path); fall back to the raw lines, fit to
  // width, for older count-only callers.
  const lines = layout.bodyLines || desc.lines;
  lines.forEach((line, i) => {
    ctx.fillText(fitMono(line, bodyMax, sc(12)), body.x + sc(PANEL_PAD), body.y + sc(12) + i * sc(16));
  });
}

// --- the gods layer windows (M6) ---------------------------------------------------------

// The Favor of the Gods window: one block per god (name, wrath, a favor meter, appease hint).
function buildFavorWindow(viewportW, viewportH) {
  const w = sc(384);
  const rowH = sc(76); // room for the god row, its meter, and a two-line appease/omen hint (M8)
  const titleH = sc(20);
  const pad = sc(PANEL_PAD);
  const h = titleH + pad + GOD_LIST.length * rowH + pad;
  const x = Math.round((viewportW - w) / 2);
  const y = Math.max(34, Math.round((viewportH - h) / 2));
  const rows = GOD_LIST.map((god, i) => ({
    god,
    y: y + titleH + pad + i * rowH,
    bar: { x: x + pad, y: y + titleH + pad + i * rowH + sc(22), w: w - pad * 2, h: sc(12) },
  }));
  return {
    frame: { x, y, w, h },
    titleBar: { x, y, w, h: titleH },
    close: { x: x + w - titleH + sc(3), y: y + sc(3), w: titleH - sc(6), h: titleH - sc(6) },
    rows, pad, titleH,
  };
}

function favorHit(layout, px, py) {
  if (inRect(layout.close, px, py)) return { type: 'close' };
  return null;
}

function overFavor(layout, px, py) {
  return inRect(layout.frame, px, py);
}

// Favor colour: calm teal when high, an angry red as it falls toward wrath.
function favorColor(frac) {
  const f = Math.max(0, Math.min(1, frac));
  const r = Math.round(150 - 100 * f);
  const g = Math.round(60 + 110 * f);
  const b = Math.round(60 + 70 * f);
  return `rgb(${r}, ${g}, ${b})`;
}

function drawFavorWindow(ctx, layout, sim) {
  const { frame, titleBar, close } = layout;
  drawWindowShell(ctx, frame, titleBar, close, 'Favor of the Gods');
  ctx.textBaseline = 'middle';
  for (const row of layout.rows) {
    const info = GOD_INFO[row.god];
    const favor = sim.favor[row.god];
    const frac = favor / FAVOR_MAX;
    ctx.fillStyle = CHROME.ink;
    ctx.font = fpx(13);
    const label = info.label;
    ctx.fillText(label, frame.x + layout.pad, row.y + sc(8));
    const labelW = ctx.measureText(label).width;
    // The numeric favor readout, right beside the god's name (M7), clear of the wrath label.
    ctx.font = fpx(11);
    const fnum = `${Math.round(favor)}/${FAVOR_MAX}`;
    ctx.fillText(fnum, frame.x + layout.pad + labelW + sc(10), row.y + sc(8));
    ctx.fillStyle = CHROME.deepFrame;
    const wname = `Wrath: ${info.wrath}`;
    ctx.fillText(wname, frame.x + frame.w - layout.pad - ctx.measureText(wname).width, row.y + sc(8));
    // The favor meter.
    const b = row.bar;
    drawBevel(ctx, b.x, b.y, b.w, b.h, true);
    ctx.fillStyle = favorColor(frac);
    ctx.fillRect(b.x + 2, b.y + 2, Math.max(0, (b.w - 4) * frac), b.h - 4);
    // The appeasement hint, or (once a god is angry) the omen the town is living through. These are
    // full sentences; wrap them to the panel width across up to two lines so they never clip (M8).
    const stage = favorStage(favor);
    const angry = stage === FAVOR_STAGE.OMEN || stage === FAVOR_STAGE.DIRE;
    ctx.fillStyle = angry ? '#8a2a22' : CHROME.ink;
    const hint = angry ? (stage === FAVOR_STAGE.DIRE ? info.dire : info.omen) : info.appease;
    ctx.font = fpx(11);
    wrapMono(hint, frame.w - layout.pad * 2, sc(11), 2).forEach((ln, li) =>
      ctx.fillText(ln, frame.x + layout.pad, b.y + b.h + sc(10) + li * sc(13)));
  }
}

// The Summon a Wrath menu: a button per god's wrath (the reference's disasters menu, and the hook
// that lets a test or a curious player loose any wrath on demand).
function buildDisasterMenu(viewportW, viewportH) {
  const w = sc(300);
  const titleH = sc(20);
  const pad = sc(PANEL_PAD);
  const btnH = sc(30);
  const gap = sc(8);
  const headerH = sc(44); // the caution line (wraps to two lines at wide chrome scales, M8)
  const h = titleH + pad + headerH + GOD_LIST.length * (btnH + gap) + pad;
  const x = Math.round((viewportW - w) / 2);
  const y = Math.max(34, Math.round((viewportH - h) / 2));
  const rows = GOD_LIST.map((god, i) => ({
    god,
    rect: { x: x + pad, y: y + titleH + pad + headerH + i * (btnH + gap), w: w - pad * 2, h: btnH },
  }));
  return {
    frame: { x, y, w, h },
    titleBar: { x, y, w, h: titleH },
    close: { x: x + w - titleH + sc(3), y: y + sc(3), w: titleH - sc(6), h: titleH - sc(6) },
    rows, pad, titleH, headerH,
  };
}

function disasterHit(layout, px, py) {
  if (inRect(layout.close, px, py)) return { type: 'close' };
  for (const r of layout.rows) if (inRect(r.rect, px, py)) return { type: 'summon', god: r.god };
  return null;
}

function overDisaster(layout, px, py) {
  return inRect(layout.frame, px, py);
}

function drawDisasterMenu(ctx, layout) {
  const { frame, titleBar, close } = layout;

// Continue (when a save exists), and Quickstart. Everything uses the existing chrome palette
// and bevel register; no external art, no copied assets.
function buildTitleScreen(viewportW, viewportH, { canContinue = false } = {}) {
  const w = Math.min(viewportW - sc(40), sc(520));

  const x = Math.round((viewportW - w) / 2);
  const y = Math.max(sc(20), Math.round((viewportH - h) / 2));
  const wordmark = { x: x + pad, y: y + pad, w: w - pad * 2, h: wordmarkH };
  const tagline = { x: x + pad, y: wordmark.y + wordmark.h, w: w - pad * 2, h: taglineH };
  const newGame = { x: x + pad, y: tagline.y + taglineH + pad, w: w - pad * 2, h: buttonH };
  const continueGame = { x: x + pad, y: newGame.y + buttonH + gap, w: w - pad * 2, h: buttonH };
  const quickstart = { x: x + pad, y: continueGame.y + buttonH + gap, w: w - pad * 2, h: buttonH };

function titleScreenHit(layout, px, py) {

// Pixel-font wordmark for the title plate. Drawn entirely with canvas rectangles: chunky
// block lettering with a sea-green/verdigris face, a deep extrusion for depth, and a slow
// horizontal phosphor sheen. Stilled when reduced motion is requested.
const WORDMARK_GLYPHS = {
  I: ['..#..', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..'],
  N: ['#...#', '##..#', '#.#.#', '#..##', '#...#', '#...#', '#...#'],
  S: ['.###.', '#...#', '#....', '.###.', '....#', '#...#', '.###.'],
  M: ['#...#', '##.##', '#.#.#', '#...#', '#...#', '#...#', '#...#'],
  O: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
  U: ['#...#', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
  T: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..'],
  H: ['#...#', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
  '2': ['.###.', '#...#', '....#', '...#.', '..#..', '.#...', '#####'],
  '0': ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
};
const WORDMARK_FACE = '#4d8a7a';
const WORDMARK_HI = '#8fdcc2';
const WORDMARK_SHADOW = '#2a524a';
const WORDMARK_EXTRUDE = '#152e30';

function wordmarkLineUnits(text, gap) {
  let u = 0;
  for (let i = 0; i < text.length; i++) {
    const g = WORDMARK_GLYPHS[text[i]];
    u += g ? g[0].length : (text[i] === ' ' ? 2 : 0);
    if (i < text.length - 1) u += gap;
  }
  return u;
}

function drawWordmark(ctx, rect, opts = {}) {
  const { now = 0, reducedMotion = false } = opts;
  const top = 'INNSMOUTH';
  const bot = '2000';
  const GW = 5;
  const GH = 7;
  const GAP = 1;
  const topU = wordmarkLineUnits(top, GAP);
  const botU = wordmarkLineUnits(bot, GAP);

  // The main title owns the upper two-thirds; the year sits smaller beneath it.
  const topShare = 0.66;
  const botShare = 0.30;
  const topH = rect.h * topShare;
  const botH = rect.h * botShare;

  let uTop = Math.min((rect.w - 4) / topU, topH / GH);
  let uBot = Math.min((rect.w - 4) / botU, botH / GH, uTop * 0.55);
  uTop = Math.max(1, Math.floor(uTop));
  uBot = Math.max(1, Math.floor(uBot));

  const drawLine = (text, u, yBase, topUnit) => {
    const units = wordmarkLineUnits(text, GAP);
    const lineW = units * u;
    const x0 = rect.x + Math.round((rect.w - lineW) / 2);
    const e = Math.max(1, Math.min(3, Math.round(u * 0.22)));
    const bev = Math.max(1, Math.min(3, Math.round(u * 0.14)));
    const phase = reducedMotion ? -1 : ((now % 7000) / 7000);
    const bandX = phase < 0 ? -9999 : rect.x + rect.w * phase;
    const bandW = u * 3;

    // Extrusion first, so it sits behind the faces.
    ctx.fillStyle = WORDMARK_EXTRUDE;
    let gx = x0;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const g = WORDMARK_GLYPHS[ch];
      if (!g) { gx += (ch === ' ' ? 2 : 0) * u; continue; }
      for (let r = 0; r < GH; r++) {
        for (let c = 0; c < g[r].length; c++) {
          if (g[r][c] !== '#') continue;
          const x = gx + c * u + e;
          const y = yBase + r * u + e;
          ctx.fillRect(x, y, u, u);
        }
      }
      gx += (g[0].length + GAP) * u;
    }

    // Faces, with per-block bevel and a slow sheen.
    gx = x0;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const g = WORDMARK_GLYPHS[ch];
      if (!g) { gx += (ch === ' ' ? 2 : 0) * u; continue; }
      for (let r = 0; r < GH; r++) {
        for (let c = 0; c < g[r].length; c++) {
          if (g[r][c] !== '#') continue;
          const x = gx + c * u;
          const y = yBase + r * u;
          const cx = x + u / 2;
          const shimmer = Math.abs(cx - bandX) < bandW / 2;
          ctx.fillStyle = shimmer ? WORDMARK_HI : WORDMARK_FACE;
          ctx.fillRect(x, y, u, u);
          if (u >= 3) {
            ctx.fillStyle = WORDMARK_HI;
            ctx.fillRect(x, y, u, bev);
            ctx.fillRect(x, y, bev, u);
            ctx.fillStyle = WORDMARK_SHADOW;
            ctx.fillRect(x + u - bev, y, bev, u);
            ctx.fillRect(x, y + u - bev, u, bev);
          }
        }
      }
      gx += (g[0].length + GAP) * u;
    }
  };

  const topW = topU * uTop;
  const topX = rect.x + Math.round((rect.w - topW) / 2);
  const topY = rect.y + Math.round((topH - GH * uTop) / 2);
  drawLine(top, uTop, topY, true);

  const botW = botU * uBot;
  const botX = rect.x + Math.round((rect.w - botW) / 2);
  const botY = rect.y + Math.round(topH + (rect.h - topH - botH) / 2 + (botH - GH * uBot) / 2);
  drawLine(bot, uBot, botY, false);
}

function drawTitleScreen(ctx, layout, opts = {}) {
  const { frame, wordmark, tagline } = layout;
  // Dark scrim across the whole canvas so the plate reads over the rendered town backdrop.
  ctx.fillStyle = 'rgba(10,8,14,0.72)';
  ctx.fillRect(0, 0, ctx.canvas ? ctx.canvas.width : frame.x * 2 + frame.w, ctx.canvas ? ctx.canvas.height : frame.y * 2 + frame.h);
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillRect(frame.x - 1, frame.y - 1, frame.w + 2, frame.h + 2);
  drawBevel(ctx, frame.x, frame.y, frame.w, frame.h, false);

  // Wordmark: code-drawn block lettering with sea-green depth and shimmer.
  drawWordmark(ctx, wordmark, opts);

  // Tagline.
  ctx.fillStyle = CHROME.ink;
  ctx.font = fpx(12);
  ctx.textBaseline = 'middle';
  ctx.fillText('A rotting Massachusetts coast town, 1926.', tagline.x, tagline.y + tagline.h / 2 + 1);

  const button = (rect, label, enabled = true) => {
    drawBevel(ctx, rect.x, rect.y, rect.w, rect.h, !enabled);
    ctx.fillStyle = enabled ? CHROME.ink : CHROME.bevelShadow;
    ctx.font = fpx(14);
    ctx.textBaseline = 'middle';
    ctx.fillText(label, rect.x + sc(PANEL_PAD), rect.y + rect.h / 2 + 1);
  };
  button(layout.newGame, 'New Game');
  button(layout.continueGame, layout.canContinue ? 'Continue' : 'Continue (no saved town)', layout.canContinue);
  button(layout.quickstart, 'Quickstart');

  // Version / credit footer.
  ctx.fillStyle = CHROME.bevelShadow;
  ctx.font = fpx(11);
  ctx.textBaseline = 'middle';
  ctx.fillText('Version 0.1.0. By Innsmouth Works.', layout.footer.x, layout.footer.y + layout.footer.h / 2 + 1);
}

// A window frame + title bar + close box, shared by the M6 windows.
function drawWindowShell(ctx, frame, titleBar, close, title) {
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillRect(frame.x - 1, frame.y - 1, frame.w + 2, frame.h + 2);
  drawBevel(ctx, frame.x, frame.y, frame.w, frame.h, false);
  ctx.fillStyle = CHROME.titleBar;
  ctx.fillRect(titleBar.x + 2, titleBar.y + 2, titleBar.w - 4, titleBar.h - 2);
  ctx.fillStyle = CHROME.titleText;
  ctx.font = fpx(13);
  ctx.textBaseline = 'middle';
  ctx.fillText(title, titleBar.x + sc(PANEL_PAD), titleBar.y + titleBar.h / 2 + 1);
  drawBevel(ctx, close.x, close.y, close.w, close.h, false);
  ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(close.x + 3, close.y + 3); ctx.lineTo(close.x + close.w - 3, close.y + close.h - 3);
  ctx.moveTo(close.x + close.w - 3, close.y + 3); ctx.lineTo(close.x + 3, close.y + close.h - 3);
  ctx.stroke();
}


// ===== src/overlays.js =====
// Map overlays for INNSMOUTH 2000 (M7): the minimap, the demand indicator, and the newspaper.
// Layout, projection, and hit-testing are pure (node --test covers them); the ctx drawing is
// browser-side. These are the three clickable overlays the milestone adds; the click/drag
// regression harness (test/overlays.test.js) exercises their hit-testing.





const MINI_PAD = 4;

// The scar colours on the minimap (aftermath reads at a glance).
const SCAR_COLOR = {
  burnt: '#241c18', overgrown: '#3a5a2a', rubble: '#5a5048', flooded: '#356b64', rift: '#5a3a7a',
};

// --- the minimap -------------------------------------------------------------------------
// A whole-map thumbnail docked bottom-right, above the status strip and the reserved herald row.
// Click it to recenter the camera on that quarter of the town.
function buildMinimap(viewportW, viewportH, mapCols, mapRows, opts = {}) {
  const bottomInset = opts.bottomInset ?? 30;
  const scale = opts.scale ?? 1;
  const innerW = Math.round((opts.size ?? 132) * scale);
  const innerH = Math.round(innerW * (mapRows / mapCols));
  const w = innerW + MINI_PAD * 2;
  const h = innerH + MINI_PAD * 2;
  const x = viewportW - w - 8;
  const y = viewportH - h - bottomInset - 8;
  return {
    frame: { x, y, w, h },
    inner: { x: x + MINI_PAD, y: y + MINI_PAD, w: innerW, h: innerH },
    cols: mapCols, rows: mapRows,
  };
}

function overMinimap(layout, px, py) { return inRect(layout.frame, px, py); }

// A minimap pixel -> tile (clamped in bounds). For click-to-recenter.
function minimapToTile(layout, px, py) {
  const { inner, cols, rows } = layout;
  const col = Math.max(0, Math.min(cols - 1, Math.floor((px - inner.x) / inner.w * cols)));
  const row = Math.max(0, Math.min(rows - 1, Math.floor((py - inner.y) / inner.h * rows)));
  return { col, row };
}

// A tile -> its centre pixel on the minimap. For drawing the camera viewport outline.
function tileToMinimap(layout, col, row) {
  const { inner, cols, rows } = layout;
  return { x: inner.x + (col + 0.5) / cols * inner.w, y: inner.y + (row + 0.5) / rows * inner.h };
}

// The colour of a tile on the minimap: water, then aftermath scars, then what stands on it,
// then the bare ground. Built lots read in their zone tint; empty zoning reads dimmer.
function miniColor(tile) {
  if (!tile) return CHROME.deepFrame;
  if (isWaterTerrain(tile.terrain)) return (RAMP[tile.terrain] || RAMP.deep)[BASE];
  if (tile.scar) return SCAR_COLOR[tile.scar.kind] || '#241c18';
  if (tile.structure) return '#d8d0c0';
  if (tile.building) return ZONE_TINT[tile.zone] || '#9ecf66';
  if (tile.object && tile.object.kind === 'road') return RAMP.dirt[BASE];
  if (tile.object) return '#241f1a';
  if (tile.zone) return dimTint(ZONE_TINT[tile.zone]);
  return RAMP[terrainRamp(tile.terrain)][BASE];
}

// A muted version of a zone tint (for zoned-but-unbuilt lots): halve toward the ground grey.
function dimTint(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 0xff), g = ((n >> 8) & 0xff), b = (n & 0xff);
  const mix = (c) => Math.round(c * 0.55 + 0x4f * 0.45);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}

// Draw the minimap. `viewCorners` is the four screen-corner tiles (in order) of the camera's
// visible region; drawn as a bright outline so the player sees where they are looking.
function drawMinimap(ctx, layout, map, viewCorners) {
  const { frame, inner, cols, rows } = layout;
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillRect(frame.x - 1, frame.y - 1, frame.w + 2, frame.h + 2);
  drawBevel(ctx, frame.x, frame.y, frame.w, frame.h, false);
  ctx.fillStyle = RAMP.deep[SHADOW];
  ctx.fillRect(inner.x, inner.y, inner.w, inner.h);
  const cw = inner.w / cols;
  const ch = inner.h / rows;
  const cwCeil = Math.ceil(cw);
  const chCeil = Math.ceil(ch);
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      ctx.fillStyle = miniColor(map.tileAt(col, row));
      ctx.fillRect(inner.x + col * cw, inner.y + row * ch, cwCeil, chCeil);
    }
  }
  if (viewCorners && viewCorners.length === 4) {
    ctx.strokeStyle = '#f4d67a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    viewCorners.forEach((c, i) => {
      const p = tileToMinimap(layout, c.col, c.row);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.stroke();
  }
}

// --- the demand indicator ----------------------------------------------------------------
// The reference's RCI gadget, transposed: three bars for the town's appetite to build
// Residential / Commercial / Industrial, and a thin class-mix bar below (who actually lives
// here: the Unwary, Cultists, Deep Ones), the game's core dial made visible. Docks bottom-left,
// above the status strip. Clicking it opens the Town Ledger (where the economy lives).
const CLASS_COLOR = { unwary: '#a98d6d', cultist: '#7a5a9a', deepone: '#4d8378', scholar: '#c3a8e0' };
const DEMAND_BARS = [
  { zone: 'residential', letter: 'R', color: ZONE_TINT.residential },
  { zone: 'commercial', letter: 'C', color: ZONE_TINT.commercial },
  { zone: 'industrial', letter: 'I', color: ZONE_TINT.industrial },
];

function buildDemand(viewportW, viewportH, opts = {}) {
  const scale = opts.scale ?? 1;
  const bottomInset = opts.bottomInset ?? 30;
  const w = Math.round(126 * scale);
  const h = Math.round(84 * scale);
  const x = 8;
  const y = viewportH - h - bottomInset - 8;
  return { frame: { x, y, w, h }, scale };
}

function overDemand(layout, px, py) { return inRect(layout.frame, px, py); }

function drawDemand(ctx, layout, sim) {
  const { frame, scale } = layout;
  const pad = Math.round(6 * scale);
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillRect(frame.x - 1, frame.y - 1, frame.w + 2, frame.h + 2);
  drawBevel(ctx, frame.x, frame.y, frame.w, frame.h, false);
  ctx.fillStyle = CHROME.ink;
  ctx.font = `${Math.round(11 * scale)}px monospace`;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('Demand', frame.x + pad, frame.y + Math.round(13 * scale));

  const demand = computeDemand(sim);
  const top = frame.y + Math.round(18 * scale);
  const barH = Math.round(40 * scale);
  const barW = Math.round(18 * scale);
  const gap = Math.round(10 * scale);
  const groupW = DEMAND_BARS.length * barW + (DEMAND_BARS.length - 1) * gap;
  let bx = frame.x + Math.round((frame.w - groupW) / 2);
  for (const b of DEMAND_BARS) {
    drawBevel(ctx, bx, top, barW, barH, true);
    const frac = Math.max(0, Math.min(1, demand[b.zone] || 0));
    const fh = Math.round((barH - 4) * frac);
    ctx.fillStyle = b.color;
    ctx.fillRect(bx + 2, top + barH - 2 - fh, barW - 4, fh);
    ctx.fillStyle = CHROME.ink;
    ctx.font = `${Math.round(10 * scale)}px monospace`;
    ctx.fillText(b.letter, bx + barW / 2 - Math.round(3 * scale), top + barH + Math.round(11 * scale));
    bx += barW + gap;
  }

  // The class-mix bar: segments proportional to who lives here (0 when the town is empty).
  const total = sim.pop.unwary + sim.pop.cultist + sim.pop.deepone + sim.pop.scholar;
  const mx = frame.x + pad;
  const mw = frame.w - pad * 2;
  const my = frame.y + frame.h - Math.round(9 * scale);
  const mh = Math.round(5 * scale);
  drawBevel(ctx, mx, my, mw, mh, true);
  if (total > 0) {
    let seg = mx + 1;
    for (const cls of ['unwary', 'cultist', 'deepone', 'scholar']) {
      const wseg = Math.round((mw - 2) * (sim.pop[cls] / total));
      if (wseg <= 0) continue;
      ctx.fillStyle = CLASS_COLOR[cls];
      ctx.fillRect(seg, my + 1, wseg, mh - 2);
      seg += wseg;
    }
  }
}

// --- The Innsmouth Courier (newspaper) ----------------------------------------------------
// A masthead ticker under the top bar shows the latest headline; a click opens the full paper.
// The Courier's voice is a dry New England broadsheet sliding into cosmic dread. Headlines come
// from real sim events (src/sim.js detectNews / summonWrath); this only renders them.
const NEWSPRINT = '#d8d2c2';
const NEWSPRINT_EDGE = '#8c8672';
const COURIER_MASTHEAD = 'THE INNSMOUTH COURIER';

// The month names for a headline's dateline (the sim carries month indices).
const MONTH_ABBR = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dateline(ev) { return `${MONTH_ABBR[ev.month] || '?'} ${ev.year}`; }

function buildCourierTicker(viewportW, topBarH, opts = {}) {
  const scale = opts.scale ?? 1;
  const h = Math.round(20 * scale);
  return { frame: { x: 0, y: topBarH, w: viewportW, h }, scale };
}

function overCourierTicker(layout, px, py) { return inRect(layout.frame, px, py); }

function drawCourierTicker(ctx, layout, latest) {
  const { frame, scale } = layout;
  ctx.fillStyle = NEWSPRINT;
  ctx.fillRect(frame.x, frame.y, frame.w, frame.h);
  ctx.fillStyle = NEWSPRINT_EDGE;
  ctx.fillRect(frame.x, frame.y + frame.h - 1, frame.w, 1);
  ctx.textBaseline = 'middle';
  const cy = frame.y + frame.h / 2 + 1;
  ctx.fillStyle = CHROME.ink;
  ctx.font = `${Math.round(11 * scale)}px monospace`;
  const tag = `${COURIER_MASTHEAD}:`;
  ctx.fillText(tag, frame.x + 8, cy);
  const tagW = ctx.measureText(tag).width;
  const line = latest ? latest.headline : 'All quiet along the shore. For now.';
  ctx.font = `${Math.round(11 * scale)}px monospace`;
  ctx.fillText(line, frame.x + 8 + tagW + 10, cy);
}

// The full Courier window: a masthead over a column of the most recent headlines (newest first).
function buildCourierWindow(viewportW, viewportH, opts = {}) {
  const scale = opts.scale ?? 1;
  const w = Math.round(460 * scale);
  const titleH = Math.round(40 * scale); // the masthead band
  const pad = Math.round(PANEL_PAD * scale); // the one shared padding standard (M10 sweep)
  const rows = opts.rows ?? 8;
  const rowH = Math.round(40 * scale);
  const h = titleH + pad + rows * rowH + pad;
  const x = Math.round((viewportW - w) / 2);
  const y = Math.max(34, Math.round((viewportH - h) / 2));
  const rowRects = [];
  for (let i = 0; i < rows; i++) rowRects.push({ y: y + titleH + pad + i * rowH, h: rowH });
  return {
    frame: { x, y, w, h },
    masthead: { x, y, w, h: titleH },
    close: { x: x + w - titleH + Math.round(10 * scale), y: y + Math.round(8 * scale), w: Math.round(18 * scale), h: Math.round(18 * scale) },
    rows: rowRects, pad, titleH, scale, capacity: rows,
  };
}

function courierHit(layout, px, py) {
  if (inRect(layout.close, px, py)) return { type: 'close' };
  return null;
}

function overCourier(layout, px, py) { return inRect(layout.frame, px, py); }

function drawCourierWindow(ctx, layout, events) {
  const { frame, masthead, close, scale } = layout;
  ctx.fillStyle = NEWSPRINT_EDGE;
  ctx.fillRect(frame.x - 2, frame.y - 2, frame.w + 4, frame.h + 4);
  ctx.fillStyle = NEWSPRINT;
  ctx.fillRect(frame.x, frame.y, frame.w, frame.h);
  // Masthead.
  ctx.fillStyle = CHROME.ink;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.font = `${Math.round(20 * scale)}px monospace`;
  ctx.fillText(COURIER_MASTHEAD, frame.x + frame.w / 2, masthead.y + masthead.h / 2);
  ctx.textAlign = 'left';
  ctx.fillStyle = NEWSPRINT_EDGE;
  ctx.fillRect(frame.x + layout.pad, masthead.y + masthead.h - 2, frame.w - layout.pad * 2, 2);
  // Close box.
  ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
  ctx.strokeRect(close.x, close.y, close.w, close.h);
  ctx.beginPath();
  ctx.moveTo(close.x + 3, close.y + 3); ctx.lineTo(close.x + close.w - 3, close.y + close.h - 3);
  ctx.moveTo(close.x + close.w - 3, close.y + 3); ctx.lineTo(close.x + 3, close.y + close.h - 3);
  ctx.stroke();
  // Headlines, newest first.
  const recent = events.slice(-layout.capacity).reverse();
  const lx = frame.x + layout.pad;
  const rx = frame.x + frame.w - layout.pad;
  if (recent.length === 0) {
    ctx.fillStyle = CHROME.ink;
    ctx.font = `${Math.round(13 * scale)}px monospace`;
    ctx.fillText('No news of note. The town keeps to itself.', lx, layout.rows[0].y + Math.round(16 * scale));
    return;
  }
  recent.forEach((ev, i) => {
    if (i >= layout.rows.length) return;
    const r = layout.rows[i];
    ctx.fillStyle = CHROME.ink;
    ctx.textBaseline = 'alphabetic';
    ctx.font = `${Math.round(14 * scale)}px monospace`;
    ctx.fillText(ev.headline, lx, r.y + Math.round(15 * scale));
    // The dateline, right-aligned on the headline row.
    ctx.font = `${Math.round(10 * scale)}px monospace`;
    ctx.fillStyle = NEWSPRINT_EDGE;
    const dl = dateline(ev);
    ctx.fillText(dl, rx - ctx.measureText(dl).width, r.y + Math.round(15 * scale));
    // The subhead.
    if (ev.sub) {
      ctx.fillStyle = CHROME.ink;
      ctx.font = `${Math.round(11 * scale)}px monospace`;
      ctx.fillText(ev.sub, lx, r.y + Math.round(30 * scale));
    }
    // A thin rule under each story.
    ctx.fillStyle = NEWSPRINT_EDGE;
    ctx.fillRect(lx, r.y + r.h - Math.round(4 * scale), frame.w - layout.pad * 2, 1);
  });
  ctx.textBaseline = 'middle';
}

// --- the end screen (M8: the Cthulhu doom clock) ------------------------------------------
// When the dreamer fully wakes (sim.ended), the map dims and a centred plate names the end and how
// many years the town stood. Text is fit/wrapped to the plate so it never clips (the detector guards
// it at every viewport and scale). Pure layout + a canvas-injected draw.
function buildEndScreen(viewportW, viewportH, opts = {}) {
  const scale = opts.scale ?? 1;
  const w = Math.min(viewportW - 80, Math.round(560 * scale));
  const h = Math.round(180 * scale);
  const x = Math.round((viewportW - w) / 2);
  const y = Math.max(40, Math.round((viewportH - h) / 2));
  return { frame: { x, y, w, h }, scale, viewportW, viewportH };
}

function drawEndScreen(ctx, layout, ended, foundedYear = 1927) {
  const { frame, scale, viewportW, viewportH } = layout;
  // A dark wash over the whole map.
  ctx.fillStyle = 'rgba(10,8,14,0.72)';
  ctx.fillRect(0, 0, viewportW, viewportH);
  // The plate.
  ctx.fillStyle = NEWSPRINT_EDGE;
  ctx.fillRect(frame.x - 2, frame.y - 2, frame.w + 4, frame.h + 4);
  drawBevel(ctx, frame.x, frame.y, frame.w, frame.h, false);
  const pad = Math.round(18 * scale);
  const inner = frame.w - pad * 2;
  const cx = frame.x + frame.w / 2;
  const years = Math.max(0, (ended && ended.year ? ended.year : foundedYear) - foundedYear);
  // Title.
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#8a2a22';
  const titlePx = Math.round(20 * scale);
  ctx.font = `${titlePx}px monospace`;
  ctx.fillText(fitMono('INNSMOUTH IS LOST', inner, titlePx), cx, frame.y + Math.round(40 * scale));
  // Body: the cry and the tally, wrapped to the plate.
  ctx.fillStyle = CHROME.ink;
  const bodyPx = Math.round(13 * scale);
  ctx.font = `${bodyPx}px monospace`;
  const cry = 'R’lyeh has risen. The dreamer wakes, and the town is given over to the sea and the dark.';
  let yy = frame.y + Math.round(70 * scale);
  for (const ln of wrapMono(cry, inner, bodyPx, 3)) {
    ctx.fillText(ln, cx, yy);
    yy += Math.round(18 * scale);
  }
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillText(fitMono(`The town stood ${years} years.`, inner, bodyPx), cx, yy + Math.round(6 * scale));
  ctx.textAlign = 'left';
}

// --- first-contact onboarding banner (M7) -------------------------------------------------
// A soft, dismissable in-fiction prompt, shown one at a time just under the Courier ticker.
function buildOnboarding(viewportW, topOffset, opts = {}) {
  const scale = opts.scale ?? 1;
  const w = Math.min(viewportW - 40, Math.round(720 * scale));
  const h = Math.round(46 * scale);
  const x = Math.round((viewportW - w) / 2);
  const y = topOffset + Math.round(12 * scale);
  return { frame: { x, y, w, h }, scale };
}

function overOnboarding(layout, px, py) { return inRect(layout.frame, px, py); }

function drawOnboarding(ctx, layout, text) {
  const { frame, scale } = layout;
  ctx.fillStyle = NEWSPRINT_EDGE;
  ctx.fillRect(frame.x - 2, frame.y - 2, frame.w + 4, frame.h + 4);
  ctx.fillStyle = NEWSPRINT;
  ctx.fillRect(frame.x, frame.y, frame.w, frame.h);
  const pad = Math.round(10 * scale);
  ctx.fillStyle = CHROME.ink;
  ctx.textBaseline = 'alphabetic';
  ctx.font = `${Math.round(12 * scale)}px monospace`;
  ctx.fillText(text, frame.x + pad, frame.y + Math.round(20 * scale));
  ctx.fillStyle = NEWSPRINT_EDGE;
  ctx.font = `${Math.round(10 * scale)}px monospace`;
  const note = '(click to dismiss)';
  ctx.fillText(note, frame.x + frame.w - pad - ctx.measureText(note).width, frame.y + frame.h - Math.round(8 * scale));
  ctx.textBaseline = 'middle';
}


// ===== src/strips.js =====
// The two bottom bands of chrome for INNSMOUTH 2000: the status strip and the herald band above it.
// Pulled out of main.js so the text-overflow detector (test/text-overflow.test.js) can exercise them
// as pure, canvas-injected draws. They span the full viewport width, so the risk they carry is not a
// side escape but a long line clipping off the right edge; the detector fits each to the viewport.
//
// Player-facing wording stays plain English, period register, no em-dashes (hard rule 10).



// The height of the bottom status strip at a given chrome scale (the herald band stacks above it).
function statusStripH(scale) { return Math.round(22 * scale); }

// The height of the herald band.
function heraldBandH(scale) { return Math.round(20 * scale); }

// The OS-chrome status strip along the bottom (STUDY 3): tool, zoom, hovered tile, last refusal.
// The refusal lives here in its own slot; it is never overwritten by a wrath cry (that goes to the
// herald band above). Scales with the chrome text-size setting so it holds the 11-13px floor.
function drawStatusStrip(ctx, camera, hover, map, tool, message, scale = 1) {
  const h = statusStripH(scale);
  const y = camera.viewportH - h;
  ctx.fillStyle = CHROME.windowFace;
  ctx.fillRect(0, y, camera.viewportW, h);
  ctx.fillStyle = CHROME.bevelLight;
  ctx.fillRect(0, y, camera.viewportW, 2);
  ctx.fillStyle = CHROME.bevelShadow;
  ctx.fillRect(0, camera.viewportH - 2, camera.viewportW, 2);
  ctx.fillStyle = CHROME.ink;
  const px = Math.round(13 * scale);
  ctx.font = `${px}px monospace`;
  ctx.textBaseline = 'middle';
  const toolLabel = (TOOLBAR_TOOLS.find((t) => t.tool === tool) || {}).label || tool;
  let label = `INNSMOUTH   ${toolLabel}   zoom ${camera.zoom}x`;
  if (hover && map.inBounds(hover.col, hover.row)) {
    const t = map.tileAt(hover.col, hover.row);
    label += `   ${hover.col},${hover.row} ${t.terrain}`;
  }
  if (message) label += `   ${message}`;
  ctx.fillText(fitMono(label, camera.viewportW - 16, px), 8, y + h / 2 + 1);
}

// The herald band, just above the status strip: the world's own voice. A wrath in progress cries
// in blood red; a god sinking toward wrath speaks an omen in a sick amber. This is the forecast
// ritual made visible: the player is warned by the town before the disaster ever lands.
function drawHeraldLine(ctx, camera, text, tone, scale = 1) {
  const h = heraldBandH(scale);
  const y = camera.viewportH - statusStripH(scale) - h;
  const face = tone === 'wrath' ? '#3a1613' : '#3a3113';
  const ink = tone === 'wrath' ? '#f0c0a8' : '#e6d69a';
  const edge = tone === 'wrath' ? '#8a2a22' : '#8a7422';
  ctx.fillStyle = face;
  ctx.fillRect(0, y, camera.viewportW, h);
  ctx.fillStyle = edge;
  ctx.fillRect(0, y, camera.viewportW, 2);
  ctx.fillStyle = ink;
  const px = Math.round(13 * scale);
  ctx.font = `${px}px monospace`;
  ctx.textBaseline = 'middle';
  const tag = tone === 'wrath' ? 'WRATH' : 'OMEN';
  ctx.fillText(fitMono(`${tag}   ${text}`, camera.viewportW - 16, px), 8, y + h / 2 + 1);
}


// ===== src/save.js =====
// Save / load for INNSMOUTH 2000 (M8).
//
// A save is a plain JSON-safe snapshot: the map tiles, the full sim state, and the RNG's internal
// state, so a loaded game resumes to a bit-identical future (the same seeded stream continues). The
// non-serialized power grid is recomputed on load (it is derived, refreshed every step anyway). The
// contract the milestone gates: a mid-disaster save (sim.disaster.{age,maxAge,front} mid-crawl)
// round-trips clean. Pure of DOM; main.js handles the storage and the player feedback.




const SAVE_VERSION = 1;

// The sim fields that carry the game's state. Everything stochastic is captured (rngState below);
// `map`, `rng`, and the derived `power` are handled separately.
const SIM_FIELDS = [
  'year', 'foundedYear', 'month', 'tick', 'speed', 'scenario', 'dreadBase', 'dread',
  'pop', 'counts', 'treasury', 'taxRates', 'ordinances', 'bankruptMonths', 'servicesCut',
  'favor', 'pendingWrath', 'disaster', 'lastWrath', 'events', 'hints', 'onboarded',
  'wrath', 'awakenings', 'survivalNoted', 'ended', 'flavorIndex', 'lastFlavorTick', 'autoSlow',
];

// Snapshot a sim to a JSON-safe object. The JSON round-trip both decouples the save from live state
// (no aliasing) and guarantees nothing un-serializable slipped in.
function saveGame(sim) {
  const data = {
    version: SAVE_VERSION,
    rngState: sim.rng.getState(),
    map: { cols: sim.map.cols, rows: sim.map.rows, tiles: sim.map.tiles },
    sim: {},
  };
  for (const f of SIM_FIELDS) data.sim[f] = sim[f];
  // A crawling Greening/Burning carries a Set of consumed tiles (JSON drops Sets); store it as an
  // array so a mid-crawl disaster survives the trip, and rebuild the Set on load.
  if (sim.disaster && sim.disaster.consumedSet instanceof Set) {
    data.sim.disaster = { ...sim.disaster, consumedSet: [...sim.disaster.consumedSet] };
  }
  return JSON.parse(JSON.stringify(data));
}

// Rebuild a sim from a snapshot. Throws on a missing or version-mismatched save.
function loadGame(input) {
  if (!input || input.version !== SAVE_VERSION) {
    throw new Error('This save is from another version of Innsmouth and cannot be read.');
  }
  const data = JSON.parse(JSON.stringify(input)); // decouple from the caller's object
  const map = new GameMap(data.map.cols, data.map.rows);
  map.tiles = data.map.tiles;
  const sim = makeSim(map, { seed: 0 });
  for (const f of SIM_FIELDS) if (data.sim[f] !== undefined) sim[f] = data.sim[f];
  if (sim.disaster && Array.isArray(sim.disaster.consumedSet)) {
    sim.disaster.consumedSet = new Set(sim.disaster.consumedSet);
  }
  sim.rng.setState(data.rngState);
  sim.power = computePower(map); // the derived power grid is not serialized; recompute it
  return sim;
}

// Convenience for the browser: serialize to / from a string for localStorage.
function serializeSave(sim) { return JSON.stringify(saveGame(sim)); }
function deserializeSave(text) { return loadGame(JSON.parse(text)); }


// ===== src/advisor.js =====
// The Old Priest advisor for INNSMOUTH 2000 (M8, STUDY 3.7 / DESIGN-SEED register).
//
// A portrait-plus-text advisory popup. The Old Priest counsels appeasement in even tones: he reads
// the town's state and names, without alarm, the one thing most worth tending — the angriest god
// and its path, an empty treasury, the stirring dreamer, or a plain reassurance when all is well.
// `advise` is pure over sim (node --test covers it); the window is canvas-injected chrome guarded by
// the text-overflow detector. Player-facing wording is plain, period, no em-dashes (hard rule 10).




// The Old Priest's counsel: a short list of even-toned lines, most-urgent first, always closing on
// the same steady refrain. Pure over sim state.
function advise(sim) {
  const title = 'The Old Priest';
  if (sim.ended) {
    return { title, lines: [
      'It is done. The dreamer has waked, and the sea has taken the town.',
      'There is no counsel left, only the long dark. We knew it would come.',
    ] };
  }
  const lines = [];
  const fc = wrathForecast(sim);
  const worst = fc.gods.find((g) => g.stage === FAVOR_STAGE.DIRE)
    || fc.gods.find((g) => g.stage === FAVOR_STAGE.OMEN);
  if (worst) {
    const info = GOD_INFO[worst.god];
    const lead = worst.stage === FAVOR_STAGE.DIRE ? 'is nearly upon us' : 'grows restless';
    lines.push(`${info.label} ${lead}. ${info.appease}`);
  }
  if (sim.treasury < 0 || sim.servicesCut) {
    lines.push('The coffers are empty and the watch goes unpaid. Set the ledger right before all else.');
  }
  if (sim.awakenings > 0) {
    const left = DOOM_AWAKENINGS - sim.awakenings;
    lines.push(left > 0
      ? `The great dreamer has stirred ${sim.awakenings} times. Slow him with asylums, shrines, and the university; we cannot stop him.`
      : 'The dreaming is ended, and so are we.');
  }
  if (!worst && sim.dread >= 45) {
    lines.push('Dread runs high in the lanes. Raise a chapel, or hold the Masked Processions, and let it settle.');
  }
  if (lines.length === 0) {
    lines.push('The town keeps well enough for now. The gods are quiet, and the streets are calm.');
  }
  lines.push('Appease them all, each in its turn. That is the whole of it.');
  return { title, lines };
}

// The advisor window: a portrait well on the left, the counsel wrapped to the column on the right.
// Sized to its text so nothing clips (M8). Pure geometry.
const PORTRAIT = 96; // the portrait well's base size (scaled)

function buildAdvisorWindow(viewportW, viewportH, opts = {}) {
  const scale = opts.scale ?? 1;
  const s = (px) => Math.round(px * scale);
  const titleH = s(20);
  const pad = s(PANEL_PAD); // the one shared padding standard (M10 sweep), scaled by this window's own s()
  const portrait = s(PORTRAIT);
  const w = Math.min(viewportW - 40, s(440));
  const textX = pad + portrait + pad;
  const textW = w - textX - pad;
  const lines = Array.isArray(opts.lines) ? opts.lines : [];
  // Wrap every counsel line to the text column; the taller of the text block or the portrait sets
  // the body height.
  const wrapped = lines.flatMap((l) => wrapMono(l, textW, s(13), 4));
  const textH = wrapped.length * s(18) + s(6);
  const bodyH = Math.max(textH, portrait) + pad * 2;
  const h = titleH + bodyH;
  const x = Math.round((viewportW - w) / 2);
  const y = Math.max(34, Math.round((viewportH - h) / 2));
  return {
    frame: { x, y, w, h },
    titleBar: { x, y, w, h: titleH },
    close: { x: x + w - titleH + s(3), y: y + s(3), w: titleH - s(6), h: titleH - s(6) },
    portraitWell: { x: x + pad, y: y + titleH + pad, w: portrait, h: portrait },
    textX: x + textX, textY: y + titleH + pad, textW,
    wrapped, scale, s, pad,
  };
}

function advisorHit(layout, px, py) {
  if (inRect(layout.close, px, py)) return { type: 'close' };
  return null;
}
function overAdvisor(layout, px, py) { return inRect(layout.frame, px, py); }

// A code-drawn portrait of the Old Priest: a hooded, robed figure with an ashen, lined face, set in
// a recessed well. No bitmap assets (clean-room, hard rule 1); all primitives.
function drawPriestPortrait(ctx, well) {
  const { x, y, w, h } = well;
  drawBevel(ctx, x, y, w, h, true); // a recessed well
  ctx.save();
  ctx.beginPath();
  ctx.rect(x + 2, y + 2, w - 4, h - 4);
  ctx.clip();
  // A cold, damp backdrop.
  ctx.fillStyle = RAMP.slate[SHADOW];
  ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  const cx = x + w / 2;
  const u = w / 100; // a unit so the portrait scales with the well
  // The robe: a broad dark trapezoid rising to the shoulders.
  ctx.fillStyle = RAMP.clapboard[SHADOW];
  ctx.beginPath();
  ctx.moveTo(cx - 42 * u, y + h - 2);
  ctx.lineTo(cx - 26 * u, y + 46 * u);
  ctx.lineTo(cx + 26 * u, y + 46 * u);
  ctx.lineTo(cx + 42 * u, y + h - 2);
  ctx.closePath();
  ctx.fill();
  // The hood: a darker cowl framing the face.
  ctx.fillStyle = RAMP.slate[BASE];
  ctx.beginPath();
  ctx.moveTo(cx - 30 * u, y + 52 * u);
  ctx.quadraticCurveTo(cx - 30 * u, y + 10 * u, cx, y + 8 * u);
  ctx.quadraticCurveTo(cx + 30 * u, y + 10 * u, cx + 30 * u, y + 52 * u);
  ctx.quadraticCurveTo(cx, y + 40 * u, cx - 30 * u, y + 52 * u);
  ctx.closePath();
  ctx.fill();
  // The face: an ashen oval, sunken.
  ctx.fillStyle = '#b9b3a2';
  ctx.beginPath();
  ctx.ellipse(cx, y + 34 * u, 17 * u, 22 * u, 0, 0, Math.PI * 2);
  ctx.fill();
  // Shadowed brow and gaunt cheeks.
  ctx.fillStyle = 'rgba(40,44,40,0.30)';
  ctx.beginPath();
  ctx.ellipse(cx, y + 23 * u, 17 * u, 7 * u, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(40,44,40,0.16)'; // hollow cheeks
  ctx.beginPath(); ctx.ellipse(cx - 11 * u, y + 38 * u, 4 * u, 7 * u, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 11 * u, y + 38 * u, 4 * u, 7 * u, 0, 0, Math.PI * 2); ctx.fill();
  // Heavy brows over deep-set eyes.
  ctx.strokeStyle = '#6f6a5e'; ctx.lineWidth = Math.max(1, 1.6 * u);
  ctx.beginPath(); ctx.moveTo(cx - 11 * u, y + 27 * u); ctx.lineTo(cx - 3 * u, y + 28 * u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 3 * u, y + 28 * u); ctx.lineTo(cx + 11 * u, y + 27 * u); ctx.stroke();
  // Eyes: two dark, downcast pits.
  ctx.fillStyle = '#2a2622';
  ctx.beginPath(); ctx.ellipse(cx - 7 * u, y + 32 * u, 2.4 * u, 3 * u, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 7 * u, y + 32 * u, 2.4 * u, 3 * u, 0, 0, Math.PI * 2); ctx.fill();
  // A long nose and a grave, downturned mouth.
  ctx.strokeStyle = '#7a7466'; ctx.lineWidth = Math.max(1, 1.4 * u);
  ctx.beginPath(); ctx.moveTo(cx, y + 34 * u); ctx.lineTo(cx - 1.5 * u, y + 41 * u); ctx.stroke();
  ctx.strokeStyle = '#5a544a';
  ctx.beginPath(); ctx.moveTo(cx - 6 * u, y + 46 * u); ctx.quadraticCurveTo(cx, y + 43 * u, cx + 6 * u, y + 46 * u); ctx.stroke();
  // A long grey beard framing the jaw and falling to a point over the robe.
  ctx.fillStyle = '#9a9689';
  ctx.beginPath();
  ctx.moveTo(cx - 17 * u, y + 40 * u);
  ctx.quadraticCurveTo(cx - 16 * u, y + 66 * u, cx, y + 78 * u);
  ctx.quadraticCurveTo(cx + 16 * u, y + 66 * u, cx + 17 * u, y + 40 * u);
  ctx.quadraticCurveTo(cx, y + 56 * u, cx - 17 * u, y + 40 * u);
  ctx.closePath();
  ctx.fill();
  // A few strands of shadow in the beard.
  ctx.strokeStyle = 'rgba(60,58,50,0.5)'; ctx.lineWidth = Math.max(1, 1 * u);
  ctx.beginPath(); ctx.moveTo(cx - 6 * u, y + 50 * u); ctx.lineTo(cx - 4 * u, y + 70 * u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 6 * u, y + 50 * u); ctx.lineTo(cx + 4 * u, y + 70 * u); ctx.stroke();
  // A thin staff at his side.
  ctx.strokeStyle = RAMP.dirt[LIGHT];
  ctx.lineWidth = Math.max(1, 2 * u);
  ctx.beginPath();
  ctx.moveTo(x + w - 12 * u, y + 12 * u);
  ctx.lineTo(x + w - 18 * u, y + h - 4);
  ctx.stroke();
  ctx.restore();
}

function drawAdvisorWindow(ctx, layout, advice) {
  const { frame, titleBar, close, portraitWell, s } = layout;
  // Frame + title bar + close (same chrome as the other windows).
  ctx.fillStyle = CHROME.deepFrame;
  ctx.fillRect(frame.x - 1, frame.y - 1, frame.w + 2, frame.h + 2);
  drawBevel(ctx, frame.x, frame.y, frame.w, frame.h, false);
  ctx.fillStyle = CHROME.titleBar;
  ctx.fillRect(titleBar.x + 2, titleBar.y + 2, titleBar.w - 4, titleBar.h - 2);
  ctx.fillStyle = CHROME.titleText;
  ctx.font = `${s(13)}px monospace`;
  ctx.textBaseline = 'middle';
  ctx.fillText(fitMono(advice.title, titleBar.w - close.w - s(PANEL_PAD), s(13)), titleBar.x + s(PANEL_PAD), titleBar.y + titleBar.h / 2 + 1);
  drawBevel(ctx, close.x, close.y, close.w, close.h, false);
  ctx.strokeStyle = CHROME.ink; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(close.x + 3, close.y + 3); ctx.lineTo(close.x + close.w - 3, close.y + close.h - 3);
  ctx.moveTo(close.x + close.w - 3, close.y + 3); ctx.lineTo(close.x + 3, close.y + close.h - 3);
  ctx.stroke();
  // The portrait.
  drawPriestPortrait(ctx, portraitWell);
  // The counsel, pre-wrapped to the text column.
  ctx.fillStyle = CHROME.ink;
  ctx.textBaseline = 'alphabetic';
  ctx.font = `${s(13)}px monospace`;
  let yy = layout.textY + s(14);
  for (const ln of layout.wrapped) {
    ctx.fillText(ln, layout.textX, yy);
    yy += s(18);
  }
  ctx.textBaseline = 'middle';
}


// ===== src/music.js =====
// Music system for INNSMOUTH 2000 (M9.6, operator-directed).
//
// The operator supplies the music: eight .ogg tracks land in assets/music/ from an external
// pipeline (see assets/music/README.md). This module GENERATES and FETCHES no audio itself. It
// bands the game's state (title screen, the dread meter, the doom ending) into a mood, picks the
// track(s) for that mood, and crossfades between them. If assets/music/ is absent (a bare
// single-file open with no folder alongside it), the game runs silent — never an error.
//
// Two halves, deliberately separated:
//   - Pure logic (bandFor, tracksForBand, the settings [de]serializers): no DOM, node-testable.
//   - The DOM runtime (initMusic): <audio> elements, fades, localStorage. Browser-only, like the
//     rest of main.js's glue; mirrors main.js's own save/load try/catch around storage.

// --- the track catalog (operator-supplied filenames; see assets/music/README.md) --------------

const TRACKS = {
  title: 'title-gilman-house-lobby.ogg',
  calmA: 'calm-zoning-day.ogg',
  calmB: 'calm-b-falcon-point-morning.ogg',
  uneasyA: 'uneasy-marsh-refinery-at-dusk.ogg',
  uneasyB: 'uneasy-b-the-esoteric-order-hall.ogg',
  dread: 'dread-shadows-under-the-water.ogg',
  recoveryCalm: 'recovery-the-scarred-shore.ogg',
  doom: 'doom-the-fourth-awakening.ogg',
};

// --- band selection (pure) ----------------------------------------------------------------
// Two thresholds on the dread meter (0..100), chosen to land on sim.js's own dread lines: 30 is
// where the waterfront turns to the Deep Ones, 60 is where Scholars stop coming. Below 30 the town
// still reads calm; 30-59 it's uneasy; 60+ it's openly dreadful. The title screen and the doom
// ending both override the meter outright.
const DREAD_UNEASY = 30;
const DREAD_HIGH = 60;

// Hysteresis margin (dread points) on the EXIT side of a band only. sim.js's updateDread() eases
// dread toward a target that drifts with population/structure counts (updateDread(), sim.js
// ~line 524-533) and can sit almost exactly on 30 or 60 for a long real-play stretch; without a
// margin, a one-tick wobble across the line called retarget() -> a brand-new <audio> + crossfade
// every tick it flipped (empirically: ~1 Audio() construction per tick of wobble, verified via a
// fake-Audio probe — see PROGRESS.md "music retrigger fix"). Entry thresholds stay exact (30/60
// still means "enter" precisely there); only leaving a dread band requires crossing back past the
// threshold by this margin, so a boundary wobble smaller than the margin cannot retrigger.
const BAND_HYSTERESIS = 4;

const BAND = { TITLE: 'title', CALM: 'calm', UNEASY: 'uneasy', DREAD: 'dread', DOOM: 'doom' };

// state: { screen: 'title'|'play', dread: number, doom: boolean }. `doom` wins over everything
// (the ending is scored regardless of where the meter sits); `screen === 'title'` wins over dread
// (the picker has its own theme); otherwise the meter decides.
//
// `prevBand` (optional, defaults to null) is the band the caller was in a moment ago. Passing it
// enables hysteresis on the dread thresholds: once IN the uneasy or dread band, dread must fall
// back past DREAD_UNEASY/DREAD_HIGH minus BAND_HYSTERESIS to leave it, not just past the raw line.
// Omitting it (the default) reproduces the old stateless, exact-threshold behaviour exactly —
// every existing caller/test that doesn't pass a second argument is unaffected.
function bandFor(state = {}, prevBand = null) {
  if (state.doom) return BAND.DOOM;
  if (state.screen === 'title') return BAND.TITLE;
  const d = state.dread ?? 0;
  if (prevBand === BAND.DREAD) {
    if (d >= DREAD_HIGH - BAND_HYSTERESIS) return BAND.DREAD;
    return d >= DREAD_UNEASY ? BAND.UNEASY : BAND.CALM;
  }
  if (prevBand === BAND.UNEASY) {
    if (d >= DREAD_HIGH) return BAND.DREAD;
    return d >= DREAD_UNEASY - BAND_HYSTERESIS ? BAND.UNEASY : BAND.CALM;
  }
  if (d >= DREAD_HIGH) return BAND.DREAD;
  if (d >= DREAD_UNEASY) return BAND.UNEASY;
  return BAND.CALM;
}

// A band's playlist. Calm and uneasy each rotate two tracks (see initMusic's rotation); the rest
// hold one track. The After the Tide scenario (`recovery`) swaps its own calm-band track in place
// of the usual rotation — every other band is unaffected by the scenario.
function tracksForBand(band, scenario = null) {
  switch (band) {
    case BAND.TITLE: return [TRACKS.recoveryCalm];
    case BAND.DOOM: return [TRACKS.doom];
    case BAND.DREAD: return [TRACKS.dread];
    case BAND.UNEASY: return [TRACKS.uneasyA, TRACKS.uneasyB];
    case BAND.CALM:
    default:
      return scenario === 'recovery' ? [TRACKS.recoveryCalm] : [TRACKS.calmA, TRACKS.calmB];
  }
}

// The band + playlist for a game state in one call (what update() below acts on).
function playlistFor(state = {}) {
  const band = bandFor(state);
  return { band, tracks: tracksForBand(band, state.scenario || null) };
}

// Whether a playlist should loop its single track natively (a clean, seamless loop point — the
// tracks were rendered for it) rather than rotate. Doom never loops (the ending plays once); any
// band with more than one track rotates instead of looping one file.
function loopsNatively(band, tracks) {
  return band !== BAND.DOOM && tracks.length === 1;
}

// --- settings: on/off + a bed-volume level, persisted (pure serialize half) ----------------

const VOLUME_LEVELS = [0.12, 0.22, 0.32, 0.42];
const DEFAULT_VOLUME_IDX = 2;
const SETTINGS_KEY = 'innsmouth2000-music-settings';
const CROSSFADE_MS = 2000;

function defaultMusicSettings() {
  return { enabled: true, volumeIdx: DEFAULT_VOLUME_IDX };
}

function clampVolumeIdx(i) {
  const n = Number.isInteger(i) ? i : DEFAULT_VOLUME_IDX;
  return Math.max(0, Math.min(VOLUME_LEVELS.length - 1, n));
}

function serializeMusicSettings(settings) {
  const s = settings || {};
