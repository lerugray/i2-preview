'use strict';

// ===== src/rng.js =====
// Seeded deterministic PRNG for INNSMOUTH 2000.
//
// Every stochastic system in the game (map generation, growth, disasters) draws from a
// seeded RNG so runs are reproducible and the node --test battery can assert on outcomes.
// Algorithm: mulberry32, a small, fast, well-distributed 32-bit generator. Seeds are hashed
// through splitmix32 first so nearby integer seeds (0, 1, 2...) still produce unrelated
// streams.

// Hash an arbitrary 32-bit integer seed into a well-mixed 32-bit state.
function splitmix32(a) {
  a |= 0;
  a = (a + 0x9e3779b9) | 0;
  let t = a ^ (a >>> 16);
  t = Math.imul(t, 0x21f0aaad);
  t = t ^ (t >>> 15);
  t = Math.imul(t, 0x735a2d97);
  return (t ^ (t >>> 15)) >>> 0;
}

// Convert a string seed to a 32-bit integer (FNV-1a). Lets us seed from a town name.
function hashString(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

// Create a seeded RNG. seed may be a number or a string.
function makeRng(seed = 0) {
  const initial = typeof seed === 'string' ? hashString(seed) : (seed >>> 0);
  let state = splitmix32(initial);

  // Core: next float in [0, 1).
  function next() {
    state |= 0;
    state = (state + 0x6d2b79f5) | 0;
    let t = Math.imul(state ^ (state >>> 15), 1 | state);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  const rng = {
    // Float in [0, 1).
    next,
    // Float in [min, max).
    range(min, max) {
      return min + next() * (max - min);
    },
    // Integer in [min, max] inclusive.
    int(min, max) {
      return min + Math.floor(next() * (max - min + 1));
    },
    // Boolean true with probability p (default 0.5).
    chance(p = 0.5) {
      return next() < p;
    },
    // A uniformly chosen element of a non-empty array.
    pick(arr) {
      return arr[Math.floor(next() * arr.length)];
    },
    // Fisher-Yates shuffle returning a NEW array; input is not mutated.
    shuffle(arr) {
      const out = arr.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        const tmp = out[i];
        out[i] = out[j];
        out[j] = tmp;
      }
      return out;
    },
    // Fork a child RNG whose seed derives from this stream. Lets subsystems have
    // independent, reproducible streams without correlating.
    fork() {
      return makeRng(Math.floor(next() * 0xffffffff));
    },
    // Expose the internal state so a saved game can resume the exact stream (M8 save/load).
    getState() { return state >>> 0; },
    setState(s) { state = s | 0; return rng; },
  };
  return rng;
}



// ===== src/geometry.js =====
// Dimetric projection geometry for INNSMOUTH 2000.
//
// The 2:1 dimetric projection locked in docs/STUDY.md section 1. Tile grid coordinates are
// (col, row); world pixel coordinates are (x, y) at authoring scale (1 unit = 1 px at 2x zoom).
// This module is pure math: no canvas, no camera. The renderer composes camera + zoom on top.

// The master tile ratio (STUDY 1.1). A ground diamond is TILE_W wide by TILE_H tall.
const TILE_W = 64;
const TILE_H = 32;
const HALF_W = TILE_W / 2; // 32
const HALF_H = TILE_H / 2; // 16

// Vertical pixels per terrain elevation level and per building storey (STUDY 1.2).
const ELEV_STEP = 16;

// World-pixel CENTER of a tile's ground diamond, before elevation.
//   centerX = (col - row) * HALF_W
//   centerY = (col + row) * HALF_H
// Moving +1 col goes down-right; +1 row goes down-left (the diamond walk, STUDY 1.1).
function tileToWorld(col, row) {
  return {
    x: (col - row) * HALF_W,
    y: (col + row) * HALF_H,
  };
}

// World center of a tile raised by `elevation` levels (top face of a cliff/building base).
function tileToWorldElevated(col, row, elevation = 0) {
  const w = tileToWorld(col, row);
  return { x: w.x, y: w.y - elevation * ELEV_STEP };
}

// Exact inverse: the tile (col, row) whose ground diamond contains world pixel (x, y).
// A tile's diamond maps to the axis-aligned unit square centered on its integer coordinate,
// so rounding the continuous solution recovers the containing tile exactly (STUDY 1.1).
// FLAT only: this assumes elevation 0. For a world point taken from screen (a mouse pick), use
// worldToTileElevated below -- the renderer draws raised tiles higher on screen, and this alone
// would pick the wrong tile on any hill.
function worldToTile(x, y) {
  const colF = x / TILE_W + y / TILE_H;
  const rowF = y / TILE_H - x / TILE_W;
  return {
    col: Math.floor(colF + 0.5),
    row: Math.floor(rowF + 0.5),
  };
}

// Elevation-corrected inverse (M9.7, the cursor/tile misalignment fix). render.js draws a tile's
// diamond raised by elevation*ELEV_STEP px (tileToWorldElevated), so a screen pick run through
// the plain worldToTile above recovers a tile shifted toward smaller col+row by roughly
// elevation/2 in each axis -- verified empirically: elevation 2 mispicked every time, off by
// exactly one tile diagonally, on ANY terrain above a gentle slope (PROGRESS.md "cursor/tile
// alignment fix"). `mapLike` is anything shaped like GameMap (inBounds(col,row), tileAt(col,row)
// -> { elevation }) -- geometry.js stays DOM-free, but this needs the real elevation field to
// invert against, so it takes a map rather than importing one.
//
// Fix: guess flat, look up that guess's real elevation, and re-solve with it added back --
// terrain elevation changes gradually tile-to-tile (STUDY heightfield), so this converges in a
// couple of steps for the ordinary rolling terrain almost everything is built on. Capped well
// above the map's max elevation range so it can never spin.
//
// Known limit (measured, not a regression this introduces): at a sheer cliff -- an elevation
// jump of 2+ within a single tile, e.g. the rock faces at MAX_ELEV -- a click on the exact
// top-face center can still resolve one tile short, because the flat first guess can land
// squarely on a genuinely self-consistent LOWER tile with nothing left to correct against. A
// fuller fix needs real occlusion/wall-face hit-testing (a much bigger change); an exhaustive
// per-elevation sweep was tried and made ordinary sloped terrain WORSE (it walks past the right
// tile on any smooth multi-tile slope), so it was reverted in favour of this narrower, measured
// win -- see test/geometry.test.js's pick-alignment tests for the exact bound.
function worldToTileElevated(x, y, mapLike) {
  let t = worldToTile(x, y);
  for (let i = 0; i < 8; i++) {
    if (!mapLike.inBounds(t.col, t.row)) break;
    const e = mapLike.tileAt(t.col, t.row).elevation || 0;
    if (e === 0) break;
    const next = worldToTile(x, y + e * ELEV_STEP);
    if (next.col === t.col && next.row === t.row) break; // converged
    t = next;
  }
  return t;
}

// The four corners of a tile's ground diamond in world coordinates, given its center.
// Order: top, right, bottom, left (clockwise from top). Used by the renderer to path a tile.
function diamondCorners(cx, cy) {
  return [
    { x: cx, y: cy - HALF_H }, // top
    { x: cx + HALF_W, y: cy }, // right
    { x: cx, y: cy + HALF_H }, // bottom
    { x: cx - HALF_W, y: cy }, // left
  ];
}

// The tightest inclusive tile range covering a world-space rectangle, clamped to a grid of
// `cols` x `rows`. The renderer uses this to cull to the visible viewport before drawing.
// Because the projection rotates the grid, all four rectangle corners are probed.
function visibleTileRange(worldLeft, worldTop, worldRight, worldBottom, cols, rows, pad = 1) {
  const corners = [
    worldToTile(worldLeft, worldTop),
    worldToTile(worldRight, worldTop),
    worldToTile(worldLeft, worldBottom),
    worldToTile(worldRight, worldBottom),
  ];
  let minCol = Infinity;
  let maxCol = -Infinity;
  let minRow = Infinity;
  let maxRow = -Infinity;
  for (const c of corners) {
    minCol = Math.min(minCol, c.col);
    maxCol = Math.max(maxCol, c.col);
    minRow = Math.min(minRow, c.row);
    maxRow = Math.max(maxRow, c.row);
  }
  return {
    minCol: Math.max(0, minCol - pad),
    maxCol: Math.min(cols - 1, maxCol + pad),
    minRow: Math.max(0, minRow - pad),
    maxRow: Math.min(rows - 1, maxRow + pad),
  };
}

// Painter's-algorithm draw key: iterate tiles by increasing (col + row), then by row
// (STUDY 1.3). Returns a comparator for [col, row] pairs.
function drawOrder(a, b) {
  const da = a.col + a.row;
  const db = b.col + b.row;
  if (da !== db) return da - db;
  return a.row - b.row;
}


// ===== src/palette.js =====
// The one fixed palette for INNSMOUTH 2000 (the aesthetic lock, STUDY section 2.2).
//
// Sea-rotted: brine greens, weathered clapboard browns, fog greys, cold slate roofs, gold
// lamplit windows. Every material is a 4-step ramp [shadow, base, light, highlight] so the
// dimetric wall bands and ordered dithers share one light model. Authored here as hex; never
// sampled from any reference image. No smooth gradients, ever: shading is ramp steps and
// ordered dither between them.

// The damp 1920s pass (M7): the M1 ramps read as bright daytime, so every material is muted,
// cooled, and darkened a step toward overcast coastal dread, keeping the 4-step light model. The
// gold lamplit window is left warm and bright on purpose: it is the one glow of life in the fog.
const RAMP = {
  deep: ['#152e30', '#204442', '#2d5856', '#3d6e66'], // deep brine
  shallow: ['#2d5856', '#3d6e66', '#57806f', '#74998a'], // shallow sea / river
  beach: ['#565042', '#6d6653', '#877f66', '#a0977c'], // wet sand, damp and grey
  grass: ['#333e28', '#454f34', '#5c6942', '#758055'], // marsh grass, desaturated
  dirt: ['#3f3527', '#564636', '#6d5b45', '#867259'], // bare earth
  rock: ['#3a3c43', '#4d505a', '#656a75', '#818691'], // hill rock, cold
  clapboard: ['#4b3d31', '#635241', '#7a6852', '#917d67'], // building wall, weathered
  slate: ['#2e313a', '#3f434e', '#515665', '#666b7b'], // roof, cold
  gold: ['#6e5019', '#a87b2a', '#d0a848', '#eccd73'], // lamplit window (kept warm)
};

// Ramp step indices, named for readability.
const SHADOW = 0;
const BASE = 1;
const LIGHT = 2;
const HIGHLIGHT = 3;

// OS-window chrome greys (STUDY 2.2), a separate ramp for UI surfaces.
const CHROME = {
  windowFace: '#b8b4a8',
  bevelLight: '#e6e2d6',
  bevelShadow: '#6f6c63',
  deepFrame: '#454339',
  titleBar: '#3a4a5a',
  titleText: '#e8e4d6',
  ink: '#2a2823',
};

// Parse '#rrggbb' to { r, g, b } (0..255).
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 0xff, g: (n >> 8) & 0xff, b: n & 0xff };
}

// Map a terrain kind (from mapgen TERRAIN) to its palette ramp key.
function terrainRamp(terrain) {
  // Terrain kinds are named to match ramp keys directly.
  return RAMP[terrain] ? terrain : 'grass';
}

// Zone marker colours (STUDY 3 chrome register). Chosen bright enough to read against the
// grass ramp: residential pops as a lighter green, commercial slate-blue, industrial gold.
const ZONE_TINT = {
  residential: '#9ecf66',
  commercial: '#5aa0d0',
  industrial: '#d8b038',
};

// Overhead wire / pole colours for power lines.
const WIRE = '#241f1a';
const POLE = '#3a2f24';


// ===== src/mapgen.js =====
// Seeded coastal map generation for INNSMOUTH 2000.
//
// Innsmouth is a rotting Massachusetts coast town, so the map MUST have a real shoreline, a
// river mouth (the Manuxet register), and hills climbing away from the water. Every later
// system depends on the coast existing from the first tile: Deep Ones need waterfront, wharves
// need shore, the tax base climbs the hill. Generation is fully seeded and deterministic
// (STUDY section 5): same seed produces the identical map.
//
// Method (zero dependencies): a fractal value-noise heightfield, a seaward gradient that pulls
// the front of the map underwater to make a wiggly coast, one carved river reaching the sea,
// then terrain classification. The "front" of the dimetric view (larger col + row) is the
// water, so the town reads as climbing inland away from the shore.


// Terrain kinds. Values are strings so tiles are legible in test output and save files.
const TERRAIN = {
  DEEP: 'deep', // deep brine, no wall band
  SHALLOW: 'shallow', // shallow sea / river channel
  BEACH: 'beach', // wet sand strip between water and land
  GRASS: 'grass', // marsh grass / buildable land
  ROCK: 'rock', // hill rock (highest elevations)
};

const MAX_ELEV = 6; // terrain elevation levels above sea (STUDY 1.2)

const DEFAULT_COLS = 96;
const DEFAULT_ROWS = 96;

// --- fractal value noise -----------------------------------------------------------------

function buildLattice(rng, w, h) {
  const a = new Float64Array(w * h);
  for (let i = 0; i < a.length; i++) a[i] = rng.next();
  return a;
}

function smoothstep(t) {
  return t * t * (3 - 2 * t);
}

function sampleLattice(lat, w, fx, fy) {
  const gx = Math.floor(fx);
  const gy = Math.floor(fy);
  const tx = smoothstep(fx - gx);
  const ty = smoothstep(fy - gy);
  const i00 = lat[gy * w + gx];
  const i10 = lat[gy * w + gx + 1];
  const i01 = lat[(gy + 1) * w + gx];
  const i11 = lat[(gy + 1) * w + gx + 1];
  const top = i00 + (i10 - i00) * tx;
  const bot = i01 + (i11 - i01) * tx;
  return top + (bot - top) * ty;
}

// Fractal Brownian motion over several octaves. Returns fbm(col,row) in [0,1].
function makeFbm(rng, cols, rows) {
  const octaves = [
    { spacing: 24, amp: 1.0 },
    { spacing: 12, amp: 0.5 },
    { spacing: 6, amp: 0.25 },
  ];
  const layers = octaves.map((o) => {
    const w = Math.ceil(cols / o.spacing) + 2;
    const h = Math.ceil(rows / o.spacing) + 2;
    return { lat: buildLattice(rng, w, h), w, spacing: o.spacing, amp: o.amp };
  });
  const totalAmp = octaves.reduce((s, o) => s + o.amp, 0);
  return function fbm(col, row) {
    let sum = 0;
    for (const l of layers) {
      sum += l.amp * sampleLattice(l.lat, l.w, col / l.spacing, row / l.spacing);
    }
    return sum / totalAmp;
  };
}

// --- map ---------------------------------------------------------------------------------

// A plain tile grid with helpers. Each tile: { terrain, elevation, object }.
class GameMap {
  constructor(cols, rows) {
    this.cols = cols;
    this.rows = rows;
    this.tiles = new Array(cols * rows);
  }

  inBounds(col, row) {
    return col >= 0 && row >= 0 && col < this.cols && row < this.rows;
  }

  index(col, row) {
    return row * this.cols + col;
  }

  tileAt(col, row) {
    if (!this.inBounds(col, row)) return null;
    return this.tiles[this.index(col, row)];
  }

  isWater(col, row) {
    const t = this.tileAt(col, row);
    return !!t && (t.terrain === TERRAIN.DEEP || t.terrain === TERRAIN.SHALLOW);
  }
}

function isWaterTerrain(t) {
  return t === TERRAIN.DEEP || t === TERRAIN.SHALLOW;
}

// Generate a coastal map. opts: { seed, cols, rows }.
function makeMap(opts = {}) {
  const cols = opts.cols || DEFAULT_COLS;
  const rows = opts.rows || DEFAULT_ROWS;
  const rng = makeRng(opts.seed ?? 0);
  const fbm = makeFbm(rng.fork(), cols, rows);

  const map = new GameMap(cols, rows);
  const maxDepth = cols + rows - 2;

  // Pass 1: heightfield + sea. landValue < 0 is water; >= 0 is land at some elevation.
  const landValue = new Float64Array(cols * rows);
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const n = fbm(col, row); // 0..1 hills
      const depth = (col + row) / maxDepth; // 0 inland, 1 at the seaward front
      // Seaward pull: nothing until depth 0.35, ramping to a strong pull at the front.
      const g = Math.max(0, (depth - 0.35) / 0.5);
      const lv = n - g * 1.15;
      landValue[map.index(col, row)] = lv;
    }
  }

  // Pass 2: classify base terrain + elevation from landValue.
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const i = map.index(col, row);
      const lv = landValue[i];
      let terrain;
      let elevation;
      if (lv < 0) {
        terrain = lv < -0.22 ? TERRAIN.DEEP : TERRAIN.SHALLOW;
        elevation = 0;
      } else {
        // Land elevation grows with landValue, capped.
        elevation = Math.min(MAX_ELEV, Math.floor(lv / 0.14));
        terrain = elevation >= 4 ? TERRAIN.ROCK : TERRAIN.GRASS;
      }
      map.tiles[i] = { terrain, elevation, object: null, zone: null, building: null, structure: null, scar: null };
    }
  }

  // Pass 3: carve one river from inland to the sea (the river mouth).
  carveRiver(map, rng.fork());

  // Pass 4: beaches. A land tile at elevation 0 touching any water becomes wet sand.
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const t = map.tiles[map.index(col, row)];
      if (isWaterTerrain(t.terrain) || t.elevation > 0) continue;
      if (
        map.isWater(col + 1, row) || map.isWater(col - 1, row) ||
        map.isWater(col, row + 1) || map.isWater(col, row - 1)
      ) {
        t.terrain = TERRAIN.BEACH;
      }
    }
  }

  return map;
}

// Walk a channel from a low-depth inland tile toward the sea, lowering it to shallow water.
// Guaranteed to reach water because the seaward front is underwater.
function carveRiver(map, rng) {
  const { cols, rows } = map;
  const maxDepth = cols + rows - 2;
  // Start on the inland anti-diagonal at ~18% depth, at a random offset along it.
  const startSum = Math.round(0.18 * maxDepth);
  const minCol = Math.max(0, startSum - (rows - 1));
  const maxCol = Math.min(cols - 1, startSum);
  let col = rng.int(minCol, maxCol);
  let row = startSum - col;
  if (row < 0) row = 0;
  if (row > rows - 1) row = rows - 1;

  let guard = 0;
  const maxSteps = cols + rows + 8;
  while (map.inBounds(col, row) && guard++ < maxSteps) {
    carveChannelTile(map, col, row);
    // Reached the sea: the mouth. Stop once we are into open water.
    if (map.tileAt(col, row) && map.isWater(col, row) && (col + row) / maxDepth > 0.6) break;

    // Step seaward (increase col+row). Meander between down-right, down-left, and a
    // sideways drift, weighted so the river mostly advances but wiggles.
    const roll = rng.next();
    let ncol = col;
    let nrow = row;
    if (roll < 0.42) ncol = col + 1; // down-right
    else if (roll < 0.84) nrow = row + 1; // down-left
    else if (rng.chance()) { ncol = col + 1; nrow = row - 1; } // drift, same depth
    else { ncol = col - 1; nrow = row + 1; } // drift, same depth

    if (!map.inBounds(ncol, nrow)) { ncol = col + 1; nrow = row + 1; }
    col = ncol;
    row = nrow;
  }
}

// Lower a tile (and its 4-neighbours, for width) to a shallow channel.
function carveChannelTile(map, col, row) {
  const cells = [[col, row], [col + 1, row], [col - 1, row], [col, row + 1], [col, row - 1]];
  for (const [c, r] of cells) {
    const t = map.tileAt(c, r);
    if (!t) continue;
    // The centre becomes channel; banks only lower if not already deep sea.
    if (c === col && r === row) {
      t.terrain = TERRAIN.SHALLOW;
      t.elevation = 0;
    } else if (t.terrain !== TERRAIN.DEEP && t.elevation > 0) {
      // Lower steep banks by one so the river sits in a shallow valley, no cliff walls.
      t.elevation = Math.max(0, t.elevation - 1);
    }
  }
}

// Summary stats, handy for tools/tests: counts by terrain and land/water fractions.
function mapStats(map) {
  const counts = { deep: 0, shallow: 0, beach: 0, grass: 0, rock: 0 };
  for (const t of map.tiles) counts[t.terrain]++;
  const total = map.tiles.length;
  const water = counts.deep + counts.shallow;
  return {
    counts,
    total,
    waterFraction: water / total,
    landFraction: (total - water) / total,
  };
}



// ===== src/camera.js =====
// Camera for INNSMOUTH 2000: discrete zoom, pan, and clamping to the map.
//
// Pure state so it is fully testable in node. The camera holds a world-space center point and
// one of three discrete zoom levels (STUDY 1.4). Screen <-> world is a scale-plus-translate
// (no rotation lives here; the diamond rotation is entirely in geometry.js), so the transform
// and its inverse are exact. The center is clamped to the map's world bounds so the player can
// never pan off into the void.


// The only allowed zoom factors: 0.5x overview, 1x authoring, 2x close (STUDY 1.4).
const ZOOM_LEVELS = [0.5, 1, 2];

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

// World-space bounding box of a cols x rows ground grid (elevation ignored for clamping).
function mapWorldBounds(cols, rows) {
  // x extremes: leftmost at tile (0, rows-1), rightmost at (cols-1, 0).
  // y extremes: top at (0,0), bottom at (cols-1, rows-1).
  return {
    minX: -(rows - 1) * HALF_W,
    maxX: (cols - 1) * HALF_W,
    minY: 0,
    maxY: (cols - 1 + rows - 1) * HALF_H,
  };
}

function makeCamera(opts = {}) {
  const mapCols = opts.mapCols || 96;
  const mapRows = opts.mapRows || 96;
  const bounds = mapWorldBounds(mapCols, mapRows);

  const cam = {
    viewportW: opts.viewportW || 1280,
    viewportH: opts.viewportH || 800,
    zoom: ZOOM_LEVELS.includes(opts.zoom) ? opts.zoom : 1,
    // Default: center on the middle of the map's world bounds.
    cx: opts.x ?? (bounds.minX + bounds.maxX) / 2,
    cy: opts.y ?? (bounds.minY + bounds.maxY) / 2,
    bounds,

    setViewport(w, h) {
      this.viewportW = w;
      this.viewportH = h;
      return this;
    },

    // Keep the center inside the map bounds.
    clampToBounds() {
      this.cx = clamp(this.cx, this.bounds.minX, this.bounds.maxX);
      this.cy = clamp(this.cy, this.bounds.minY, this.bounds.maxY);
      return this;
    },

    // Snap to a specific allowed zoom level (nearest if not exact). Center-anchored: the
    // world point under the screen center stays fixed.
    setZoom(level) {
      let best = ZOOM_LEVELS[0];
      let bestD = Infinity;
      for (const z of ZOOM_LEVELS) {
        const d = Math.abs(z - level);
        if (d < bestD) { bestD = d; best = z; }
      }
      this.zoom = best;
      return this;
    },

    zoomIn() {
      const i = ZOOM_LEVELS.indexOf(this.zoom);
      if (i < ZOOM_LEVELS.length - 1) this.zoom = ZOOM_LEVELS[i + 1];
      return this;
    },

    zoomOut() {
      const i = ZOOM_LEVELS.indexOf(this.zoom);
      if (i > 0) this.zoom = ZOOM_LEVELS[i - 1];
      return this;
    },

    // Pan by a screen-pixel delta (e.g. a mouse drag). Converted to world by the zoom factor.
    panByScreen(dxScreen, dyScreen) {
      this.cx += dxScreen / this.zoom;
      this.cy += dyScreen / this.zoom;
      return this.clampToBounds();
    },

    // Center the camera on a world point.
    panTo(worldX, worldY) {
      this.cx = worldX;
      this.cy = worldY;
      return this.clampToBounds();
    },

    // World -> screen (scale by zoom, translate so the center sits at the viewport middle).
    worldToScreen(wx, wy) {
      return {
        x: (wx - this.cx) * this.zoom + this.viewportW / 2,
        y: (wy - this.cy) * this.zoom + this.viewportH / 2,
      };
    },

    // Screen -> world, the exact inverse.
    screenToWorld(sx, sy) {
      return {
        x: (sx - this.viewportW / 2) / this.zoom + this.cx,
        y: (sy - this.viewportH / 2) / this.zoom + this.cy,
      };
    },

    // The world-space rectangle currently visible, for culling via geometry.visibleTileRange.
    visibleWorldRect() {
      const halfW = this.viewportW / 2 / this.zoom;
      const halfH = this.viewportH / 2 / this.zoom;
      return {
        left: this.cx - halfW,
        top: this.cy - halfH,
        right: this.cx + halfW,
        bottom: this.cy + halfH,
      };
    },
  };

  cam.clampToBounds();
  return cam;
}


// ===== src/tools.js =====
// Placement and tools model for INNSMOUTH 2000 (M2 substrate).
//
// Pure logic over the map (no canvas), so node --test covers every rule. A tool applied at a
// tile mutates that tile and reports what happened. The tile shape from mapgen is
// { terrain, elevation, object, zone } where:
//   object: null | { kind: 'road' } | { kind: 'powerline' }  -- the tile's network occupant
//   zone:   null | 'residential' | 'commercial' | 'industrial'
// Roads auto-connect: each road/power tile knows which of its 4 grid neighbours share its kind,
// as a bitmask, so the renderer (M2.2) can pick the right piece. Growth onto zones is M3.


const TOOL = {
  QUERY: 'query',
  BULLDOZE: 'bulldoze',
  ROAD: 'road',
  POWERLINE: 'powerline',
  GASWORKS: 'gasworks',
  WHALEOIL: 'whaleoil',
  ZONE_R: 'zone_r',
  ZONE_C: 'zone_c',
  ZONE_I: 'zone_i',
  CONSTABULARY: 'constabulary',
  ASYLUM: 'asylum',
  CHAPEL: 'chapel',
  SHRINE: 'shrine',
  UNIVERSITY: 'university',
};

const ZONE = {
  RESIDENTIAL: 'residential',
  COMMERCIAL: 'commercial',
  INDUSTRIAL: 'industrial',
};

// Placed civic structures (M5). Unlike zones, the player builds these directly; each occupies a
// single tile (footprint 1x1 for the prototype), draws on the treasury, and pays monthly upkeep.
// Two are power sources with a supply capacity; four are services with a coverage radius:
//   gasworks / whaleoil      -- generation, feed the power grid over lines and buildings
//   constabulary             -- public order / riot resistance (the Nyarlathotep counter, M6)
//   asylum                   -- madness recovery (eases dread; the recovery hook matures M6)
//   chapel                   -- the Old Faith: eases dread and holds residents Unwary in its reach
//   shrine                   -- the cult seed: draws Cultists and raises dread in its reach
//   university               -- the campus and its Containment Wing (M6): eases dread, holds the Rift
// capacity: power units supplied (0 for a consumer/service). radius: Chebyshev coverage (0 = none).
const STRUCTURE = {
  GASWORKS: 'gasworks',
  WHALEOIL: 'whaleoil',
  CONSTABULARY: 'constabulary',
  ASYLUM: 'asylum',
  CHAPEL: 'chapel',
  SHRINE: 'shrine',
  UNIVERSITY: 'university',
};

const STRUCTURE_INFO = {
  gasworks: {
    tool: TOOL.GASWORKS, label: 'Gasworks', cost: 800, upkeep: 20,
    capacity: 60, radius: 0, dread: 0,
    blurb: 'A coal-gas works. Feeds power along lines and through built lots.',
  },
  whaleoil: {
    tool: TOOL.WHALEOIL, label: 'Whale-Oil Works', cost: 1300, upkeep: 35,
    capacity: 140, radius: 0, dread: 0,
    blurb: 'The old rendering works. More power than the gasworks, at a price.',
  },
  constabulary: {
    tool: TOOL.CONSTABULARY, label: 'Constabulary', cost: 500, upkeep: 15,
    capacity: 0, radius: 6, dread: -2,
    blurb: 'The town watch. Steadies the streets against riot and unrest.',
  },
  asylum: {
    tool: TOOL.ASYLUM, label: 'Asylum', cost: 700, upkeep: 25,
    capacity: 0, radius: 6, dread: -3,
    blurb: 'The sanitarium. Takes in the maddened; eases the common dread.',
  },
  chapel: {
    tool: TOOL.CHAPEL, label: 'Chapel', cost: 400, upkeep: 10,
    capacity: 0, radius: 5, dread: -5,
    blurb: 'The Old Faith holds. Eases dread and keeps folk from the cult in its reach.',
  },
  shrine: {
    tool: TOOL.SHRINE, label: 'Shrine', cost: 350, upkeep: 8,
    capacity: 0, radius: 5, dread: 6,
    blurb: 'A shrine to the deep gods. Draws Cultists and raises dread nearby.',
  },
  university: {
    tool: TOOL.UNIVERSITY, label: 'University', cost: 1200, upkeep: 40,
    capacity: 0, radius: 6, dread: -4,
    blurb: 'The campus and its Containment Wing. Draws Scholars, eases dread, holds the Rift at bay.',
  },
};

// The tool for each structure kind, and the structure kind each structure tool places.
const STRUCTURE_FOR_TOOL = {};
for (const kind of Object.keys(STRUCTURE_INFO)) STRUCTURE_FOR_TOOL[STRUCTURE_INFO[kind].tool] = kind;
function structureForTool(tool) { return STRUCTURE_FOR_TOOL[tool] || null; }

// Tool costs charged against the treasury. Structures draw their price from STRUCTURE_INFO.
const TOOL_COST = {
  [TOOL.BULLDOZE]: 1,
  [TOOL.ROAD]: 10,
  [TOOL.POWERLINE]: 5,
  [TOOL.ZONE_R]: 20,
  [TOOL.ZONE_C]: 20,
  [TOOL.ZONE_I]: 20,
};
for (const kind of Object.keys(STRUCTURE_INFO)) {
  TOOL_COST[STRUCTURE_INFO[kind].tool] = STRUCTURE_INFO[kind].cost;
}

const ZONE_FOR_TOOL = {
  [TOOL.ZONE_R]: ZONE.RESIDENTIAL,
  [TOOL.ZONE_C]: ZONE.COMMERCIAL,
  [TOOL.ZONE_I]: ZONE.INDUSTRIAL,
};

// The 4 grid neighbours and their auto-connect bit. In screen terms:
//   SE = down-right, SW = down-left, NW = up-left, NE = up-right.
const DIR = {
  SE: { bit: 1, dc: 1, dr: 0 },
  SW: { bit: 2, dc: 0, dr: 1 },
  NW: { bit: 4, dc: -1, dr: 0 },
  NE: { bit: 8, dc: 0, dr: -1 },
};
const DIRS = [DIR.SE, DIR.SW, DIR.NW, DIR.NE];

function isWaterTerrain(terrain) {
  return terrain === TERRAIN.DEEP || terrain === TERRAIN.SHALLOW;
}

// Can `tool` be applied at (col, row)? Returns { ok, reason } where reason is player-facing
// plain English (period register, no em-dashes) when ok is false.
function canApply(map, tool, col, row) {
  const tile = map.tileAt(col, row);
  if (!tile) return { ok: false, reason: 'That is beyond the edge of the map.' };

  if (tool === TOOL.QUERY) return { ok: true };

  if (tool === TOOL.BULLDOZE) {
    if (tile.object || tile.zone || tile.structure || tile.building || tile.scar) return { ok: true };
    return { ok: false, reason: 'There is nothing here to clear.' };
  }

  // All building tools need dry land.
  if (isWaterTerrain(tile.terrain)) {
    return { ok: false, reason: 'The tide will not hold a foundation. Build on dry land.' };
  }

  // Placed structures need a clear tile: no network, no zone, no other structure.
  if (structureForTool(tool)) {
    if (tile.structure) return { ok: false, reason: 'A structure already stands here.' };
    if (tile.object) return { ok: false, reason: 'Clear the road or line before you build here.' };
    if (tile.zone) return { ok: false, reason: 'Clear the zoning before you build here.' };
    return { ok: true };
  }

  if (tool === TOOL.ROAD || tool === TOOL.POWERLINE) {
    const kind = tool === TOOL.ROAD ? 'road' : 'powerline';
    if (tile.object && tile.object.kind === kind) {
      return { ok: false, reason: 'That is already laid here.' };
    }
    return { ok: true };
  }

  if (ZONE_FOR_TOOL[tool]) {
    if (tile.object) return { ok: false, reason: 'Clear the road before you zone this lot.' };
    if (tile.zone === ZONE_FOR_TOOL[tool]) {
      return { ok: false, reason: 'This lot is already zoned so.' };
    }
    return { ok: true };
  }

  return { ok: false, reason: 'Unknown tool.' };
}

// Apply a tool at (col, row). Mutates the map when it can. Returns
// { ok, changed, cost, reason }. Query never changes anything.
function applyTool(map, tool, col, row) {
  const check = canApply(map, tool, col, row);
  if (!check.ok) return { ok: false, changed: false, cost: 0, reason: check.reason };

  const tile = map.tiles[map.index(col, row)];
  const cost = TOOL_COST[tool] || 0;

  if (tool === TOOL.QUERY) {
    return { ok: true, changed: false, cost: 0, reason: null };
  }

  if (tool === TOOL.BULLDOZE) {
    tile.object = null;
    tile.zone = null;
    tile.structure = null;
    tile.building = null;
    tile.scar = null; // clearing the lot also cleans away any disaster scar (M6)
    refreshConnectionsAround(map, col, row);
    return { ok: true, changed: true, cost, reason: null };
  }

  if (structureForTool(tool)) {
    tile.structure = { kind: structureForTool(tool) };
    tile.zone = null;
    tile.object = null;
    return { ok: true, changed: true, cost, reason: null };
  }

  if (tool === TOOL.ROAD || tool === TOOL.POWERLINE) {
    const kind = tool === TOOL.ROAD ? 'road' : 'powerline';
    tile.object = { kind, mask: 0 };
    tile.zone = null; // laying a network clears zoning on the lot
    refreshConnectionsAround(map, col, row);
    return { ok: true, changed: true, cost, reason: null };
  }

  // Zone paint.
  tile.zone = ZONE_FOR_TOOL[tool];
  return { ok: true, changed: true, cost, reason: null };
}

// The auto-connect bitmask for the network at (col, row): which neighbours share its kind.
function connectionMask(map, col, row) {
  const tile = map.tileAt(col, row);
  if (!tile || !tile.object) return 0;
  const kind = tile.object.kind;
  let mask = 0;
  for (const d of DIRS) {
    const n = map.tileAt(col + d.dc, row + d.dr);
    if (n && n.object && n.object.kind === kind) mask |= d.bit;
  }
  return mask;
}

// Recompute the stored mask on a tile and its 4 neighbours (call after any placement/removal).
function refreshConnectionsAround(map, col, row) {
  const cells = [[col, row]];
  for (const d of DIRS) cells.push([col + d.dc, row + d.dr]);
  for (const [c, r] of cells) {
    const t = map.tileAt(c, r);
    if (t && t.object) t.object.mask = connectionMask(map, c, r);
  }
}

// A human-readable description of a tile, for the query tool (M2.3). Plain English.
function describeTile(map, col, row) {
  const tile = map.tileAt(col, row);
  if (!tile) return { title: 'The Void', lines: ['Beyond the edge of the map.'] };
  const terrainName = {
    deep: 'Deep water', shallow: 'Shallow water', beach: 'Wet sand',
    grass: 'Marsh grass', rock: 'Bare rock',
  }[tile.terrain] || tile.terrain;
  const lines = [`Ground: ${terrainName}`, `Elevation: ${tile.elevation}`];
  if (tile.structure) {
    const info = STRUCTURE_INFO[tile.structure.kind];
    if (info) {
      lines.push(info.label + '.');
      lines.push(info.blurb);
      if (info.capacity > 0) lines.push(`Supplies ${info.capacity} of power.`);
    }
  }
  if (tile.object) {
    lines.push(tile.object.kind === 'road' ? 'A dirt road runs here.' : 'A power line crosses here.');
  }
  if (tile.zone) {
    const zoneName = {
      residential: 'Residential lot', commercial: 'Commercial lot', industrial: 'Industrial lot',
    }[tile.zone];
    lines.push(`Zoned: ${zoneName}`);
  }
  if (tile.building) {
    const clsName = {
      unwary: 'the Unwary', cultist: 'Cultists', deepone: 'Deep Ones', scholar: 'Scholars',
    }[tile.building.cls] || 'residents';
    if (tile.zone === 'residential') lines.push(`Home to ${clsName}. Tier ${tile.building.level}.`);
    else lines.push(`Built up. Tier ${tile.building.level}.`);
  }
  if (tile.scar) {
    const scarLine = {
      burnt: 'Burned out. Blackened ground and charred stubs.',
      overgrown: 'Choked with unnatural growth.',
      rubble: 'Fallen to rubble.',
      flooded: 'Taken by the tide.',
    }[tile.scar.kind];
    if (scarLine) lines.push(scarLine);
  }
  if (!tile.object && !tile.zone && !tile.structure && !isWaterTerrain(tile.terrain) && !tile.scar) {
    lines.push('Unclaimed land.');
  }
  return { title: `Lot ${col}, ${row}`, lines };
}


// ===== src/power.js =====
// Power grid for INNSMOUTH 2000 (M5).
//
// A pure, deterministic flood-fill over the map: no canvas, no DOM, so node --test covers every
// rule. Generation comes from placed structures (gasworks, whale-oil works); it travels through a
// conductive network of power lines, generators, and built lots (adjacent buildings pass power,
// the reference's convention). A connected network is powered only when its total generation
// capacity can bear its total demand; short of that the whole network browns out. Built lots draw
// power by their development tier; the empty land a zone sits on draws none until it builds.
//
// A zoned lot can DEVELOP past its first tier only where power reaches it: on an energized tile or
// beside one (so a generator or a live line radiates buildable power to the lots at its edge, and
// a lit lot then carries power on to its neighbours). sim.js reads energizedNear() for that gate.


const POWER_PER_TIER = 2; // a built lot's power demand per development tier

// The 4 grid neighbours (matches tools.DIR, kept local so power.js has no cyclic import).
const NB = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// Is this tile a conductor (it passes power along the network)? Power lines, generators, and any
// built lot conduct; placed service structures conduct too (they are buildings on the grid).
function isConductor(tile) {
  if (!tile) return false;
  if (tile.object && tile.object.kind === 'powerline') return true;
  if (tile.structure) return true;
  if (tile.building) return true;
  return false;
}

// The generation capacity a tile supplies (only power-source structures do).
function capacityOf(tile) {
  if (tile && tile.structure) {
    const info = STRUCTURE_INFO[tile.structure.kind];
    if (info && info.capacity > 0) return info.capacity;
  }
  return 0;
}

// The power a tile demands (only built lots do, by tier).
function demandOf(tile) {
  if (tile && tile.building) return (tile.building.level || 1) * POWER_PER_TIER;
  return 0;
}

// Compute the power state of the whole map. Returns:
//   energized: Set<index> of conductor tiles that belong to a satisfied network
//   components: [{ tiles:[idx], capacity, demand, satisfied }]
//   totals: { capacity, demand, powered, unpowered } across all networks
// Deterministic: the flood order follows tile index, so results are stable per map.
function computePower(map) {
  const seen = new Uint8Array(map.cols * map.rows);
  const energized = new Set();
  const components = [];
  let totCap = 0;
  let totDem = 0;
  let poweredNets = 0;
  let unpoweredNets = 0;

  for (let row = 0; row < map.rows; row++) {
    for (let col = 0; col < map.cols; col++) {
      const start = map.index(col, row);
      if (seen[start]) continue;
      const tile = map.tiles[start];
      if (!isConductor(tile)) { seen[start] = 1; continue; }

      // Flood this connected conductor network.
      const tiles = [];
      let capacity = 0;
      let demand = 0;
      const stack = [[col, row]];
      seen[start] = 1;
      while (stack.length) {
        const [c, r] = stack.pop();
        const i = map.index(c, r);
        const t = map.tiles[i];
        tiles.push(i);
        capacity += capacityOf(t);
        demand += demandOf(t);
        for (const [dc, dr] of NB) {
          const nc = c + dc;
          const nr = r + dr;
          if (!map.inBounds(nc, nr)) continue;
          const ni = map.index(nc, nr);
          if (seen[ni]) continue;
          if (!isConductor(map.tiles[ni])) continue;
          seen[ni] = 1;
          stack.push([nc, nr]);
        }
      }

      const satisfied = capacity >= demand && capacity > 0;
      if (satisfied) { for (const i of tiles) energized.add(i); poweredNets++; }
      else unpoweredNets++;
      totCap += capacity;
      totDem += demand;
      components.push({ tiles, capacity, demand, satisfied });
    }
  }

  return {
    energized,
    components,
    totals: { capacity: totCap, demand: totDem, powered: poweredNets, unpowered: unpoweredNets },
  };
}

// Is (col,row) energized, or beside an energized conductor? This is the growth gate: an empty
// zoned lot draws no power itself, but develops where a live line, generator, or lit neighbour
// touches it.
function energizedNear(map, power, col, row) {
  const here = map.index(col, row);
  if (power.energized.has(here)) return true;
  for (const [dc, dr] of NB) {
    const nc = col + dc;
    const nr = row + dr;
    if (!map.inBounds(nc, nr)) continue;
    if (power.energized.has(map.index(nc, nr))) return true;
  }
  return false;
}


// ===== src/gods.js =====
// The gods layer for INNSMOUTH 2000 (M6): favor tracks and appeasement.
//
// Each god has a FAVOR track in [0, 100]. Favor decays every month (the gods hunger, and dread
// feeds that hunger); the player's appeasement acts push it back up. When a track falls to the
// wrath floor, that god's WRATH fires (src/disasters.js) and the god is sated for a while. This
// module is pure over sim + map state (no canvas, no DOM) so node --test covers every rule.
//
// The five gods and their appeasement paths (DESIGN-SEED "Gods as disasters"):
//   Dagon         -- the Harbor Tithes ordinance and shrines set by the water (wharf offerings).
//   Cthulhu       -- the end-game clock. Favor only DELAYS the Awakening; asylums, universities,
//                    and shrines slow the dreaming, but the creep never stops.
//   Shub-Niggurath-- grove shrines on open, undeveloped land.
//   Nyarlathotep  -- the Masked Processions ordinance and a strong constabulary.
//   Yog-Sothoth   -- the university and its Containment Wing.


const GOD = {
  DAGON: 'dagon',
  CTHULHU: 'cthulhu',
  SHUB: 'shub',
  NYARLATHOTEP: 'nyarlathotep',
  YOG: 'yog',
};

// Fixed order: the favor panel and the disasters menu both iterate this.
const GOD_LIST = ['dagon', 'cthulhu', 'shub', 'nyarlathotep', 'yog'];

const GOD_INFO = {
  dagon: {
    label: 'Dagon',
    wrath: 'The Flood Tide',
    blurb: 'Lord of the deep. His tide drowns the shore and his Deep Ones rise from it.',
    appease: 'Keep the Harbor Tithes and raise shrines by the water.',
    // The omen: what the town sees BEFORE the wrath breaks. Shown when a track sinks to the omen
    // stage, so the player is warned by the world, never only by the disaster itself.
    omen: 'The tide runs high and black against the wharves.',
    dire: 'The sea heaves at the seawall. Dagon will have the shore.',
  },
  cthulhu: {
    label: 'Cthulhu',
    wrath: 'The Awakening',
    blurb: 'He lies dreaming. His waking breaks the town and unseats every mind. Favor only delays it.',
    appease: 'Asylums, shrines, and the university slow the dreaming. Nothing halts it.',
    omen: 'The townsfolk share one dream, and wake unrested.',
    dire: 'The dreaming is nearly ended. He stirs in his house at R’lyeh.',
  },
  shub: {
    label: 'Shub-Niggurath',
    wrath: 'The Greening',
    blurb: 'The Black Goat of the Woods. Her growth devours the streets block by block.',
    appease: 'Set grove shrines on open, undeveloped land.',
    omen: 'Strange shoots break the cobbles, and the air turns green and thick.',
    dire: 'The ground crawls with growth. The Black Goat is upon the streets.',
  },
  nyarlathotep: {
    label: 'Nyarlathotep',
    wrath: 'The Burning',
    blurb: 'The Crawling Chaos. He looses fire and riot to run through the streets.',
    appease: 'Hold the Masked Processions and keep a strong constabulary.',
    omen: 'Crowds gather muttering after dark, and torches move in the lanes.',
    dire: 'The mob has the streets and the torches are lit. Fire is coming.',
  },
  yog: {
    label: 'Yog-Sothoth',
    wrath: 'The Rift',
    blurb: 'The gate and the key. His rift scrambles a whole district out of true.',
    appease: 'Raise the university and its Containment Wing.',
    omen: 'Angles fall wrong where the streets meet. Distances do not hold.',
    dire: 'The air splits along a seam of cold violet. The gate is opening.',
  },
};

const FAVOR_START = 70; // each track opens here: uneasy, with years of grace to appease
const FAVOR_MAX = 100;
const WRATH_AT = 0; // favor floor that triggers a wrath
const POST_WRATH_FAVOR = 45; // sated after the god has struck

// Hunger: the base monthly favor loss, plus a share driven by the town's dread. A calm, neglected
// town has years before a god turns (grace to raise the appeasement it needs); a dreadful town is
// stirred far faster, so real dread makes the gods a live threat.
const BASE_HUNGER = 1.0;
const DREAD_HUNGER = 0.045; // at dread 60 this adds ~2.7 (hunger nearly quadruples)

// Cthulhu is not appeased, only delayed: his track creeps down every month no matter what, and
// the town's holy works merely slow the creep toward a floor it never falls below.
const CTHULHU_CREEP = 0.55;
const CTHULHU_FLOOR = 0.12;

// The Cthulhu doom clock (M8). His wrath, the Awakening, is not a stalling loop but a tightening
// clock toward a true end. Each Awakening recovers LESS favor than the last, so the next comes
// sooner; the Awakenings escalate in ruin; and after DOOM_AWAKENINGS of them the dreamer fully
// wakes and the town is lost (sim.ended). The SHAPE and counts here are an operator taste call
// (flagged in the ratify notes); that the clock must END, not stall forever, is not.
const DOOM_AWAKENINGS = 4; // the Awakening that ends the town
const CTHULHU_RECOVERY_BASE = 45; // favor restored after the first Awakening (was the flat POST_WRATH)
const CTHULHU_RECOVERY_STEP = 9; // each further Awakening restores this much less (clock tightens)
const CTHULHU_RECOVERY_MIN = 12; // ...down to this floor, so late Awakenings come fast but not instant

// The favor Cthulhu recovers to after his n-th Awakening (n = 1 for the first). Shrinks with each.
function cthulhuRecovery(n) {
  return clamp(CTHULHU_RECOVERY_BASE - (n - 1) * CTHULHU_RECOVERY_STEP, CTHULHU_RECOVERY_MIN, CTHULHU_RECOVERY_BASE);
}

// A fresh favor record (all gods at the opening value).
function makeFavor() {
  const f = {};
  for (const g of GOD_LIST) f[g] = FAVOR_START;
  return f;
}

// Survey the map for the placements that feed appeasement. A shrine counts toward Dagon (a wharf
// offering) when it stands within two tiles of water, otherwise toward Shub-Niggurath (a grove on
// the open land). Constabularies and universities count for Nyarlathotep and Yog-Sothoth.
function surveyTown(map) {
  const s = { shrineWater: 0, shrineGrove: 0, constabulary: 0, university: 0, asylum: 0, chapel: 0 };
  for (let row = 0; row < map.rows; row++) {
    for (let col = 0; col < map.cols; col++) {
      const t = map.tiles[map.index(col, row)];
      if (!t || !t.structure) continue;
      const kind = t.structure.kind;
      if (kind === 'shrine') {
        if (waterWithin(map, col, row, 2)) s.shrineWater++;
        else s.shrineGrove++;
      } else if (s[kind] !== undefined) {
        s[kind]++;
      }
    }
  }
  return s;
}

function waterWithin(map, col, row, rad) {
  for (let dr = -rad; dr <= rad; dr++) {
    for (let dc = -rad; dc <= rad; dc++) {
      const t = map.tileAt(col + dc, row + dr);
      if (t && isWaterTerrain(t.terrain)) return true;
    }
  }
  return false;
}

// Diminishing returns on stacked appeasement (M8): the k-th same-kind structure appeases less than
// the one before it, so favor from stacking saturates instead of scaling linearly forever. The
// k-th structure contributes `per * ratio^(k-1)`, so a stack of N totals per*(1-ratio^N)/(1-ratio)
// and approaches a ceiling of per/(1-ratio). This keeps the tax-base-vs-favor dial live all game: a
// rich town cannot trivially max four gods by carpeting the map with shrines; at real dread the
// hunger outruns even a saturated stack, so appeasement must be actively maintained.
const STACK_RATIO = 0.6;
function diminishing(count, per) {
  if (count <= 0) return 0;
  return per * (1 - Math.pow(STACK_RATIO, count)) / (1 - STACK_RATIO);
}

// The monthly favor change for one god, given the town survey and the current dread. Positive is
// appeasement (favor rises); negative is neglect (favor falls). Cthulhu is always negative.
function favorDelta(god, survey, sim) {
  if (god === GOD.CTHULHU) {
    // The dreaming is only ever slowed, and each further holy work slows it less (diminishing).
    const slow = diminishing(survey.asylum, 0.15)
      + diminishing(survey.shrineWater + survey.shrineGrove, 0.1)
      + diminishing(survey.university, 0.2);
    return -Math.max(CTHULHU_FLOOR, CTHULHU_CREEP - slow); // delayed, never appeased
  }
  const hunger = BASE_HUNGER + sim.dread * DREAD_HUNGER;
  let appease = 0;
  if (god === GOD.DAGON) {
    appease = (sim.ordinances.harborTithes ? 4 : 0) + diminishing(survey.shrineWater, 3);
  } else if (god === GOD.SHUB) {
    appease = diminishing(survey.shrineGrove, 3);
  } else if (god === GOD.NYARLATHOTEP) {
    appease = (sim.ordinances.maskedProcessions ? 4 : 0) + diminishing(survey.constabulary, 3);
  } else if (god === GOD.YOG) {
    appease = diminishing(survey.university, 5);
  }
  return appease - hunger;
}

// Advance every favor track one month. Mutates sim.favor and returns the list of gods whose track
// reached the wrath floor this step (worst first), for the caller to fire.
function stepFavor(sim) {
  const survey = surveyTown(sim.map);
  const fired = [];
  for (const god of GOD_LIST) {
    sim.favor[god] = clamp(sim.favor[god] + favorDelta(god, survey, sim), 0, FAVOR_MAX);
    if (sim.favor[god] <= WRATH_AT) fired.push(god);
  }
  // Worst-neglected first is deterministic (GOD_LIST order breaks ties).
  return fired;
}

// The wrath forecast ritual (M7): the town must feel a god's anger BEFORE the wrath breaks, never
// only from the disaster. Each favor track passes through named stages as it sinks. The omen and
// dire stages surface an ambient tell (a herald line, a status-strip omen, degrading shrine art).
const FAVOR_STAGE = { CALM: 'calm', UNEASY: 'uneasy', OMEN: 'omen', DIRE: 'dire' };
const OMEN_AT = 30; // at or below this the town sees an omen (the visible warning)
const DIRE_AT = 12; // at or below this the wrath is imminent
const UNEASY_AT = 50;

// The stage a single favor value falls in.
function favorStage(favor) {
  if (favor <= DIRE_AT) return FAVOR_STAGE.DIRE;
  if (favor <= OMEN_AT) return FAVOR_STAGE.OMEN;
  if (favor <= UNEASY_AT) return FAVOR_STAGE.UNEASY;
  return FAVOR_STAGE.CALM;
}

// How far into the "danger band" (0 at the uneasy line, 1 at the wrath floor) a favor value sits.
// The renderer reads this to degrade a god's shrine/structure art in proportion to the anger.
function dangerFraction(favor) {
  if (favor >= UNEASY_AT) return 0;
  return clamp((UNEASY_AT - favor) / UNEASY_AT, 0, 1);
}

// Survey every god's favor and return the forecast: a per-god reading (favor, stage, danger, and
// the omen/dire herald line where it applies) sorted worst-first, plus the single most urgent omen
// line for the status strip. Pure over sim.favor; the UI and renderer both read this.
function wrathForecast(sim) {
  const gods = GOD_LIST.map((god) => {
    const favor = sim.favor[god];
    const stage = favorStage(favor);
    const info = GOD_INFO[god];
    let herald = null;
    if (stage === FAVOR_STAGE.DIRE) herald = info.dire;
    else if (stage === FAVOR_STAGE.OMEN) herald = info.omen;
    return {
      god, favor, stage, danger: dangerFraction(favor),
      label: info.label, wrath: info.wrath, herald,
    };
  });
  gods.sort((a, b) => a.favor - b.favor); // angriest (lowest favor) first
  const omens = gods.filter((g) => g.stage === FAVOR_STAGE.OMEN || g.stage === FAVOR_STAGE.DIRE);
  const worst = gods[0];
  // The status-strip line: the most urgent omen, if any god has reached the omen stage.
  const omenLine = omens.length ? omens[0].herald : null;
  return { gods, omens, worst, omenLine };
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}


// ===== src/disasters.js =====
// The five wrath disasters for INNSMOUTH 2000 (M6).
//
// Each god's wrath is a distinct, deterministic mutation of the map. Two strike all at once (the
// Flood Tide, the Awakening, the Rift); two crawl across the town over several months (the Greening
// and the Burning). A wrath fires when a favor track falls to the floor (src/gods.js) or when the
// player summons it from the disasters menu (the reference's homage, and the test hook). Pure over
// sim + map state (no canvas): render.js reads the marks this leaves, node --test asserts on them.
//
// What a wrath leaves behind, for the renderer:
//   tile.scar = { kind }   burnt | overgrown | rubble | flooded | rift
//   sim.disaster           the active event { god, kind, name, age, maxAge, front:[idx], done }
// A spreading wrath advances one ring per month via advanceDisaster(); an instant one applies in
// full on trigger and lingers only as a short visual flash (age -> maxAge) over its footprint.




// The 4 orthogonal neighbours (fire and growth creep along edges, not diagonals).
const NB4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

const GREENING_MAX_RINGS = 7;
const BURNING_MAX_RINGS = 8;
const GREENING_CAP = 70; // tiles the growth will devour before it spends itself
const BURNING_CAP = 80;

function clampDread(v) { return v < 0 ? 0 : v > 100 ? 100 : v; }

// Strip whatever a lot carries (a wrath destroys what stood there). Leaves terrain + elevation.
function razeTile(tile) {
  tile.building = null;
  tile.object = null;
  tile.structure = null;
  tile.zone = null;
}

// Fire the given god's wrath on the sim. Returns an event { god, kind, name, count, message }.
// Sets sim.disaster to the active event and (for a floor-triggered call) is what the sim runs.
function triggerWrath(sim, god) {
  switch (god) {
    case GOD.DAGON: return floodTide(sim);
    case GOD.CTHULHU: return theAwakening(sim);
    case GOD.SHUB: return theGreening(sim);
    case GOD.NYARLATHOTEP: return theBurning(sim);
    case GOD.YOG: return theRift(sim);
    default: return null;
  }
}

// --- Dagon: The Flood Tide + Deep One uprising -------------------------------------------
// The sea climbs the shore. Low land within reach of water drowns (two rings inland), taking
// whatever stood on it; the surviving waterfront turns to the Deep Ones, and dread surges.
function floodTide(sim) {
  const { map } = sim;
  const drowned = [];
  for (let ring = 0; ring <= 1; ring++) {
    const toDrown = [];
    for (let row = 0; row < map.rows; row++) {
      for (let col = 0; col < map.cols; col++) {
        const t = map.tiles[map.index(col, row)];
        if (isWaterTerrain(t.terrain)) continue;
        if (t.elevation > ring) continue; // only the low shore drowns
        if (!waterAdjacent(map, col, row)) continue;
        toDrown.push([col, row]);
      }
    }
    for (const [col, row] of toDrown) {
      const i = map.index(col, row);
      const t = map.tiles[i];
      razeTile(t);
      t.terrain = TERRAIN.SHALLOW;
      t.elevation = 0;
      t.scar = { kind: 'flooded' };
      refreshConnectionsAround(map, col, row);
      drowned.push(i);
    }
  }
  // Deep One uprising: surviving homes near the new tideline turn Deep One.
  let risen = 0;
  for (let row = 0; row < map.rows; row++) {
    for (let col = 0; col < map.cols; col++) {
      const t = map.tiles[map.index(col, row)];
      if (t.building && t.zone === 'residential' && waterWithin(map, col, row, 2)) {
        t.building.cls = 'deepone';
        risen++;
      }
    }
  }
  sim.dread = clampDread(sim.dread + 20);
  return setEvent(sim, GOD.DAGON, 'flood', {
    front: drowned, maxAge: 4, count: drowned.length,
    message: `The flood tide takes ${drowned.length} lots; ${risen} homes turn to the Deep Ones.`,
  });
}

// --- Cthulhu: The Awakening (earthquake + city-wide madness) ------------------------------
// Rare and ruinous. The ground heaves: most buildings collapse to rubble, roads shear, and every
// mind in the town is unseated (dread all but maxes). Favor only delays this; it cannot soften it.
function theAwakening(sim) {
  const { map, rng } = sim;
  // Each Awakening is worse than the last (M8 doom clock): the ground heaves harder, more falls, and
  // the madness bites deeper. `n` is which Awakening this is (1 for the first).
  const n = (sim.awakenings || 0) + 1;
  sim.awakenings = n;
  const esc = n - 1;
  const razeChance = Math.min(0.92, 0.6 + 0.11 * esc);
  const structChance = Math.min(0.9, 0.45 + 0.12 * esc);
  const roadChance = Math.min(0.9, 0.5 + 0.11 * esc);
  const dreadSpike = Math.min(85, 60 + 8 * esc);
  const wrecked = [];
  for (let row = 0; row < map.rows; row++) {
    for (let col = 0; col < map.cols; col++) {
      const i = map.index(col, row);
      const t = map.tiles[i];
      if (t.building && rng.chance(razeChance)) {
        razeTile(t); t.scar = { kind: 'rubble' }; wrecked.push(i);
      } else if (t.structure && rng.chance(structChance)) {
        razeTile(t); t.scar = { kind: 'rubble' }; wrecked.push(i);
      } else if (t.object && t.object.kind === 'road' && rng.chance(roadChance)) {
        t.object = null; refreshConnectionsAround(map, col, row); wrecked.push(i);
      }
    }
  }
  sim.dread = clampDread(sim.dread + dreadSpike);
  const ordinal = n === DOOM_AWAKENINGS ? 'The dreamer wakes in full' : `The Awakening returns, ${n} times now`;
  return setEvent(sim, GOD.CTHULHU, 'awakening', {
    front: wrecked, maxAge: 6, count: wrecked.length, awakening: n,
    message: n === 1
      ? `The Awakening: the ground heaves and ${wrecked.length} lots fall to ruin.`
      : `${ordinal}: ${wrecked.length} lots fall to ruin.`,
  });
}

// --- Shub-Niggurath: The Greening (crawls block by block) ---------------------------------
// A seed of unnatural growth takes a built lot and spreads outward one ring per month, choking
// streets and buildings under vegetation until it spends itself.
function theGreening(sim) {
  const seed = pickBuiltTile(sim) ?? centreTile(sim.map);
  consumeGreen(sim.map, seed);
  return setEvent(sim, GOD.SHUB, 'greening', {
    front: [seed], maxAge: GREENING_MAX_RINGS, count: 1, consumed: 1,
    message: 'The Greening takes root. Growth begins to devour the streets.',
  });
}

// --- Nyarlathotep: The Burning (fire + riots run the streets) -----------------------------
// Fire catches at a built lot and runs along the streets and rooftops, month by month, while
// riots drive dread up. A constabulary in reach damps the spread.
function theBurning(sim) {
  const seed = pickBuiltTile(sim) ?? centreTile(sim.map);
  consumeBurn(sim.map, seed);
  sim.dread = clampDread(sim.dread + 10);
  return setEvent(sim, GOD.NYARLATHOTEP, 'burning', {
    front: [seed], maxAge: BURNING_MAX_RINGS, count: 1, consumed: 1,
    message: 'Fire catches in the streets, and the mob runs with it.',
  });
}

// --- Yog-Sothoth: The Rift (a district scrambled out of true) -----------------------------
// A gate opens over a district: the contents of its land tiles (roads, zones, buildings,
// structures) are permanently permuted, out of place and out of true. The land itself stays.
function theRift(sim) {
  const { map, rng } = sim;
  const N = 6;
  const anchor = pickBuiltTile(sim) ?? centreTile(sim.map);
  const c0 = clampInt((anchor % map.cols) - Math.floor(N / 2), 0, map.cols - N);
  const r0 = clampInt(Math.floor(anchor / map.cols) - Math.floor(N / 2), 0, map.rows - N);

  const cells = [];
  for (let dr = 0; dr < N; dr++) {
    for (let dc = 0; dc < N; dc++) {
      const col = c0 + dc; const row = r0 + dr;
      const t = map.tileAt(col, row);
      if (!t || isWaterTerrain(t.terrain)) continue; // only relocate what sits on land
      cells.push(map.index(col, row));
    }
  }
  const contents = cells.map((i) => {
    const t = map.tiles[i];
    return { object: t.object, zone: t.zone, building: t.building, structure: t.structure, scar: t.scar };
  });
  const shuffled = rng.shuffle(contents);
  cells.forEach((i, k) => {
    const t = map.tiles[i];
    t.object = shuffled[k].object;
    t.zone = shuffled[k].zone;
    t.building = shuffled[k].building;
    t.structure = shuffled[k].structure;
    t.scar = shuffled[k].scar;
  });
  for (const i of cells) refreshConnectionsAround(map, i % map.cols, Math.floor(i / map.cols));
  sim.dread = clampDread(sim.dread + 15);
  return setEvent(sim, GOD.YOG, 'rift', {
    front: cells, maxAge: 5, count: cells.length,
    message: `The Rift opens: a district of ${cells.length} lots is scrambled out of true.`,
  });
}

// Advance the active spreading disaster one month. Instant events just age out; the Greening and
// the Burning grow their front by one ring. Clears sim.disaster when it is spent.
function advanceDisaster(sim) {
  const d = sim.disaster;
  if (!d || d.done) { sim.disaster = null; return null; }
  d.age++;
  if (d.kind === 'greening') spreadFront(sim, d, greenNeighbours, consumeGreen, GREENING_CAP);
  else if (d.kind === 'burning') {
    spreadFront(sim, d, burnNeighbours, consumeBurn, BURNING_CAP);
    sim.dread = clampDread(sim.dread + 4); // the riot keeps the town on edge
  }
  if (d.age >= d.maxAge || (d.front && d.front.length === 0)) d.done = true;
  return d;
}

// Grow a spreader's front by one ring: from each active tile, catch eligible orthogonal
// neighbours (chance-gated, deterministic), consume them, and make them the new front.
function spreadFront(sim, d, neighboursOf, consume, cap) {
  const { map, rng } = sim;
  const next = [];
  const seen = new Set(d.consumedSet || []);
  for (const idx of d.front) {
    const col = idx % map.cols; const row = Math.floor(idx / map.cols);
    for (const [ncol, nrow, p] of neighboursOf(sim, col, row)) {
      const ni = map.index(ncol, nrow);
      if (seen.has(ni)) continue;
      if ((d.consumed || 0) >= cap) continue;
      if (!rng.chance(p)) continue;
      seen.add(ni);
      consume(map, ni);
      d.consumed = (d.consumed || 0) + 1;
      next.push(ni);
    }
  }
  d.consumedSet = seen;
  d.front = next;
}

// Greening spreads onto any developed lot, road, or open grass; growth ignores nothing green.
function greenNeighbours(sim, col, row) {
  const out = [];
  for (const [dc, dr] of NB4) {
    const t = sim.map.tileAt(col + dc, row + dr);
    if (!t || isWaterTerrain(t.terrain)) continue;
    if (t.scar && t.scar.kind === 'overgrown') continue;
    const developed = t.building || t.object || t.structure || t.zone;
    const p = developed ? 0.85 : (t.terrain === TERRAIN.GRASS ? 0.4 : 0.15);
    out.push([col + dc, row + dr, p]);
  }
  return out;
}

// Fire spreads along what will burn (buildings, structures, roads). A constabulary in reach
// halves the odds a neighbour catches.
function burnNeighbours(sim, col, row) {
  const out = [];
  for (const [dc, dr] of NB4) {
    const ncol = col + dc; const nrow = row + dr;
    const t = sim.map.tileAt(ncol, nrow);
    if (!t) continue;
    if (t.scar && t.scar.kind === 'burnt') continue;
    const flammable = t.building || t.structure || (t.object && t.object.kind === 'road');
    if (!flammable) continue;
    const guarded = constabularyNear(sim.map, ncol, nrow);
    out.push([ncol, nrow, guarded ? 0.35 : 0.8]);
  }
  return out;
}

function consumeGreen(map, idx) {
  const t = map.tiles[idx];
  razeTile(t);
  if (t.terrain !== TERRAIN.ROCK) { t.terrain = TERRAIN.GRASS; }
  t.scar = { kind: 'overgrown' };
  refreshConnectionsAround(map, idx % map.cols, Math.floor(idx / map.cols));
}

function consumeBurn(map, idx) {
  const t = map.tiles[idx];
  razeTile(t);
  t.scar = { kind: 'burnt' };
  refreshConnectionsAround(map, idx % map.cols, Math.floor(idx / map.cols));
}

// --- shared helpers ----------------------------------------------------------------------

function setEvent(sim, god, kind, extra) {
  const info = GOD_INFO[god];
  const event = {
    god, kind, name: info.wrath, age: 0, done: false, consumed: extra.consumed || 0,
    ...extra,
  };
  sim.disaster = event;
  sim.lastWrath = { god, name: info.wrath, message: event.message };
  return event;
}

function waterAdjacent(map, col, row) {
  for (const [dc, dr] of NB4) {
    const t = map.tileAt(col + dc, row + dr);
    if (t && isWaterTerrain(t.terrain)) return true;
  }
  return false;
}

function waterWithin(map, col, row, rad) {
  for (let dr = -rad; dr <= rad; dr++) {
    for (let dc = -rad; dc <= rad; dc++) {
      const t = map.tileAt(col + dc, row + dr);
      if (t && isWaterTerrain(t.terrain)) return true;
    }
  }
  return false;
}

function constabularyNear(map, col, row) {
  const R = 6;
  for (let dr = -R; dr <= R; dr++) {
    for (let dc = -R; dc <= R; dc++) {
      const t = map.tileAt(col + dc, row + dr);
      if (t && t.structure && t.structure.kind === 'constabulary') {
        if (Math.max(Math.abs(dc), Math.abs(dr)) <= R) return true;
      }
    }
  }
  return false;
}

// A built/developed tile to seed a crawling wrath (deterministic pick over the sim rng).
function pickBuiltTile(sim) {
  const { map, rng } = sim;
  const built = [];
  for (let i = 0; i < map.tiles.length; i++) {
    const t = map.tiles[i];
    if (t.building || t.structure) built.push(i);
  }
  if (built.length === 0) return null;
  return rng.pick(built);
}

function centreTile(map) {
  return map.index(Math.floor(map.cols / 2), Math.floor(map.rows / 2));
}

function clampInt(v, lo, hi) {
  v = Math.round(v);
  return v < lo ? lo : v > hi ? hi : v;
}


// ===== src/sim.js =====
// Simulation core for INNSMOUTH 2000 (M3 growth sim).
//
// The heart of the game: zones that reach a road sprout buildings through development tiers,
// population accrues by resident class, and the dread meter reshuffles WHO lives here. The core
// dial (DESIGN-SEED): dread pushes the Unwary out and pulls Cultists and Deep Ones in; the player
// trades tax base against the favour economy. Fully seeded and deterministic so node --test can
// assert on the trajectory. Pure of canvas and DOM. Shrines, the university, and services (which
// steer Cultists and Scholars) arrive in later milestones; M3 grows Unwary / Deep Ones / Cultists
// from dread and waterfront alone, and requires only road access (the power requirement is M5).







// The four resident classes (DESIGN-SEED: our R in the demand model).
const CLASS = {
  UNWARY: 'unwary',
  CULTIST: 'cultist',
  DEEP_ONE: 'deepone',
  SCHOLAR: 'scholar',
};

// Game speeds. The value is the real-time interval (ms) between sim ticks; the browser loop uses
// it. PAUSED never steps. One tick advances the calendar by one month.
const SPEED = {
  PAUSED: 'paused',
  CREEP: 'creep', // a slow, contemplative step (M9): watch the town live and the living world breathe
  SLOW: 'slow',
  MEDIUM: 'medium',
  FAST: 'fast',
};
const SPEED_MS = {
  [SPEED.PAUSED]: Infinity,
  [SPEED.CREEP]: 2400,
  [SPEED.SLOW]: 1200,
  [SPEED.MEDIUM]: 500,
  [SPEED.FAST]: 150,
};

// The tick interval actually used, given the player's chosen speed and whether the world should
// hold back (M9 disaster auto-slow). When auto-slow is on and a wrath is loose, the sim ticks no
// faster than SLOW so the player can watch and react; the chosen speed is left untouched and resumes
// the instant the disaster clears. A already-slower speed (CREEP) is never sped up.
function effectiveTickMs(speed, disasterActive, autoSlow) {
  const base = SPEED_MS[speed] ?? Infinity;
  if (autoSlow && disasterActive && Number.isFinite(base)) return Math.max(base, SPEED_MS[SPEED.SLOW]);
  return base;
}

const MAX_LEVEL = 3; // development tiers per lot

// The city ordinances (DESIGN-SEED). Each has a monthly upkeep and effects; the god-favour hooks
// (Harbor Tithes -> Dagon, Masked Processions -> Nyarlathotep) arrive with the M6 gods layer.
const ORDINANCE = {
  CURFEW: 'curfew',
  MASKED_PROCESSIONS: 'maskedProcessions',
  HARBOR_TITHES: 'harborTithes',
};
const ORDINANCE_INFO = {
  curfew: { label: 'Curfew', upkeep: 20, blurb: 'Quiets the streets. Eases dread; the shops earn less.' },
  maskedProcessions: { label: 'Masked Processions', upkeep: 30, blurb: 'The old rites in the open. Eases dread.' },
  harborTithes: { label: 'Harbor Tithes', upkeep: 15, blurb: 'A levy on the sea-bounty. The wharves pay in.' },
};

// Economic constants (placeholder scale for the prototype; tune freely).
const ECON = {
  START_TREASURY: 20000,
  TAX_UNIT: 10, // money per resident per unit tax rate per month
  SEA_BOUNTY: 6, // money per Deep One per month (their unlocked income)
  COMMERCIAL_INCOME: 40, // money per commercial building per month
  ROAD_UPKEEP: 1,
  BUILDING_UPKEEP: 3,
  DEFAULT_TAX: 0.07,
};

// Bankruptcy (M8): a town whose treasury runs negative cannot pay for its rites and services. Its
// ordinances shut off at once (no new upkeep may be taken on while insolvent), and after a short
// grace the funded municipal services (constabulary, asylum, chapel) go dark, so their dread relief
// is lost and the town spirals unless the coffers are set right. The reference-era ritual: overspend
// and the genre's core tension bites back.
const BANKRUPT_GRACE = 3; // months insolvent before the watch goes unpaid and services cut
const CLASS_LIST = ['unwary', 'cultist', 'deepone', 'scholar'];

// Town titles by population (the reference's Village/Town/City ladder, in a period New England
// register). Shown in the top bar; a plain genre readout of how the settlement has grown.
const TOWN_TITLES = [
  { at: 0, title: 'Landing' },
  { at: 50, title: 'Hamlet' },
  { at: 150, title: 'Village' },
  { at: 400, title: 'Town' },
  { at: 1000, title: 'Port' },
  { at: 2500, title: 'City' },
];
function townTitle(pop) {
  let t = TOWN_TITLES[0].title;
  for (const s of TOWN_TITLES) if (pop >= s.at) t = s.title;
  return t;
}
const MONTHS = [
  'January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December',
];

function isWaterTerrain(t) {
  return t === TERRAIN.DEEP || t === TERRAIN.SHALLOW;
}

// Any road within Chebyshev radius `rad` (road access lets a lot develop).
function hasRoadNear(map, col, row, rad = 2) {
  for (let dr = -rad; dr <= rad; dr++) {
    for (let dc = -rad; dc <= rad; dc++) {
      if (dc === 0 && dr === 0) continue;
      const t = map.tileAt(col + dc, row + dr);
      if (t && t.object && t.object.kind === 'road') return true;
    }
  }
  return false;
}

// Any water within Chebyshev radius `rad` (waterfront lots draw Deep Ones).
function hasWaterNear(map, col, row, rad = 1) {
  for (let dr = -rad; dr <= rad; dr++) {
    for (let dc = -rad; dc <= rad; dc++) {
      const t = map.tileAt(col + dc, row + dr);
      if (t && isWaterTerrain(t.terrain)) return true;
    }
  }
  return false;
}

// The largest structure coverage radius, so a single box scan finds every structure that could
// reach a lot.
const MAX_COVER_RADIUS = 6;

// Count the service structures whose coverage reaches (col,row), by kind. A structure covers a
// lot when the lot is within that structure's own radius (Chebyshev distance).
function coverCounts(map, col, row) {
  const out = { constabulary: 0, asylum: 0, chapel: 0, shrine: 0, university: 0 };
  for (let dr = -MAX_COVER_RADIUS; dr <= MAX_COVER_RADIUS; dr++) {
    for (let dc = -MAX_COVER_RADIUS; dc <= MAX_COVER_RADIUS; dc++) {
      const t = map.tileAt(col + dc, row + dr);
      if (!t || !t.structure) continue;
      const info = STRUCTURE_INFO[t.structure.kind];
      if (!info || info.radius <= 0) continue;
      if (Math.max(Math.abs(dc), Math.abs(dr)) <= info.radius && out[t.structure.kind] !== undefined) {
        out[t.structure.kind]++;
      }
    }
  }
  return out;
}

function makeSim(map, opts = {}) {
  const sim = {
    map,
    rng: makeRng(opts.seed ?? 'Innsmouth-sim'),
    scenario: opts.scenario ?? 'standard',
    year: opts.year ?? 1927,
    foundedYear: opts.year ?? 1927, // the year the town was laid; survival milestones count from here
    month: opts.month ?? 0, // 0 = January
    tick: 0,
    speed: opts.speed ?? SPEED.PAUSED,
    // Ambient dread the meter eases toward, on top of industry and Deep Ones. Later milestones
    // (disasters, ordinances, the deeper Innsmouth taint) drive this; the player fights it down.
    dreadBase: opts.dreadBase ?? 6,
    dread: opts.dread ?? (opts.dreadBase ?? 6), // 0..100
    pop: { unwary: 0, cultist: 0, deepone: 0, scholar: 0 },
    counts: {
      residential: 0, commercial: 0, industrial: 0, road: 0,
      gasworks: 0, whaleoil: 0, constabulary: 0, asylum: 0, chapel: 0, shrine: 0, university: 0,
    },
    // Power state from the last step (energized tiles, network totals). Render + query read it.
    power: { energized: new Set(), components: [], totals: { capacity: 0, demand: 0, powered: 0, unpowered: 0 } },

    // Economy.
    treasury: opts.treasury ?? ECON.START_TREASURY,
    taxRates: {
      unwary: ECON.DEFAULT_TAX, cultist: ECON.DEFAULT_TAX,
      deepone: ECON.DEFAULT_TAX, scholar: ECON.DEFAULT_TAX,
    },
    ordinances: { curfew: false, maskedProcessions: false, harborTithes: false },
    // Bankruptcy state (M8): how many consecutive months the treasury has been negative, and whether
    // the funded services have been cut (their dread relief goes dark until the coffers recover).
    bankruptMonths: opts.bankruptMonths ?? 0,
    servicesCut: opts.servicesCut ?? false,

    // The gods layer (M6): a favor track per god, the gods whose wrath came due last step, the
    // active wrath in progress (a crawling Greening/Burning, or the flash of an instant strike),
    // and the last wrath's herald line for the UI.
    favor: opts.favor ? { ...makeFavor(), ...opts.favor } : makeFavor(),
    pendingWrath: [],
    disaster: null,
    lastWrath: null,
    // The Cthulhu doom clock (M8): how many Awakenings have struck, which survival milestones the
    // town has already passed, and the ending once the dreamer fully wakes (null while the town
    // still stands). `ended` freezes the sim and is surfaced as an end screen.
    awakenings: opts.awakenings ?? 0,
    survivalNoted: opts.survivalNoted ? { ...opts.survivalNoted } : {},
    ended: opts.ended ?? null,
    // The Innsmouth Courier's event log (M7): notable months become period-voice headlines,
    // newest last, capped. The newspaper overlay reads this; nothing else depends on it.
    events: [],
    // The Courier's flavor cycle (M9): a quiet month still goes to press. `flavorIndex` walks the
    // rotating filler column (so no two consecutive fillers repeat) and `lastFlavorTick` throttles
    // it. A real headline always takes the page; filler fills only the silence.
    flavorIndex: 0,
    lastFlavorTick: opts.lastFlavorTick ?? 0,
    // Auto-slow (M9): when a wrath is loose the sim holds back to no faster than SLOW so the player
    // can watch and react (effectiveTickMs applies it). On by default; the chosen speed is untouched.
    autoSlow: opts.autoSlow ?? true,
    // First-contact onboarding (M7): each soft in-fiction prompt fires once, when the novel layer
    // first touches the town (a shrine raised, the first Cultist or Deep One, dread climbing toward
    // the gods). `hints` is a queue the UI shows one at a time and dismisses; `onboarded` records
    // which prompts have already fired so none repeats.
    hints: [],
    onboarded: { shrine: false, cultist: false, deepone: false, dread: false },
    // Whether a neglected favor track looses its wrath automatically on the sim clock. The playable
    // game turns this on (main.js); it stays off by default so a headless sim can be stepped for
    // growth or economy without the gods razing the town. The disasters menu / summonWrath fire
    // regardless of this flag.
    wrath: opts.wrath ?? false,

    setSpeed(s) { if (SPEED_MS[s] !== undefined) this.speed = s; return this; },

    formatDate() { return `${MONTHS[this.month]} ${this.year}`; },

    totalPopulation() {
      return this.pop.unwary + this.pop.cultist + this.pop.deepone + this.pop.scholar;
    },

    setTax(cls, rate) {
      if (this.taxRates[cls] !== undefined) this.taxRates[cls] = clamp(rate, 0, 0.2);
      return this;
    },

    toggleOrdinance(key) {
      if (this.ordinances[key] === undefined) return this;
      // An insolvent town cannot take on new upkeep; it may only switch an ordinance OFF (M8).
      if (!this.ordinances[key] && this.treasury < 0) return this;
      this.ordinances[key] = !this.ordinances[key];
      return this;
    },

    // Spend from the treasury if it can bear it; returns whether the charge went through.
    spend(cost) {
      if (cost <= 0) return true;
      if (this.treasury < cost) return false;
      this.treasury -= cost;
      return true;
    },

    // Advance one month: compute power, grow lots (power gates their height), retally, ease dread,
    // then settle the monthly budget.
    step() {
      if (this.ended) return this; // the dreamer has waked; the world is still
      this.tick++;
      this.month++;
      if (this.month >= 12) { this.month = 0; this.year++; }
      // Snapshot the quantities the Courier watches, before the month resolves.
      const before = {
        favor: { ...this.favor },
        pop: this.totalPopulation(),
        deepone: this.pop.deepone,
        cultist: this.pop.cultist,
        treasury: this.treasury,
      };
      // How many headlines stand before this month resolves: if none is filed all month (a wrath,
      // an omen, a milestone), the Courier prints filler instead (M9 flavor cycle, below).
      const eventsAtMonthStart = this.events.length;
      // A crawling wrath advances a ring before the town lives its month.
      advanceDisaster(this);
      this.power = computePower(this.map);
      growLots(this, this.power);
      reassignAndTally(this);
      updateDread(this);
      // The gods stir: decay favor, then loose the wrath of the worst-neglected god if one came
      // due (only one per month, and not while another wrath is still crawling the streets). Newly
      // due gods JOIN a persistent queue rather than overwrite it, so when two tracks floor the same
      // month the second is not lost to the single disaster slot — the gods do not forget (M8).
      for (const g of stepFavor(this)) if (!this.pendingWrath.includes(g)) this.pendingWrath.push(g);
      if (this.wrath && this.pendingWrath.length && !this.disaster) {
        this.summonWrath(this.pendingWrath.shift());
      }
      this.treasury += computeBudget(this).net;
      applyBankruptcy(this);
      detectExposure(this);
      detectNews(this, before);
      detectSurvival(this);
      detectOnboarding(this);
      // Only in a month with no real headline does the broadsheet fall back on filler.
      if (this.events.length === eventsAtMonthStart) detectFlavor(this);
      return this;
    },

    // Loose a god's wrath now and sate that god (the disasters menu and the favor floor both call
    // this). Returns the wrath event, and files the Courier's front-page headline.
    summonWrath(god) {
      if (this.ended) return null; // the story is over; nothing more can be loosed
      const event = triggerWrath(this, god);
      if (event) {
        const h = WRATH_HEADLINE[event.kind] || ['A WRATH FALLS UPON THE TOWN', event.message];
        noteNews(this, 'wrath', h[0], h[1]);
        if (god === GOD.CTHULHU) {
          // The doom clock (M8): the Awakening tightens (theAwakening bumped this.awakenings). Each
          // recovers less favor than the last, so the next comes sooner; the DOOM_AWAKENINGS-th ends
          // the town for good.
          this.favor[god] = cthulhuRecovery(this.awakenings);
          if (this.awakenings >= DOOM_AWAKENINGS && !this.ended) {
            this.ended = { kind: 'doom', year: this.year, month: this.month, awakenings: this.awakenings };
            noteNews(this, 'doom', 'R’LYEH HAS RISEN; INNSMOUTH IS LOST',
              'The dreamer wakes in full. The town is given over to the sea and the dark.');
          }
        } else if (this.favor[god] !== undefined) {
          this.favor[god] = POST_WRATH_FAVOR;
        }
      }
      return event;
    },
  };

  return sim;
}

// Grow zoned lots that have road access, one tier per eligible month, gated by class demand. A
// lot can put up a first-tier structure on road access alone, but it needs power to grow taller:
// unpowered lots cap at tier 1, powered lots climb to the full tier cap (M5). `power` is the
// per-step power state from computePower.
function growLots(sim, power) {
  const { map, rng } = sim;
  const demand = computeDemand(sim);
  for (let row = 0; row < map.rows; row++) {
    for (let col = 0; col < map.cols; col++) {
      const tile = map.tiles[map.index(col, row)];
      if (!tile.zone) continue;
      if (isWaterTerrain(tile.terrain)) continue;
      if (tile.object && tile.object.kind === 'road') continue; // a road paved over the lot
      if (!hasRoadNear(map, col, row)) {
        // No access: a partly built lot slowly decays back to nothing.
        if (tile.building && rng.chance(0.15)) {
          tile.building.level -= 1;
          if (tile.building.level <= 0) tile.building = null;
        }
        continue;
      }
      const cap = (power && energizedNear(map, power, col, row)) ? MAX_LEVEL : 1;
      const d = demand[tile.zone];
