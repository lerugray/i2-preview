      if (!tile.building) {
        if (rng.chance(d * 0.6)) tile.building = { level: 1, cls: CLASS.UNWARY };
      } else if (tile.building.level < cap) {
        if (rng.chance(d * 0.35)) tile.building.level += 1;
      }
    }
  }
}

// Class demand per zone type in [0,1]. Residential is steady (dread reshuffles class, not the
// total wish to settle); commercial follows population; industrial holds a working baseline.
function computeDemand(sim) {
  const pop = sim.totalPopulation();
  return {
    [ZONE.RESIDENTIAL]: 0.75,
    [ZONE.COMMERCIAL]: Math.min(0.9, 0.25 + pop / 400),
    [ZONE.INDUSTRIAL]: 0.6,
  };
}

// Decide a residential lot's resident class from dread, waterfront, and the chapel-versus-shrine
// tension (DESIGN-SEED core dial). Deep Ones take the waterfront once dread rises. Inland, a shrine
// pulls Cultists in at far lower dread than the ambient threshold, while a chapel in reach holds
// folk to the Old Faith even against high dread. Where both cover a lot, the shrine only prevails
// if it out-numbers the chapel: the tension the player must manage.
function classFor(sim, col, row) {
  const waterfront = hasWaterNear(sim.map, col, row, 1);
  if (waterfront && sim.dread >= 30) return CLASS.DEEP_ONE;
  const cov = coverCounts(sim.map, col, row);
  if (cov.shrine - cov.chapel > 0 && sim.dread >= 20) return CLASS.CULTIST; // the shrine holds sway
  // The university draws Scholars to its campus (STUDY: "Scholars come for the university"), so long
  // as the cult has not claimed the ground and the town is not overwhelmed by dread. Scholars are the
  // educated Unwary; they ease dread but risk an Exposure when the Containment Wing fails (M8).
  if (cov.university > 0 && sim.dread < 60) return CLASS.SCHOLAR;
  if (cov.chapel > 0) return CLASS.UNWARY; // the Old Faith keeps them
  if (sim.dread >= 50) return CLASS.CULTIST;
  return CLASS.UNWARY;
}

// Reassign residential classes and retally population, building counts, and roads.
function reassignAndTally(sim) {
  const { map } = sim;
  const pop = { unwary: 0, cultist: 0, deepone: 0, scholar: 0 };
  const counts = {
    residential: 0, commercial: 0, industrial: 0, road: 0,
    gasworks: 0, whaleoil: 0, constabulary: 0, asylum: 0, chapel: 0, shrine: 0,
  };
  for (let row = 0; row < map.rows; row++) {
    for (let col = 0; col < map.cols; col++) {
      const tile = map.tiles[map.index(col, row)];
      if (tile.object && tile.object.kind === 'road') counts.road++;
      if (tile.structure && counts[tile.structure.kind] !== undefined) counts[tile.structure.kind]++;
      if (!tile.building || !tile.zone) continue;
      counts[tile.zone] = (counts[tile.zone] || 0) + 1;
      if (tile.zone !== ZONE.RESIDENTIAL) continue;
      const cls = classFor(sim, col, row);
      tile.building.cls = cls;
      pop[cls] += tile.building.level * 8; // 8 souls per tier
    }
  }
  sim.pop = pop;
  sim.counts = counts;
}

// Why is this lot the way it is? (M7 query "why".) Plain-English diagnostics for the query window:
// a stalled lot says what holds it back (no road, no power), a built one says how it fares, and a
// residential lot says why its residents are who they are. Pure over sim + map; truthful to the
// model (dread reshuffles class, it does not stall growth, so we never claim otherwise).
function explainLot(sim, col, row) {
  const { map, power } = sim;
  const tile = map.tileAt(col, row);
  if (!tile) return [];
  const zoned = tile.zone && !isWaterTerrain(tile.terrain) && !(tile.object && tile.object.kind === 'road');
  if (!zoned) return [];
  const lines = [];
  const road = hasRoadNear(map, col, row);
  const powered = !!(power && energizedNear(map, power, col, row));
  if (!road) {
    lines.push('Stalled: no road within reach.');
  } else if (!tile.building) {
    lines.push('Zoned and served. Awaiting settlement.');
  } else {
    const cap = powered ? MAX_LEVEL : 1;
    if (!powered) lines.push('No power: not on a working grid.');
    if (tile.building.level >= cap) {
      lines.push(powered ? 'Fully built up.' : 'As high as it grows unpowered.');
    } else {
      lines.push('Growing.');
    }
  }
  if (tile.zone === ZONE.RESIDENTIAL && tile.building) lines.push(classReason(sim, col, row));
  return lines;
}

// Explain a residential lot's resident class (mirrors classFor). Plain English, period register.
function classReason(sim, col, row) {
  const waterfront = hasWaterNear(sim.map, col, row, 1);
  if (waterfront && sim.dread >= 30) return 'The waterfront has turned to the Deep Ones.';
  const cov = coverCounts(sim.map, col, row);
  if (cov.shrine - cov.chapel > 0 && sim.dread >= 20) return 'A shrine holds sway. The cult has come.';
  if (cov.university > 0 && sim.dread < 60) return 'Scholars gather for the university nearby.';
  if (cov.chapel > 0) return 'The Old Faith keeps them from the cult.';
  if (sim.dread >= 50) return 'Dread has turned them to the cult.';
  return 'The Unwary hold on here, for now.';
}

// The monthly budget: income (taxes, sea-bounty, commerce) minus expenses (maintenance, ordinance
// upkeep). Pure over sim state; the budget window reads the same lines. Returns whole-money values.
function computeBudget(sim) {
  const tax = Math.round(
    CLASS_LIST.reduce((s, c) => s + sim.pop[c] * sim.taxRates[c] * ECON.TAX_UNIT, 0),
  );
  const bounty = Math.round(
    sim.pop.deepone * ECON.SEA_BOUNTY * (sim.ordinances.harborTithes ? 1.5 : 1),
  );
  const commerce = Math.round(
    sim.counts.commercial * ECON.COMMERCIAL_INCOME * (sim.ordinances.curfew ? 0.9 : 1),
  );
  const income = tax + bounty + commerce;

  const buildings = sim.counts.residential + sim.counts.commercial + sim.counts.industrial;
  const maintenance = sim.counts.road * ECON.ROAD_UPKEEP + buildings * ECON.BUILDING_UPKEEP;
  let ordinanceUpkeep = 0;
  for (const key of Object.keys(sim.ordinances)) {
    if (sim.ordinances[key]) ordinanceUpkeep += ORDINANCE_INFO[key].upkeep;
  }
  // Power sources and services carry a monthly upkeep (M5).
  let services = 0;
  for (const kind of Object.keys(STRUCTURE_INFO)) {
    services += (sim.counts[kind] || 0) * STRUCTURE_INFO[kind].upkeep;
  }
  const expenses = maintenance + ordinanceUpkeep + services;

  return {
    income, expenses, net: income - expenses,
    lines: { tax, bounty, commerce, maintenance, ordinanceUpkeep, services },
  };
}

// Resolve the town's solvency after the month settles (M8). A negative treasury forces every
// ordinance off (and blocks re-enabling any while insolvent, see toggleOrdinance); after a short
// grace the funded municipal services are cut, so updateDread stops crediting their relief. Recovery
// (treasury back to zero or above) clears the cut, though the player must re-enable their ordinances.
function applyBankruptcy(sim) {
  if (sim.treasury < 0) {
    const wasCut = sim.servicesCut;
    sim.bankruptMonths++;
    for (const k of Object.keys(sim.ordinances)) sim.ordinances[k] = false;
    sim.servicesCut = sim.bankruptMonths >= BANKRUPT_GRACE;
    if (sim.servicesCut && !wasCut) {
      noteNews(sim, 'money', 'THE WATCH GOES UNPAID',
        'Constable and keeper walk off unpaid; the town is left to its own dread.');
    }
  } else {
    sim.bankruptMonths = 0;
    sim.servicesCut = false;
  }
}

// Ease the dread meter toward a target driven by industry and Deep Ones (up) and Scholars, the
// public-order ordinances, and the town's services (down or up). Chapels, the constabulary, and
// the asylum press dread down; shrines press it up (STRUCTURE_INFO.dread carries each sign).
function updateDread(sim) {
  const ordinanceRelief = (sim.ordinances.curfew ? 6 : 0) + (sim.ordinances.maskedProcessions ? 9 : 0);
  let structureDread = 0;
  for (const kind of Object.keys(STRUCTURE_INFO)) {
    const d = STRUCTURE_INFO[kind].dread;
    // A cut (unfunded) service stops working: its dread RELIEF goes dark while the town is insolvent.
    // Dread-RAISING structures (shrines) need no funding and keep their effect.
    if (sim.servicesCut && d < 0) continue;
    structureDread += (sim.counts[kind] || 0) * d;
  }
  const target = clamp(
    sim.dreadBase
    + 2.0 * sim.counts.industrial
    + 0.03 * sim.pop.deepone
    - 0.04 * sim.pop.scholar
    - ordinanceRelief
    + structureDread,
    0, 100,
  );
  sim.dread = clamp(sim.dread + (target - sim.dread) * 0.25, 0, 100);
}

// --- The Innsmouth Courier: headlines from real sim events (M7) ---------------------------
// A dry New England broadsheet sliding by degrees into cosmic dread. Headlines are generated from
// what actually happened in the sim this month; the newspaper overlay renders these strings.
const NEWS_CAP = 40;

const WRATH_HEADLINE = {
  flood: ['THE TIDE TAKES THE LOWER WARD', 'The sea has climbed the seawall in the night.'],
  awakening: ['THE GROUND HEAVES; RUIN IN THE STREETS', 'Whole rows are thrown down, and no man will say why.'],
  greening: ['UNNATURAL GROWTH CHOKES THE LANES', 'A green rot spreads block by block, past all cutting.'],
  burning: ['FIRE AND RIOT RUN THE STREETS', 'The mob has the torches, and will not be stilled.'],
  rift: ['A DISTRICT FOUND OUT OF TRUE', 'Surveyors report the streets no longer meet as once they did.'],
};

const OMEN_HEADLINE = {
  dagon: 'FISHERMEN REPORT THE WATER RUNNING BLACK',
  cthulhu: 'THE WHOLE TOWN SHARES A TROUBLED DREAM',
  shub: 'STRANGE SHOOTS BREAK THE COBBLESTONES',
  nyarlathotep: 'CROWDS GATHER MUTTERING AFTER DARK',
  yog: 'SURVEYORS FIND THE ANGLES WILL NOT HOLD',
};

const POP_MILESTONES = [50, 100, 250, 500, 1000, 2000];

function noteNews(sim, kind, headline, sub = '') {
  sim.events.push({ kind, headline, sub, year: sim.year, month: sim.month, tick: sim.tick });
  if (sim.events.length > NEWS_CAP) sim.events.shift();
}

// Compare month-over-month to file the Courier's headlines: gods sliding into omen, the first of a
// new class settling in, population milestones passed, the coffers running dry.
function detectNews(sim, before) {
  for (const g of GOD_LIST) {
    const was = favorStage(before.favor[g]);
    const now = favorStage(sim.favor[g]);
    if (now === FAVOR_STAGE.OMEN && was !== FAVOR_STAGE.OMEN && was !== FAVOR_STAGE.DIRE) {
      noteNews(sim, 'omen', OMEN_HEADLINE[g] || 'AN ILL OMEN OVER THE TOWN', GOD_INFO[g].omen);
    }
  }
  if (before.deepone === 0 && sim.pop.deepone > 0) {
    noteNews(sim, 'class', 'THE WATERFRONT KEEPS TO ITSELF', 'The old families are seen no more by day.');
  }
  if (before.cultist === 0 && sim.pop.cultist > 0) {
    noteNews(sim, 'class', 'A CONGREGATION GATHERS AFTER DARK', 'Lamps burn late where the shrine stands.');
  }
  const pop = sim.totalPopulation();
  for (const m of POP_MILESTONES) {
    if (before.pop < m && pop >= m) noteNews(sim, 'growth', `INNSMOUTH NUMBERS ${m} SOULS`, 'The town grows along the shore.');
  }
  if (before.treasury >= 0 && sim.treasury < 0) {
    noteNews(sim, 'money', 'TOWN COFFERS RUN DRY', 'The ledger is deep in the red.');
  }
}

// First-contact onboarding (M7): soft in-fiction teaching prompts, each fired once as the novel
// layer first touches the town. The UI shows one at a time and dismisses it.
const ONBOARDING = {
  shrine: 'A shrine draws the cult and raises the dread around it. Watch who your townsfolk become.',
  cultist: 'The Unwary do not stay where dread grows. Some have turned to the cult.',
  deepone: 'The waterfront has taken to the deep. The Deep Ones pay a sea-bounty, but dread rises.',
  dread: 'As dread climbs the gods grow hungry. Watch the Gods panel; a wrath is heralded first.',
};
function detectOnboarding(sim) {
  const fire = (key) => {
    if (sim.onboarded[key]) return;
    sim.onboarded[key] = true;
    sim.hints.push(ONBOARDING[key]);
  };
  if (sim.counts.shrine > 0) fire('shrine');
  if (sim.pop.cultist > 0) fire('cultist');
  if (sim.pop.deepone > 0) fire('deepone');
  if (sim.dread >= 40) fire('dread');
}

// Exposure events (M8): the price of Scholars. A large campus in a dread-soaked town risks
// uncovering what should have stayed buried; an Exposure spikes the town's dread. Risk scales with
// the Scholar population and the standing dread, so a big campus is a live hazard the player weighs
// against the Scholars' tax base and their own small dread relief. (An Exposure that lifts dread past
// the Scholar threshold converts the campus away, a self-correcting feedback.)
const EXPOSURE_MIN_SCHOLARS = 40; // below this the campus is too small to loose anything
function detectExposure(sim) {
  if (sim.pop.scholar < EXPOSURE_MIN_SCHOLARS) return;
  // Occasional, not monthly: an Exposure is a dramatic beat, so the risk stays low even for a big
  // dread-soaked campus (a first pass fired ~30%/month and flooded the Courier — a playtest catch).
  const risk = clamp((sim.pop.scholar / 1600) * (sim.dread / 100), 0, 0.05);
  if (sim.rng.chance(risk)) {
    sim.dread = clamp(sim.dread + 10, 0, 100);
    noteNews(sim, 'exposure', 'A SCHOLAR IS FOUND RAVING',
      'What the campus uncovered should have stayed buried. A dread runs through the town.');
  }
}

// Survival milestones (M8): the counter-beat to the doom clock. A town that holds together across
// the decades earns the Courier's notice. These fire once each, on the sim clock, from the years
// survived since founding; they give the endless game a shape of endurance against the Awakening.
const SURVIVAL_MARKS = [25, 50, 75, 100];
function detectSurvival(sim) {
  if (sim.ended) return;
  const survived = sim.year - sim.foundedYear;
  for (const mark of SURVIVAL_MARKS) {
    if (survived >= mark && !sim.survivalNoted[mark]) {
      sim.survivalNoted[mark] = true;
      noteNews(sim, 'survival', `INNSMOUTH HAS STOOD ${mark} YEARS`,
        'The town endures along the shore, and the deep still keeps its dreaming.');
    }
  }
}

// The Courier's flavor cycle (M9): a quiet month still fills a column. A rotating set of dry New
// England broadsheet filler that slides, by degrees, from harbor almanac into cosmic unease, in the
// same period register as the real headlines. Flavor only: detectFlavor runs only in a month where
// nothing real was filed, and no more than once every FLAVOR_COOLDOWN months, so filler can never
// crowd the record. The pool walks in order (no immediate repeat) and wraps. Deterministic: no RNG,
// so a seeded run and its save reload print the same column.
const FLAVOR_COOLDOWN = 4; // quiet months between fillers
const FLAVOR_FILLER = [
  ['TIDE TABLES AND SHIPPING NOTES', 'The packet from Newburyport is again behindhand.'],
  ['MARKET PRICES HOLD ALONG THE SHORE', 'Salt cod steady; the gold trade asks no questions.'],
  ['SELECTMEN TO MEET ON THE SEAWALL', 'The old stones want mending before the autumn gales.'],
  ['A FINE CATCH REPORTED OFF THE REEF', 'The boats come back low in the water, and the crews say little.'],
  ['NOTES FROM THE PARISH REGISTER', 'Fewer christenings this season, and stranger names given.'],
  ['THE FOG SITS LATE UPON THE HARBOR', 'Old hands cannot recall a summer so grey.'],
  ['GULLS SEEN INLAND IN GREAT NUMBER', 'They wheel over the rooftops and will not settle.'],
  ['A HYMN HEARD FROM THE WATER AT NIGHT', 'The watch reports singing, and no vessel to sing it.'],
  ['THE DEVIL REEF LIES QUIET, FOR NOW', 'Fishermen give it a wide berth, as their fathers did.'],
  ['LAMPS BURN LATE IN THE LOWER WARD', 'What business keeps them, no neighbor will say.'],
  ['THE WELLS TASTE OF SALT AND SOMETHING ELSE', 'The town draws its water higher up the hill.'],
  ['STRANGERS ASK THE ROAD TO THE SHORE', 'They are told it, and are not seen to leave.'],
];

function detectFlavor(sim) {
  if (sim.tick - sim.lastFlavorTick < FLAVOR_COOLDOWN) return;
  const idx = sim.flavorIndex % FLAVOR_FILLER.length;
  sim.flavorIndex++;
  sim.lastFlavorTick = sim.tick;
  const [headline, sub] = FLAVOR_FILLER[idx];
  noteNews(sim, 'flavor', headline, sub);
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}



// ===== src/scenarios.js =====
// Difficulty / scenario starts for INNSMOUTH 2000 (M8).
//
// Four ways to begin: the standard town, an easy calm cove, a hard blighted shore, and a
// disaster-recovery start where the sea has already taken the low ground. Each is just a set of
// makeSim options plus an optional world setup, so a scenario is data, not a code path. main.js
// reads ?scenario=<key>; the model here is pure and node-testable.

const SCENARIOS = {
  standard: {
    key: 'standard', label: 'Innsmouth',
    blurb: 'The town as it was found. A fair start on a quiet shore.',
    opts: { treasury: 20000, dreadBase: 6 },
  },
  easy: {
    key: 'easy', label: 'The Quiet Cove',
    blurb: 'A full purse and a calm shore. Room to learn the tides.',
    opts: { treasury: 35000, dreadBase: 4 },
  },
  hard: {
    key: 'hard', label: 'The Blighted Shore',
    blurb: 'A poor town under a heavy dread. The gods are close from the first.',
    opts: { treasury: 10000, dreadBase: 12 },
  },
  recovery: {
    key: 'recovery', label: 'After the Tide',
    blurb: 'The sea has already climbed the low ground. Rebuild what the flood took.',
    opts: { treasury: 14000, dreadBase: 9 },
    recovery: true,
  },
};

const SCENARIO_LIST = ['standard', 'easy', 'hard', 'recovery'];

// Resolve a key to a scenario, falling back to the standard start.
function scenarioFor(key) {
  return SCENARIOS[key] || SCENARIOS.standard;
}

// Apply a scenario's world setup after the sim is made. For the recovery start, the sea has already
// come and gone: we loose and then clear a Flood Tide, leaving the low shore flooded and scarred for
// the player to rebuild (reusing the tested disaster code rather than a parallel flood routine).
function applyScenario(sim, key) {
  const sc = scenarioFor(key);
  if (sc.recovery) {
    sim.summonWrath('dagon');  // the tide climbs the low shore, scarring it
    sim.disaster = null;       // it is aftermath now, not a wrath in progress
    sim.lastWrath = null;
    sim.pendingWrath = [];
  }
  return sc;
}


// ===== src/ambient.js =====
// Ambient animation for INNSMOUTH 2000 (M9): the living world.
//
// The town breathes: gulls wheel over the water, fog banks drift across the map, slow shadows glide
// under the sea, a cart trundles a lane, and a procession walks toward a shrine. This is ATMOSPHERE,
// not simulation. It reads the map but never touches game state; nothing here changes a tile, a
// favour track, or a population. Everything is a smooth, deterministic function of a time value, so
// it needs no per-frame RNG and no stored motion state; a headless capture at any instant is valid.
//
// Two halves keep it cheap:
//   scanAmbientSites(map)   the O(map) scan for water / roads / shrines. The renderer caches this
//                           and refreshes it only occasionally (sites change slowly).
//   computeAmbient(...)     the per-frame math over the cached sites: tiny counts, hard caps below.
//
// Motion is slow and non-strobing by construction (the speeds below are small): the atmosphere never
// flashes or shakes, honouring the disaster-layer flash/shake discipline. A reduced-motion / low-power
// toggle drops every moving entity to nothing (the renderer keeps only its static fog wash), so the
// world can be stilled on a weak machine or for a player who wants it quiet.




const TAU = Math.PI * 2;

// Hard caps: how many of each ambient entity may ever exist at once, regardless of map size. Keeps
// the living world cheap and uncluttered (a few gulls read as a flock; a screenful would be noise).
const AMBIENT_CAPS = { gulls: 11, fog: 4, waterShadows: 6, carts: 3, processions: 2 };

// Slow, bounded motion rates (world units or radians per second). All small: nothing here moves fast
// enough to strobe or jitter.
const RATE = {
  gullOrbit: 0.28, // radians/sec a gull wheels about its home point
  gullFlap: 5.2, // radians/sec the wing V opens and closes (a flap, not a strobe)
  fogDrift: 7.5, // world px/sec a fog bank slides
  shadowDrift: 0.18, // radians/sec a sea shadow loops
  cartSpeed: 0.06, // fraction of a lane traversed per second (a slow trundle)
  processionSpeed: 0.05, // fraction of the approach walked per second
};

// A cheap deterministic [0,1) from an integer index (an integer hash; no Math.random, so a capture
// and a reload agree). Used to scatter phases and home points without storing any RNG state.
function hash01(n) {
  let x = (n | 0) ^ 0x9e3779b9;
  x = Math.imul(x ^ (x >>> 16), 0x21f0aaad);
  x = Math.imul(x ^ (x >>> 15), 0x735a2d97);
  x ^= x >>> 15;
  return (x >>> 0) / 4294967296;
}

// Scan the map once for the sites ambient life attaches to: a sampled scatter of open-water points
// (sea shadows glide over these), the road runs a cart can trundle, and the shrines a procession
// walks toward. O(cols*rows); the renderer caches the result and refreshes it seldom.
function scanAmbientSites(map) {
  const water = [];
  const shrines = [];
  const roadSet = new Set();
  const idx = (c, r) => r * map.cols + c;
  // Sample water on a stride so a vast sea does not build a vast list; a handful of anchors is enough.
  const stride = 5;
  for (let r = 0; r < map.rows; r++) {
    for (let c = 0; c < map.cols; c++) {
      const t = map.tileAt(c, r);
      if (!t) continue;
      if (isWaterTerrain(t.terrain)) {
        if (c % stride === 0 && r % stride === 0 && water.length < 60) water.push({ col: c, row: r });
      }
      if (t.object && t.object.kind === 'road') roadSet.add(idx(c, r));
      if (t.structure && t.structure.kind === 'shrine') shrines.push({ col: c, row: r });
    }
  }
  const roadRuns = buildRoadRuns(map, roadSet);
  return { water, roadRuns, shrines };
}

// Greedily walk the road tiles into a few polylines (a "run" is a connected chain of lanes). Only as
// many as a cart could ride are kept, each at least two tiles long so it has a direction to travel.
function buildRoadRuns(map, roadSet, maxRuns = AMBIENT_CAPS.carts) {
  const runs = [];
  const visited = new Set();
  const NB = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const key = (c, r) => r * map.cols + c;
  const isRoad = (c, r) => roadSet.has(key(c, r));
  for (const start of roadSet) {
    if (runs.length >= maxRuns) break;
    if (visited.has(start)) continue;
    const c0 = start % map.cols;
    const r0 = Math.floor(start / map.cols);
    // Walk in one consistent direction as far as unvisited road continues: a lane, not a scribble.
    const run = [{ col: c0, row: r0 }];
    visited.add(start);
    let cur = { col: c0, row: r0 };
    let guard = 0;
    while (guard++ < map.cols + map.rows) {
      let next = null;
      for (const [dc, dr] of NB) {
        const nc = cur.col + dc;
        const nr = cur.row + dr;
        if (isRoad(nc, nr) && !visited.has(key(nc, nr))) { next = { col: nc, row: nr }; break; }
      }
      if (!next) break;
      visited.add(key(next.col, next.row));
      run.push(next);
      cur = next;
    }
    if (run.length >= 2) runs.push(run);
  }
  return runs;
}

// The world rectangle the map occupies, plus a margin so fog banks and gulls can drift in from just
// off the edges rather than popping in at the boundary.
function ambientWorldBounds(map, margin = 200) {
  const b = mapWorldBounds(map.cols, map.rows);
  return { minX: b.minX - margin, maxX: b.maxX + margin, minY: b.minY - margin, maxY: b.maxY + margin };
}

// The per-frame ambient state over the cached sites at time `timeMs`. Returns bags of entities in
// WORLD coordinates (the camera projects them). Pure; no allocation beyond the returned arrays; no
// game-state read or write. With opts.reducedMotion every moving bag is empty (the low-power path).
function computeAmbient(sites, bounds, timeMs, opts = {}) {
  const empty = { gulls: [], fog: [], waterShadows: [], carts: [], processions: [] };
  if (opts.reducedMotion) return empty;
  const t = timeMs / 1000;
  return {
    gulls: computeGulls(bounds, t),
    fog: computeFog(bounds, t),
    waterShadows: computeWaterShadows(sites.water, t),
    carts: computeCarts(sites.roadRuns, t),
    processions: computeProcessions(sites.shrines, t),
  };
}

// Gulls wheel on slow flattened orbits about scattered home points over the whole map, wings opening
// and closing. A flock, capped small.
function computeGulls(bounds, t) {
  const out = [];
  const spanX = bounds.maxX - bounds.minX;
  const spanY = bounds.maxY - bounds.minY;
  for (let i = 0; i < AMBIENT_CAPS.gulls; i++) {
    const homeX = bounds.minX + hash01(i * 2 + 1) * spanX;
    const homeY = bounds.minY + hash01(i * 2 + 7) * spanY * 0.85;
    const radius = 34 + hash01(i + 40) * 60;
    const dir = hash01(i + 90) < 0.5 ? -1 : 1;
    const ang = hash01(i + 3) * TAU + dir * t * RATE.gullOrbit;
    const x = homeX + Math.cos(ang) * radius;
    const y = homeY + Math.sin(ang) * radius * 0.5; // flattened for the dimetric plane
    const wing = 0.5 + 0.5 * Math.sin(t * RATE.gullFlap + hash01(i + 11) * TAU);
    out.push({ x, y, wing });
  }
  return out;
}

// Fog banks: broad soft ellipses sliding along the map, wrapping around when they leave the far edge.
function computeFog(bounds, t) {
  const out = [];
  const spanX = bounds.maxX - bounds.minX;
  const spanY = bounds.maxY - bounds.minY;
  const wrap = spanX + 400; // the wrap length includes room for a bank's own width
  for (let i = 0; i < AMBIENT_CAPS.fog; i++) {
    const w = 220 + hash01(i + 5) * 200;
    const h = 70 + hash01(i + 15) * 50;
    const y = bounds.minY + hash01(i + 25) * spanY;
    const phase = hash01(i + 35) * wrap;
    const x = bounds.minX - 200 + ((phase + t * RATE.fogDrift) % wrap);
    const alpha = 0.09 + hash01(i + 45) * 0.08; // faint, but enough that a drifting bank reads
    out.push({ x, y, w, h, alpha });
  }
  return out;
}

// Slow shadows gliding under the sea surface (a shape passing below the water). Each loops a small
// ellipse about a sampled water anchor. None if the map has no open water.
function computeWaterShadows(water, t) {
  const out = [];
  if (!water.length) return out;
  const count = Math.min(AMBIENT_CAPS.waterShadows, water.length);
  for (let i = 0; i < count; i++) {
    const anchor = water[(i * 7) % water.length];
    const w = tileToWorld(anchor.col, anchor.row);
    const r = 22 + hash01(i + 60) * 26;
    const ang = hash01(i + 70) * TAU + t * RATE.shadowDrift;
    const x = w.x + Math.cos(ang) * r;
    const y = w.y + Math.sin(ang) * r * 0.5;
    const rad = 20 + hash01(i + 80) * 14;
    out.push({ x, y, rad });
  }
  return out;
}

// A cart trundles each road run, ping-ponging along the lane (out to the end and back), so it never
// teleports. Position is a smooth function of time along the polyline of tile centres.
function computeCarts(roadRuns, t) {
  const out = [];
  const count = Math.min(AMBIENT_CAPS.carts, roadRuns.length);
  for (let i = 0; i < count; i++) {
    const run = roadRuns[i];
    const segs = run.length - 1;
    // Ping-pong parameter in [0, segs]: a triangle wave over time, offset per cart.
    const phase = (t * RATE.cartSpeed + hash01(i + 100)) % 1; // 0..1 over the full there-and-back
    const tri = phase < 0.5 ? phase * 2 : (1 - phase) * 2; // 0..1..0
    const along = tri * segs;
    const s = Math.min(Math.floor(along), segs - 1);
    const f = along - s;
    const a = tileToWorld(run[s].col, run[s].row);
    const b = tileToWorld(run[s + 1].col, run[s + 1].row);
    out.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
  }
  return out;
}

// A procession walks toward each shrine: a short file of hooded figures moving up an approach line
// from inland toward the shrine, looping. None without a shrine. Cheap: a handful of dots per shrine.
function computeProcessions(shrines, t) {
  const out = [];
  const count = Math.min(AMBIENT_CAPS.processions, shrines.length);
  const FIGURES = 4;
  for (let i = 0; i < count; i++) {
    const shrine = shrines[i];
    const end = tileToWorld(shrine.col, shrine.row);
    // Approach from up the slope (inland is smaller col+row): a short line ending at the shrine.
    const start = tileToWorld(shrine.col - 3, shrine.row - 3);
    const figures = [];
    for (let k = 0; k < FIGURES; k++) {
      const p = (t * RATE.processionSpeed + k / FIGURES + hash01(i + 200) ) % 1;
      figures.push({ x: start.x + (end.x - start.x) * p, y: start.y + (end.y - start.y) * p });
    }
    out.push({ figures, shrine: { x: end.x, y: end.y } });
  }
  return out;
}


// ===== src/render.js =====
// Canvas dimetric renderer for INNSMOUTH 2000.
//
// The draw path needs a canvas 2D context and (in the browser) a document to bake tile sprites,
// but the projection math is pure and lives up top so node --test can cover it. The renderer
// culls to the visible viewport, draws tiles back-to-front (painter's order, STUDY 1.3), blits
// an ordered-dithered top-face sprite per terrain, and draws solid ramp-shaded wall bands under
// raised terrain (STUDY 1.2). No smooth gradients: every shade is a palette ramp step or a
// two-tone ordered dither, per the aesthetic law.




// --- pure screen geometry (testable in node) ---------------------------------------------

// The screen-space faces of a tile: its raised top-diamond corners, the two visible wall
// quads, and the wall height in screen pixels. Pure: only uses the camera's pure transform.
function tileScreenFaces(col, row, elevation, camera) {
  const world = tileToWorldElevated(col, row, elevation);
  const c = camera.worldToScreen(world.x, world.y);
  const hw = HALF_W * camera.zoom;
  const hh = HALF_H * camera.zoom;
  const wallH = elevation * ELEV_STEP * camera.zoom;
  const T = { x: c.x, y: c.y - hh };
  const R = { x: c.x + hw, y: c.y };
  const B = { x: c.x, y: c.y + hh };
  const L = { x: c.x - hw, y: c.y };
  return {
    center: c,
    top: T, right: R, bottom: B, left: L,
    hw, hh, wallH,
    // Left-facing wall (down-left edge L->B) and right-facing wall (down-right edge B->R).
    leftWall: [L, B, { x: B.x, y: B.y + wallH }, { x: L.x, y: L.y + wallH }],
    rightWall: [B, R, { x: R.x, y: R.y + wallH }, { x: B.x, y: B.y + wallH }],
  };
}

// The midpoints of a tile's four diamond edges, keyed by the auto-connect direction bit that
// crosses that edge (STUDY 1.1 adjacency). Roads and wires run from the tile centre to these.
function edgeMidpoints(faces) {
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  return {
    [DIR.SE.bit]: mid(faces.bottom, faces.right), // toward (col+1, row)
    [DIR.SW.bit]: mid(faces.bottom, faces.left), // toward (col, row+1)
    [DIR.NW.bit]: mid(faces.left, faces.top), // toward (col-1, row)
    [DIR.NE.bit]: mid(faces.top, faces.right), // toward (col, row-1)
  };
}

// --- ordered-dither tile sprites (browser) -----------------------------------------------

// Bayer 4x4 threshold matrix, values 0..15, for ordered dithering in index space (STUDY 2.2).
const BAYER4 = [
  [0, 8, 2, 10],
  [12, 4, 14, 6],
  [3, 11, 1, 9],
  [15, 7, 13, 5],
];

// Bake one TILE_W x TILE_H top-face diamond sprite for a terrain ramp, using ordered dither
// between the ramp's base and light steps (top of the tile lighter), a highlight along the
// upper edges and a shadow rim along the lower edges so the tile seats on the ground. Requires
// a document; called once at renderer init. `makeCanvas` is injected for testability.
function bakeTileSprite(rampKey, makeCanvas) {
  const ramp = RAMP[rampKey] || RAMP.grass;
  const cv = makeCanvas(TILE_SPRITE_W, TILE_SPRITE_H);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(TILE_SPRITE_W, TILE_SPRITE_H);
  const data = img.data;
  const cShadow = hexToRgb(ramp[SHADOW]);
  const cBase = hexToRgb(ramp[BASE]);
  const cLight = hexToRgb(ramp[LIGHT]);
  const cHigh = hexToRgb(ramp[HIGHLIGHT]);

  for (let py = 0; py < TILE_SPRITE_H; py++) {
    for (let px = 0; px < TILE_SPRITE_W; px++) {
      // Inside the diamond? Normalized Manhattan distance from center <= 1.
      const dx = Math.abs(px + 0.5 - HALF_W) / HALF_W;
      const dy = Math.abs(py + 0.5 - HALF_H) / HALF_H;
      const inside = dx + dy <= 1.0;
      const o = (py * TILE_SPRITE_W + px) * 4;
      if (!inside) { data[o + 3] = 0; continue; } // transparent outside the diamond

      const edge = dx + dy > 0.86; // near the rim
      const upper = py < HALF_H;
      let col;
      if (edge && upper) {
        col = cHigh; // lit upper rim
      } else if (edge && !upper) {
        col = cShadow; // shadowed lower rim seats the tile
      } else {
        // Ordered dither between base and light, biased lighter toward the top.
        const mix = Math.max(0, Math.min(1, (1 - py / TILE_SPRITE_H) * 0.7 + 0.15));
        const threshold = (BAYER4[py & 3][px & 3] + 0.5) / 16;
        col = mix > threshold ? cLight : cBase;
      }
      data[o] = col.r; data[o + 1] = col.g; data[o + 2] = col.b; data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

const TILE_SPRITE_W = HALF_W * 2; // 64
const TILE_SPRITE_H = HALF_H * 2; // 32

// Build the full sprite set (one per terrain ramp) for a browser renderer.
function buildTileSprites(makeCanvas) {
  const sprites = {};
  for (const key of Object.keys(RAMP)) sprites[key] = bakeTileSprite(key, makeCanvas);
  return sprites;
}

// --- the draw loop (browser: needs a real 2D context) ------------------------------------

// Draw the whole visible map. sprites is the object from buildTileSprites. `power` (optional) is
// the sim's power state; when a grid exists, unpowered built lots get a dim no-power mark.
function drawMap(ctx, map, camera, sprites, power = null, disaster = null) {
  const zoom = camera.zoom;
  ctx.imageSmoothingEnabled = false; // nearest-neighbor: pixels stay crisp at every zoom
  // The tiles at the leading edge of an active wrath get the live effect (flames, fresh growth,
  // the rift's glow); their permanent aftermath is carried by tile.scar below.
  const frontSet = disaster && disaster.front ? new Set(disaster.front) : null;

  // Sky/void behind the map: fog grey.
  ctx.fillStyle = '#20242a';
  ctx.fillRect(0, 0, camera.viewportW, camera.viewportH);

  const view = camera.visibleWorldRect();
  // Pad generously downward: raised tiles from further rows can intrude into view from below.
  const range = visibleTileRange(
    view.left, view.top - ELEV_STEP * (6 + 2),
    view.right, view.bottom,
    map.cols, map.rows, 2,
  );

  // Collect visible tiles and sort back-to-front.
  const order = [];
  for (let row = range.minRow; row <= range.maxRow; row++) {
    for (let col = range.minCol; col <= range.maxCol; col++) {
      order.push({ col, row });
    }
  }
  order.sort(drawOrder);

  const spriteW = TILE_SPRITE_W * zoom;
  const spriteH = TILE_SPRITE_H * zoom;

  for (const { col, row } of order) {
    const tile = map.tiles[map.index(col, row)];
    const faces = tileScreenFaces(col, row, tile.elevation, camera);

    // Wall bands under raised terrain (solid ramp steps, light from the upper right).
    if (faces.wallH > 0) {
      const ramp = RAMP[terrainRamp(tile.terrain)];
      fillPoly(ctx, faces.leftWall, ramp[SHADOW]); // shadowed side
      fillPoly(ctx, faces.rightWall, ramp[BASE]); // lit side
    }

    // Top face: blit the pre-dithered sprite, its top-left at the diamond's bounding box.
    const sprite = sprites[terrainRamp(tile.terrain)];
    ctx.drawImage(sprite, faces.left.x, faces.top.y, spriteW, spriteH);

    // Overlays, back-to-front on the top face. A developed lot shows its building (which hides
    // the zone marker); an empty lot shows its zone marking. A placed civic structure sits on the
    // land directly.
    if (tile.structure) drawStructure(ctx, faces, tile.structure, zoom);
    else if (tile.building) drawBuilding(ctx, faces, tile.building, tile.zone, zoom);
    else if (tile.zone) drawZone(ctx, faces, tile.zone, zoom);
    if (tile.object && tile.object.kind === 'road') drawRoad(ctx, faces, tile.object.mask | 0, zoom);
    if (tile.object && tile.object.kind === 'powerline') drawPowerline(ctx, faces, tile.object.mask | 0, zoom);

    // No-power mark: a built lot cut off from a working grid, once any generator exists.
    if (power && power.totals && power.totals.capacity > 0 && tile.building
        && !power.energized.has(map.index(col, row))) {
      drawNoPower(ctx, faces, zoom);
    }

    // Disaster aftermath (permanent) then the live wrath effect on the leading edge.
    if (tile.scar) drawScar(ctx, faces, tile.scar, zoom, col, row);
    if (frontSet && frontSet.has(map.index(col, row))) {
      drawWrathFront(ctx, faces, disaster.kind, zoom, col, row);
    }
  }

  // Damp 1920s atmosphere (M7): a faint cold wash and a vignette pull the read toward overcast
  // coastal dread, without hiding the ground. Drawn over the map, under the chrome that follows.
  drawAtmosphere(ctx, camera);
}

// A cold fog wash plus an edge vignette. Cheap, and it does most of the mood work that the palette
// retune leaves on the table.
function drawAtmosphere(ctx, camera) {
  const w = camera.viewportW;
  const h = camera.viewportH;
  ctx.fillStyle = 'rgba(38, 50, 58, 0.12)';
  ctx.fillRect(0, 0, w, h);
  if (typeof ctx.createRadialGradient === 'function') {
    const g = ctx.createRadialGradient(w / 2, h * 0.46, Math.min(w, h) * 0.24, w / 2, h * 0.5, Math.max(w, h) * 0.72);
    g.addColorStop(0, 'rgba(0, 0, 0, 0)');
    g.addColorStop(1, 'rgba(9, 13, 19, 0.42)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
}

// The wall ramp, roof ramp, lit-window colour and any feature for a lot's building, by zone and
// resident class. Sea-rotted clapboard for the Unwary; brine-green for Deep Ones; a pale sigil
// for Cultists; a smokestack for industry (STUDY 2.2 materials).
function buildingStyle(zone, cls) {
  if (zone === 'industrial') return { wall: 'rock', roof: 'slate', win: '#8a7a3a', feature: 'stack' };
  if (zone === 'commercial') return { wall: 'clapboard', roof: 'slate', win: '#e0b64c', feature: 'shopfront' };
  // residential varies by class
  if (cls === 'deepone') return { wall: 'shallow', roof: 'slate', win: '#6a9c8b', feature: 'none' };
  if (cls === 'cultist') return { wall: 'clapboard', roof: 'slate', win: '#b8892f', feature: 'sigil' };
  return { wall: 'clapboard', roof: 'slate', win: '#e0b64c', feature: 'none' }; // Unwary
}

const LEVEL_HEIGHT = [0, 1.1, 2.1, 3.2]; // building height in elevation units per tier

// Draw a dimetric building: two lit/shadowed clapboard walls rising from the lot, a slate roof
// with a gable ridge, rows of lamplit windows, and a per-type feature. Reads as a small 1920s
// structure, not a box.
function drawBuilding(ctx, faces, building, zone, zoom) {
  const style = buildingStyle(zone, building.cls);
  const wall = RAMP[style.wall];
  const roof = RAMP[style.roof];
  const H = (LEVEL_HEIGHT[building.level] || 1.1) * ELEV_STEP * zoom;

  const L = faces.left; const B = faces.bottom; const R = faces.right; const T = faces.top;
  const up = (p) => ({ x: p.x, y: p.y - H });
  const Lr = up(L); const Br = up(B); const Rr = up(R); const Tr = up(T);

  // Front walls (light from the upper right: right face lit, left face shadowed).
  fillPoly(ctx, [L, B, Br, Lr], wall[SHADOW]); // left face
  fillPoly(ctx, [B, R, Rr, Br], wall[BASE]); // right face
  // Wall edge seams for a clapboard read.
  strokePoly(ctx, [Lr, Br, Rr], wall[LIGHT], Math.max(1, zoom * 0.75));

  // Windows: a grid on each visible wall, brighter on the lit face.
  const rows = building.level + 1;
  const cols = 2;
  drawWindows(ctx, [Lr, Br, B, L], cols, rows, style.win, zoom, 0.55);
  drawWindows(ctx, [Br, Rr, R, B], cols, rows, style.win, zoom, 1.0);

  // Roof: raised top diamond, slate, with a gable ridge and a lit edge.
  fillPoly(ctx, [Tr, Rr, Br, Lr], roof[LIGHT]);
  fillPoly(ctx, [Tr, Rr, Br], roof[BASE]); // right roof slope a touch darker
  strokeLine(ctx, Tr, Br, roof[SHADOW], Math.max(1, zoom * 0.75)); // ridge
  strokePoly(ctx, [Lr, Tr, Rr], roof[HIGHLIGHT], Math.max(1, zoom * 0.6)); // sunlit eaves

  // Per-type feature.
  if (style.feature === 'stack') {
    const sx = Tr.x + (Rr.x - Tr.x) * 0.35;
    const sy = Tr.y + (Rr.y - Tr.y) * 0.35;
    ctx.fillStyle = RAMP.rock[SHADOW];
    ctx.fillRect(sx - 2 * zoom, sy - 10 * zoom, 4 * zoom, 12 * zoom);
  } else if (style.feature === 'sigil') {
    // A pale mark over the door on the lit face.
    const c = { x: (Br.x + R.x + B.x + Rr.x) / 4, y: (Br.y + R.y + B.y + Rr.y) / 4 };
    ctx.strokeStyle = '#c9c2a8';
    ctx.lineWidth = Math.max(1, zoom * 0.6);
    ctx.beginPath();
    ctx.arc(c.x, c.y - 2 * zoom, 3 * zoom, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// Bilinear point in a quad [p00, p10, p11, p01] at parameters (u across, v down).
function quadPoint(q, u, v) {
  const top = { x: q[0].x + (q[1].x - q[0].x) * u, y: q[0].y + (q[1].y - q[0].y) * u };
  const bot = { x: q[3].x + (q[2].x - q[3].x) * u, y: q[3].y + (q[2].y - q[3].y) * u };
  return { x: top.x + (bot.x - top.x) * v, y: top.y + (bot.y - top.y) * v };
}

// A grid of small lit windows on a wall quad [topLeft, topRight, botRight, botLeft].
function drawWindows(ctx, quad, cols, rows, color, zoom, brightness) {
  ctx.fillStyle = color;
  ctx.globalAlpha = Math.max(0.35, Math.min(1, brightness));
  const wpad = 0.22;
  const hpad = 0.18;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const u = wpad + (c + 0.5) * (1 - 2 * wpad) / cols;
      const v = hpad + (r + 0.5) * (1 - 2 * hpad) / rows;
      const p = quadPoint(quad, u, v);
      const s = 1.6 * zoom;
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s * 1.3);
    }
  }
  ctx.globalAlpha = 1;
}

function strokePoly(ctx, pts, color, w) {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

function strokeLine(ctx, a, b, color, w) {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}

// Wall / roof ramps per structure kind. Sea-rotted materials from the one palette (STUDY 2.2):
// iron-grey works, weathered clapboard civic halls, cold slate, and the shrine's black stone.
const STRUCT_STYLE = {
  gasworks: { wall: 'rock', roof: 'rock', H: 1.7 },
  whaleoil: { wall: 'clapboard', roof: 'slate', H: 1.9 },
  constabulary: { wall: 'clapboard', roof: 'slate', H: 1.9 },
  asylum: { wall: 'rock', roof: 'slate', H: 2.3 },
  chapel: { wall: 'clapboard', roof: 'slate', H: 1.8 },
  shrine: { wall: 'slate', roof: 'slate', H: 1.1 },
  university: { wall: 'rock', roof: 'slate', H: 2.0 },
};

// Draw a placed civic structure as a real dimetric building with a distinctive silhouette: the
// gasholder drum, the rendering-works chimney, the watch-house blue lamp, the asylum cupola, the
// chapel steeple, the cult shrine's black monolith. Reuses the building light model (right face
// lit, left face shadowed) so it seats with the rest of the town.
function drawStructure(ctx, faces, structure, zoom) {
  const kind = structure.kind;
  const style = STRUCT_STYLE[kind] || STRUCT_STYLE.gasworks;

  // The gasworks is a cylindrical gasholder and the shrine is a standing monolith, not boxy
  // halls: draw each apart from the civic-building base.
  if (kind === 'gasworks') { drawGasholder(ctx, faces, zoom); return; }
  if (kind === 'shrine') { drawShrine(ctx, faces, zoom); return; }

  const wall = RAMP[style.wall];
  const roof = RAMP[style.roof];
  const H = style.H * ELEV_STEP * zoom;
  const L = faces.left; const B = faces.bottom; const R = faces.right; const T = faces.top;
  const up = (p, h = H) => ({ x: p.x, y: p.y - h });
  const Lr = up(L); const Br = up(B); const Rr = up(R); const Tr = up(T);

  // Front walls.
  fillPoly(ctx, [L, B, Br, Lr], wall[SHADOW]); // left face (shadowed)
  fillPoly(ctx, [B, R, Rr, Br], wall[BASE]); // right face (lit)
  strokePoly(ctx, [Lr, Br, Rr], wall[LIGHT], Math.max(1, zoom * 0.7));

  // Roof: the raised top diamond in slate with a gable ridge and a sunlit eave.
  fillPoly(ctx, [Tr, Rr, Br, Lr], roof[LIGHT]);
  fillPoly(ctx, [Tr, Rr, Br], roof[BASE]);
  strokeLine(ctx, Tr, Br, roof[SHADOW], Math.max(1, zoom * 0.7));
  strokePoly(ctx, [Lr, Tr, Rr], roof[HIGHLIGHT], Math.max(1, zoom * 0.55));

  const center = { x: (Lr.x + Rr.x) / 2, y: (Tr.y + Br.y) / 2 };

  if (kind === 'whaleoil') {
    // Barred windows on the works, a squat oil tank, and a tall smoking chimney.
    drawWindows(ctx, [Br, Rr, R, B], 3, 2, '#5a3f28', zoom, 0.9);
    // Oil tank (a small dark drum) on the left roof.
    const tk = { x: Tr.x + (Lr.x - Tr.x) * 0.5, y: Tr.y + (Lr.y - Tr.y) * 0.5 - 2 * zoom };
    fillEllipse(ctx, tk, 4 * zoom, 2 * zoom, RAMP.rock[SHADOW]);
    fillRectUp(ctx, tk, 4 * zoom, 5 * zoom, RAMP.rock[BASE]);
    fillEllipse(ctx, { x: tk.x, y: tk.y - 5 * zoom }, 4 * zoom, 2 * zoom, RAMP.rock[LIGHT]);
    // Chimney rising from the right roof, with a plume.
    const ch = { x: Tr.x + (Rr.x - Tr.x) * 0.55, y: Tr.y + (Rr.y - Tr.y) * 0.55 };
    ctx.fillStyle = RAMP.rock[BASE];
    ctx.fillRect(ch.x - 2 * zoom, ch.y - 18 * zoom, 4 * zoom, 18 * zoom);
    ctx.fillStyle = RAMP.rock[SHADOW];
    ctx.fillRect(ch.x - 2 * zoom, ch.y - 18 * zoom, 1.4 * zoom, 18 * zoom);
    drawSmoke(ctx, { x: ch.x, y: ch.y - 18 * zoom }, zoom);
  } else if (kind === 'constabulary') {
    drawWindows(ctx, [Lr, Br, B, L], 2, 2, '#8a7a3a', zoom, 0.55);
    drawWindows(ctx, [Br, Rr, R, B], 2, 2, '#c9a94a', zoom, 1.0);
    // The blue watch lamp over the door on the lit face.
    const d = { x: (Br.x + R.x) / 2, y: (Br.y + R.y) / 2 - 3 * zoom };
    ctx.fillStyle = '#2f5fa0';
    ctx.beginPath();
    ctx.arc(d.x, d.y, Math.max(1.4, 2.2 * zoom), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8fb6e0'; ctx.lineWidth = Math.max(1, 0.6 * zoom); ctx.stroke();
  } else if (kind === 'asylum') {
    // Rows of barred institutional windows and a prominent central cupola with a pale dome, the
    // signature that sets the sanitarium apart from the town's other dark halls.
    drawBarredWindows(ctx, [Lr, Br, B, L], 3, 2, zoom, 0.55);
    drawBarredWindows(ctx, [Br, Rr, R, B], 3, 2, zoom, 0.9);
    const cup = { x: center.x, y: center.y - 4 * zoom };
    // A short drum, lit and shadowed like the walls.
    ctx.fillStyle = RAMP.rock[SHADOW];
    ctx.fillRect(cup.x - 5 * zoom, cup.y - 7 * zoom, 5 * zoom, 8 * zoom);
    ctx.fillStyle = RAMP.rock[LIGHT];
    ctx.fillRect(cup.x, cup.y - 7 * zoom, 5 * zoom, 8 * zoom);
    ctx.strokeStyle = '#2a2823'; ctx.lineWidth = Math.max(1, 0.5 * zoom);
    ctx.strokeRect(cup.x - 5 * zoom, cup.y - 7 * zoom, 10 * zoom, 8 * zoom);
    // The pale dome.
    fillEllipse(ctx, { x: cup.x, y: cup.y - 7 * zoom }, 6 * zoom, 3 * zoom, '#b9b4a4');
    ctx.fillStyle = '#8f8a7c';
    ctx.beginPath();
    if (ctx.ellipse) ctx.ellipse(cup.x, cup.y - 7 * zoom, 6 * zoom, 3 * zoom, 0, Math.PI, Math.PI * 2);
    else ctx.arc(cup.x, cup.y - 7 * zoom, 6 * zoom, 0, Math.PI);
    ctx.fill();
    // A little finial spike.
    ctx.fillStyle = '#2a2823';
    ctx.fillRect(cup.x - 0.6 * zoom, cup.y - 12 * zoom, 1.2 * zoom, 3 * zoom);
  } else if (kind === 'chapel') {
    drawWindows(ctx, [Lr, Br, B, L], 1, 2, '#b89a4a', zoom, 0.55);
    drawWindows(ctx, [Br, Rr, R, B], 1, 2, '#e0b64c', zoom, 1.0);
    // The steeple: a tall spire over the front gable, with a finial.
    const base = { x: Tr.x + (Br.x - Tr.x) * 0.28, y: Tr.y + (Br.y - Tr.y) * 0.28 };
    const spireH = 20 * zoom;
    const apex = { x: base.x, y: base.y - spireH };
    // Tower.
    fillRectUp(ctx, base, 4 * zoom, 8 * zoom, RAMP.clapboard[BASE]);
    ctx.fillStyle = RAMP.clapboard[SHADOW];
    ctx.fillRect(base.x - 2 * zoom, base.y - 8 * zoom, 1.4 * zoom, 8 * zoom);
    // Spire.
    ctx.fillStyle = RAMP.slate[BASE];
    ctx.beginPath();
    ctx.moveTo(base.x - 3 * zoom, base.y - 8 * zoom);
    ctx.lineTo(apex.x, apex.y);
    ctx.lineTo(base.x + 3 * zoom, base.y - 8 * zoom);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = RAMP.slate[HIGHLIGHT]; ctx.lineWidth = Math.max(1, 0.6 * zoom);
    ctx.beginPath(); ctx.moveTo(base.x + 3 * zoom, base.y - 8 * zoom); ctx.lineTo(apex.x, apex.y); ctx.stroke();
    // Finial.
    ctx.fillStyle = '#c9c2a8';
    ctx.fillRect(apex.x - 0.8 * zoom, apex.y - 3 * zoom, 1.6 * zoom, 3 * zoom);
  } else if (kind === 'university') {
    // A stone college hall: ranks of tall lit windows, a square battlemented tower with a lit
    // clock, and the Containment Wing marked by a cold violet lamp holding the Rift at bay.
    drawWindows(ctx, [Lr, Br, B, L], 3, 2, '#8a7a3a', zoom, 0.55);
    drawWindows(ctx, [Br, Rr, R, B], 3, 2, '#d8b45a', zoom, 1.0);
    // The battlemented tower over the left of the roof.
    const tw = { x: Tr.x + (Lr.x - Tr.x) * 0.42, y: Tr.y + (Lr.y - Tr.y) * 0.42 };
    const towH = 13 * zoom;
    ctx.fillStyle = RAMP.rock[BASE];
    ctx.fillRect(tw.x - 4.5 * zoom, tw.y - towH, 9 * zoom, towH);
    ctx.fillStyle = RAMP.rock[SHADOW];
    ctx.fillRect(tw.x - 4.5 * zoom, tw.y - towH, 3 * zoom, towH); // shadowed left
    ctx.strokeStyle = '#2a2823'; ctx.lineWidth = Math.max(1, 0.5 * zoom);
    ctx.strokeRect(tw.x - 4.5 * zoom, tw.y - towH, 9 * zoom, towH);
    // Crenellations along the tower top.
    ctx.fillStyle = RAMP.rock[LIGHT];
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(tw.x - 4.5 * zoom + i * 3.2 * zoom, tw.y - towH - 2 * zoom, 2 * zoom, 2 * zoom);
    }
    // The lit clock face.
    ctx.fillStyle = '#e6d9a8';
    ctx.beginPath(); ctx.arc(tw.x, tw.y - towH * 0.55, 2.4 * zoom, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a2823'; ctx.beginPath();
    ctx.moveTo(tw.x, tw.y - towH * 0.55); ctx.lineTo(tw.x + 1.4 * zoom, tw.y - towH * 0.55 - 0.6 * zoom);
    ctx.moveTo(tw.x, tw.y - towH * 0.55); ctx.lineTo(tw.x, tw.y - towH * 0.55 - 1.8 * zoom); ctx.stroke();
    // The Containment Wing lamp: a cold violet glow on the right roof (the Yog-Sothoth hold).
    const cw = { x: Tr.x + (Rr.x - Tr.x) * 0.6, y: Tr.y + (Rr.y - Tr.y) * 0.6 - 2 * zoom };
    ctx.save();
    ctx.globalAlpha = 0.45; fillEllipse(ctx, cw, 4 * zoom, 4 * zoom, '#7a5aa8'); ctx.globalAlpha = 1;
    fillEllipse(ctx, cw, 1.8 * zoom, 1.8 * zoom, '#c3a8e0');
    ctx.restore();
  }
}

// The cult shrine: not a hall but a ring of rough dark stones about a tall black monolith, canted
// wrong, crowned with a cold green witch-light. Reads at a glance as the town's sinister note.
function drawShrine(ctx, faces, zoom) {
  const c = faces.center;
  // A low earthen plinth so the stones seat on the ground.
  fillDiamond(ctx, c, faces.hw * 0.62, faces.hh * 0.62, RAMP.dirt[SHADOW]);
  fillDiamond(ctx, c, faces.hw * 0.5, faces.hh * 0.5, '#2b2c30');

  // Two low flanking standing stones.
  const stone = (sx, sy, w, h) => {
    ctx.fillStyle = RAMP.slate[SHADOW];
    ctx.beginPath();
    ctx.moveTo(sx - w, sy);
    ctx.lineTo(sx + w, sy);
    ctx.lineTo(sx + w * 0.7, sy - h);
    ctx.lineTo(sx - w * 0.7, sy - h);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#4d6b60'; ctx.lineWidth = Math.max(1, 0.5 * zoom);
    ctx.beginPath(); ctx.moveTo(sx + w, sy); ctx.lineTo(sx + w * 0.7, sy - h); ctx.stroke();
  };
  stone(c.x - faces.hw * 0.42, c.y + faces.hh * 0.18, 2.4 * zoom, 8 * zoom);
  stone(c.x + faces.hw * 0.42, c.y + faces.hh * 0.18, 2.4 * zoom, 8 * zoom);

  // The central monolith: a broad black slab, leaning, tall enough to read as cyclopean.
  const base = { x: c.x, y: c.y + 3 * zoom };
  const monoH = 22 * zoom;
  const lean = 2.5 * zoom;
  const top = { x: base.x + lean, y: base.y - monoH };
  const bw = 5.5 * zoom;
  const tw = 4.2 * zoom;
  // Shadowed left face.
  ctx.fillStyle = '#17181c';
  ctx.beginPath();
  ctx.moveTo(base.x - bw, base.y);
  ctx.lineTo(base.x, base.y + 1.5 * zoom);
  ctx.lineTo(top.x, top.y + 1.5 * zoom);
  ctx.lineTo(top.x - tw, top.y);
  ctx.closePath();
  ctx.fill();
  // Lit right face (a hair greener, sea-rotted stone).
  ctx.fillStyle = '#26302c';
  ctx.beginPath();
  ctx.moveTo(base.x + bw, base.y);
  ctx.lineTo(base.x, base.y + 1.5 * zoom);
  ctx.lineTo(top.x, top.y + 1.5 * zoom);
  ctx.lineTo(top.x + tw, top.y);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#3a4a44'; ctx.lineWidth = Math.max(1, 0.6 * zoom);
  ctx.beginPath(); ctx.moveTo(base.x, base.y + 1.5 * zoom); ctx.lineTo(top.x, top.y + 1.5 * zoom); ctx.stroke();

  // The cold witch-light crown: a soft glow plus a bright core.
  ctx.save();
  ctx.globalAlpha = 0.5;
  fillEllipse(ctx, top, 5 * zoom, 5 * zoom, '#4a8f78');
  ctx.globalAlpha = 1;
  fillEllipse(ctx, top, 2.2 * zoom, 2.2 * zoom, '#8fdcc2');
  ctx.restore();
}

// A cylindrical gasholder drum with iron lattice bands, seated on the lot.
function drawGasholder(ctx, faces, zoom) {
  const c = faces.center;
  const rx = faces.hw * 0.72;
  const ry = faces.hh * 0.72;
  const H = 20 * zoom;
  const iron = RAMP.rock;
  // Bottom ellipse (shadow), side band, top ellipse (lit).
  fillEllipse(ctx, c, rx, ry, iron[SHADOW]);
  // Side wall as a quad between the two ellipses.
  ctx.fillStyle = iron[BASE];
  ctx.beginPath();
  ctx.moveTo(c.x - rx, c.y);
  ctx.lineTo(c.x - rx, c.y - H);
  ctx.lineTo(c.x + rx, c.y - H);
  ctx.lineTo(c.x + rx, c.y);
  ctx.closePath();
  ctx.fill();
  // A shaded left third for cylinder roundness.
  ctx.fillStyle = iron[SHADOW];
  ctx.beginPath();
  ctx.moveTo(c.x - rx, c.y);
  ctx.lineTo(c.x - rx, c.y - H);
  ctx.lineTo(c.x - rx * 0.3, c.y - H);
  ctx.lineTo(c.x - rx * 0.3, c.y);
  ctx.closePath();
  ctx.fill();
  // Iron lattice bands.
  ctx.strokeStyle = iron[HIGHLIGHT]; ctx.lineWidth = Math.max(1, 0.6 * zoom);
  for (const f of [0.15, 0.5, 0.85]) {
    const y = c.y - H * f;
    ctx.beginPath();
    ctx.ellipse ? ctx.ellipse(c.x, y, rx, ry * 0.5, 0, 0, Math.PI, false)
      : ctx.arc(c.x, y, rx, 0, Math.PI, false);
    ctx.stroke();
  }
  // Top drum.
  fillEllipse(ctx, { x: c.x, y: c.y - H }, rx, ry, iron[LIGHT]);
  ctx.strokeStyle = iron[HIGHLIGHT]; ctx.lineWidth = Math.max(1, 0.7 * zoom);
  ctx.beginPath();
  if (ctx.ellipse) ctx.ellipse(c.x, c.y - H, rx, ry, 0, 0, Math.PI * 2);
  else ctx.arc(c.x, c.y - H, rx, 0, Math.PI * 2);
  ctx.stroke();
}

// A grid of barred windows (a lit pane crossed by two dark bars) on a wall quad.
function drawBarredWindows(ctx, quad, cols, rows, zoom, brightness) {
  const wpad = 0.2;
  const hpad = 0.16;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const u = wpad + (c + 0.5) * (1 - 2 * wpad) / cols;
      const v = hpad + (r + 0.5) * (1 - 2 * hpad) / rows;
      const p = quadPoint(quad, u, v);
      const s = 2.0 * zoom;
      ctx.globalAlpha = Math.max(0.4, brightness);
      ctx.fillStyle = '#7a6a34';
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s * 1.2);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = RAMP.rock[SHADOW]; ctx.lineWidth = Math.max(0.6, 0.4 * zoom);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - s / 2); ctx.lineTo(p.x, p.y + s * 0.7);
      ctx.moveTo(p.x - s / 2, p.y); ctx.lineTo(p.x + s / 2, p.y);
      ctx.stroke();
    }
  }
}

function drawSmoke(ctx, top, zoom) {
  ctx.fillStyle = 'rgba(120,120,120,0.5)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(top.x + i * 1.5 * zoom, top.y - i * 4 * zoom, (2 + i) * zoom, 0, Math.PI * 2);
    ctx.fill();
  }
}

// A small vertical box (footprint centred at c, rising h) for cupolas, towers, tanks.
function fillRectUp(ctx, c, halfW, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(c.x - halfW, c.y - h, halfW * 2, h);
}

function fillEllipse(ctx, c, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  if (ctx.ellipse) ctx.ellipse(c.x, c.y, rx, ry, 0, 0, Math.PI * 2);
  else ctx.arc(c.x, c.y, rx, 0, Math.PI * 2);
  ctx.fill();
}

// --- disaster art (M6) -------------------------------------------------------------------

// A cheap deterministic hash in [0,1) from a tile's coordinates, so each scarred/burning lot
// varies without any RNG state (the render must stay pure and repaint-stable).
function tileHash(col, row, salt = 0) {
  let h = (col * 374761393 + row * 668265263 + salt * 2246822519) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h >>> 8) / 0x1000000;
}

// What a wrath leaves behind, drawn on the top face of a razed lot.
function drawScar(ctx, faces, scar, zoom, col, row) {
  if (scar.kind === 'burnt') drawBurnt(ctx, faces, zoom, col, row);
  else if (scar.kind === 'overgrown') drawOvergrown(ctx, faces, zoom, col, row);
  else if (scar.kind === 'rubble') drawRubble(ctx, faces, zoom, col, row);
  else if (scar.kind === 'flooded') drawFloodFoam(ctx, faces, zoom, col, row);
}

// Scorched earth: a blackened diamond with a few charred stubs.
function drawBurnt(ctx, faces, zoom, col, row) {
  const c = faces.center;
  ctx.save();
  ctx.globalAlpha = 0.82;
  fillDiamond(ctx, c, faces.hw * 0.9, faces.hh * 0.9, '#1c1712');
  ctx.globalAlpha = 1;
  // Grey ash flecks and charred posts.
  for (let i = 0; i < 4; i++) {
    const a = tileHash(col, row, i) * Math.PI * 2;
    const rr = tileHash(row, col, i) * faces.hw * 0.55;
    const px = c.x + Math.cos(a) * rr;
    const py = c.y + Math.sin(a) * rr * 0.5;
    ctx.fillStyle = i % 2 ? '#3a332b' : '#0f0d0a';
    ctx.fillRect(px - 1 * zoom, py - 2.5 * zoom, 1.6 * zoom, 3 * zoom);
  }
  ctx.restore();
}

// Rank growth: sickly bright-green clumps and tendrils choking the lot.
function drawOvergrown(ctx, faces, zoom, col, row) {
  const c = faces.center;
  ctx.save();
  ctx.globalAlpha = 0.9;
  fillDiamond(ctx, c, faces.hw * 0.92, faces.hh * 0.92, '#2f5a24');
  ctx.globalAlpha = 1;
  const greens = ['#3f6b28', '#5c8a2f', '#7dae3c', '#9ac24a'];
  for (let i = 0; i < 6; i++) {
    const a = tileHash(col, row, i + 3) * Math.PI * 2;
    const rr = tileHash(row + 1, col, i) * faces.hw * 0.6;
    const px = c.x + Math.cos(a) * rr;
    const py = c.y + Math.sin(a) * rr * 0.5;
    const h = (3 + tileHash(col, row + 2, i) * 6) * zoom;
    ctx.strokeStyle = greens[i % greens.length];
    ctx.lineWidth = Math.max(1, 1.4 * zoom);
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.quadraticCurveTo(px + (i % 2 ? 2 : -2) * zoom, py - h * 0.6, px + (i % 2 ? 1 : -1) * zoom, py - h);
    ctx.stroke();
    ctx.fillStyle = greens[(i + 2) % greens.length];
    ctx.beginPath(); ctx.arc(px + (i % 2 ? 1 : -1) * zoom, py - h, 1.6 * zoom, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// Collapsed masonry: a low heap of broken grey blocks.
function drawRubble(ctx, faces, zoom, col, row) {
  const c = faces.center;
  fillDiamond(ctx, c, faces.hw * 0.7, faces.hh * 0.7, RAMP.rock[SHADOW]);
  const blocks = ['#565963', '#6f7480', '#3f4148', '#8b909d'];
  for (let i = 0; i < 5; i++) {
    const bx = c.x + (tileHash(col, row, i) - 0.5) * faces.hw * 1.0;
    const by = c.y + (tileHash(row, col, i + 1) - 0.5) * faces.hh * 0.9;
    const s = (2 + tileHash(col + 1, row, i) * 2.5) * zoom;
    ctx.fillStyle = blocks[i % blocks.length];
    ctx.fillRect(bx - s / 2, by - s / 2, s, s * 0.8);
    ctx.strokeStyle = '#22242a'; ctx.lineWidth = Math.max(1, 0.4 * zoom);
    ctx.strokeRect(bx - s / 2, by - s / 2, s, s * 0.8);
  }
}

// White foam churning over a freshly drowned lot (it now reads as sea, but troubled sea).
function drawFloodFoam(ctx, faces, zoom, col, row) {
  const c = faces.center;
  ctx.save();
  ctx.globalAlpha = 0.5;
  fillDiamond(ctx, c, faces.hw * 0.9, faces.hh * 0.9, '#2a4a4a');
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#cfe6df';
  for (let i = 0; i < 5; i++) {
    const px = c.x + (tileHash(col, row, i) - 0.5) * faces.hw * 1.3;
    const py = c.y + (tileHash(row, col, i + 2) - 0.5) * faces.hh * 1.3;
    ctx.beginPath(); ctx.arc(px, py, (0.8 + tileHash(col, row, i + 5)) * zoom, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// The live leading edge of a wrath, drawn over the scar it just laid.
function drawWrathFront(ctx, faces, kind, zoom, col, row) {
  if (kind === 'burning') drawFlames(ctx, faces, zoom, col, row);
  else if (kind === 'greening') drawGreenBloom(ctx, faces, zoom, col, row);
  else if (kind === 'rift') drawRiftGlow(ctx, faces, zoom, col, row);
  else if (kind === 'flood') drawFloodChurn(ctx, faces, zoom, col, row);
  else if (kind === 'awakening') drawQuake(ctx, faces, zoom, col, row);
}

// Tongues of fire rising from a burning lot: a soft glow, then stacked red/orange/gold flames.
function drawFlames(ctx, faces, zoom, col, row) {
  const c = { x: faces.center.x, y: faces.center.y - 2 * zoom };
  ctx.save();
  ctx.globalAlpha = 0.4;
  fillEllipse(ctx, c, 8 * zoom, 5 * zoom, '#b8532a');
  ctx.globalAlpha = 1;
  const tongues = [
    { col: '#7a1e12', h: 10, w: 5, dx: 0 },
    { col: '#c8461c', h: 14, w: 4, dx: -2.5 },
    { col: '#e8802a', h: 12, w: 3.5, dx: 2.5 },
    { col: '#f4c34a', h: 8, w: 2.2, dx: 0 },
  ];
  for (const t of tongues) {
    const jitter = (tileHash(col, row, t.h) - 0.5) * 2 * zoom;
    const bx = c.x + t.dx * zoom + jitter;
    const by = c.y + 3 * zoom;
    const h = t.h * zoom * (0.85 + tileHash(row, col, t.w) * 0.3);
    ctx.fillStyle = t.col;
    ctx.beginPath();
    ctx.moveTo(bx - t.w * zoom, by);
    ctx.quadraticCurveTo(bx - t.w * 0.5 * zoom, by - h * 0.6, bx, by - h);
    ctx.quadraticCurveTo(bx + t.w * 0.5 * zoom, by - h * 0.6, bx + t.w * zoom, by);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// The advancing edge of the Greening: a taller, brighter burst of growth.
function drawGreenBloom(ctx, faces, zoom, col, row) {
  const c = faces.center;
  ctx.save();
  ctx.globalAlpha = 0.35;
  fillEllipse(ctx, { x: c.x, y: c.y - 3 * zoom }, 7 * zoom, 5 * zoom, '#7dae3c');
  ctx.globalAlpha = 1;
  for (let i = 0; i < 5; i++) {
    const bx = c.x + (tileHash(col, row, i + 7) - 0.5) * faces.hw * 0.9;
    const by = c.y + 2 * zoom;
    const h = (7 + tileHash(row, col, i) * 7) * zoom;
    ctx.strokeStyle = i % 2 ? '#9ac24a' : '#6c9a30';
    ctx.lineWidth = Math.max(1.2, 1.8 * zoom);
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx + (i % 2 ? 3 : -3) * zoom, by - h * 0.6, bx + (i % 2 ? 1.5 : -1.5) * zoom, by - h);
    ctx.stroke();
    ctx.fillStyle = '#c3e07a';
    ctx.beginPath(); ctx.arc(bx + (i % 2 ? 1.5 : -1.5) * zoom, by - h, 2 * zoom, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// The Rift: a jagged violet tear hanging over the lot, glowing wrong.
function drawRiftGlow(ctx, faces, zoom, col, row) {
  const c = { x: faces.center.x, y: faces.center.y - 4 * zoom };
  ctx.save();
  ctx.globalAlpha = 0.4;
  fillEllipse(ctx, c, 9 * zoom, 7 * zoom, '#4a2a7a');
  ctx.globalAlpha = 1;
  // A vertical jagged slit.
  const h = 12 * zoom;
  ctx.fillStyle = '#1a0f2e';
  ctx.beginPath();
  ctx.moveTo(c.x, c.y - h / 2);
  ctx.lineTo(c.x + 2.5 * zoom, c.y - h * 0.15);
  ctx.lineTo(c.x + 1 * zoom, c.y + h / 2);
  ctx.lineTo(c.x - 2.5 * zoom, c.y + h * 0.2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#b98fe0'; ctx.lineWidth = Math.max(1, 0.9 * zoom); ctx.stroke();
  // Cold sparks along the tear.
  ctx.fillStyle = '#d9c3f2';
  for (let i = 0; i < 3; i++) {
    const py = c.y - h / 2 + tileHash(col, row, i) * h;
    ctx.fillRect(c.x - 0.6 * zoom, py, 1.2 * zoom, 1.2 * zoom);
  }
  ctx.restore();
}

// The churning tide over a lot the flood is taking this moment.
function drawFloodChurn(ctx, faces, zoom, col, row) {
  const c = faces.center;
  ctx.save();
  ctx.globalAlpha = 0.6;
  fillDiamond(ctx, c, faces.hw * 0.95, faces.hh * 0.95, '#1f3f44');
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = '#dff0ea'; ctx.lineWidth = Math.max(1, 1.1 * zoom);
  for (let i = 0; i < 3; i++) {
    const yy = c.y + (tileHash(col, row, i) - 0.5) * faces.hh * 1.1;
    ctx.beginPath();
    ctx.moveTo(c.x - faces.hw * 0.6, yy);
    ctx.quadraticCurveTo(c.x, yy - 2 * zoom, c.x + faces.hw * 0.6, yy);
    ctx.stroke();
  }
  ctx.restore();
}

// The earthquake edge: a puff of dust and radiating ground cracks.
function drawQuake(ctx, faces, zoom, col, row) {
  const c = faces.center;
  ctx.save();
  ctx.strokeStyle = '#1a1712'; ctx.lineWidth = Math.max(1, 0.8 * zoom);
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + tileHash(col, row, i);
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x + Math.cos(a) * faces.hw * 0.7, c.y + Math.sin(a) * faces.hh * 0.7);
    ctx.stroke();
  }
  ctx.globalAlpha = 0.35;
  fillEllipse(ctx, { x: c.x, y: c.y - 4 * zoom }, 7 * zoom, 4 * zoom, '#8a8478');
  ctx.restore();
}

// The no-power mark: a small dim lightning bolt in a slashed disc over a cut-off lot.
function drawNoPower(ctx, faces, zoom) {
  const c = { x: faces.center.x, y: faces.top.y - 4 * zoom };
  const s = Math.max(4, 5 * zoom);
  ctx.fillStyle = 'rgba(20,22,26,0.72)';
  ctx.beginPath();
  ctx.arc(c.x, c.y, s, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#d8b038'; ctx.lineWidth = Math.max(1, 0.9 * zoom);
  ctx.beginPath();
  ctx.moveTo(c.x - s * 0.15, c.y - s * 0.55);
  ctx.lineTo(c.x - s * 0.4, c.y + s * 0.05);
  ctx.lineTo(c.x + s * 0.05, c.y + s * 0.05);
  ctx.lineTo(c.x + s * 0.15, c.y + s * 0.55);
  ctx.lineTo(c.x + s * 0.4, c.y - s * 0.05);
  ctx.lineTo(c.x - s * 0.05, c.y - s * 0.05);
  ctx.closePath();
  ctx.stroke();
}

// A zone lot: a coloured diamond border with corner brackets, the reference's way of showing
// zoning without hiding the ground (STUDY 3). No fill wash, so the land stays readable.
function drawZone(ctx, faces, zone, zoom) {
  const color = ZONE_TINT[zone] || '#888888';
  const inset = 0.82; // pull the marker in from the tile edge
  const c = faces.center;
  const p = (corner) => ({ x: c.x + (corner.x - c.x) * inset, y: c.y + (corner.y - c.y) * inset });
  const T = p(faces.top);
  const R = p(faces.right);
  const B = p(faces.bottom);
  const L = p(faces.left);
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1.5, 2 * zoom);
  ctx.beginPath();
  ctx.moveTo(T.x, T.y);
  ctx.lineTo(R.x, R.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(L.x, L.y);
  ctx.closePath();
  ctx.stroke();
  // Corner nubs make the lot read at a glance and at low zoom.
  const s = 3 * zoom;
  ctx.fillStyle = color;
  for (const corner of [T, R, B, L]) {
    ctx.fillRect(corner.x - s / 2, corner.y - s / 2, s, s);
  }
}

// A road: a dirt ribbon from the tile centre out to each connected edge, so straight runs,
// corners, tees and crossings all emerge from the auto-connect mask. Isolated roads show a
// small central patch.
function drawRoad(ctx, faces, mask, zoom) {
  const dirt = RAMP.dirt;
  const c = faces.center;
  const mids = edgeMidpoints(faces);
  const w = 8 * zoom; // roadbed half-width: a lane wide enough to read as pavement
  const curb = w + Math.max(1, zoom); // dark shoulder just outside the bed
  let bits = [DIR.SE.bit, DIR.SW.bit, DIR.NW.bit, DIR.NE.bit].filter((b) => mask & b);
  // An isolated stub still shows a short lane so the tile is never a bare patch.
  if (bits.length === 0) bits = [DIR.SE.bit, DIR.NW.bit];

  // Shadow shoulders first (curb), so arms seat on the ground.
  fillDiamond(ctx, c, curb * 1.2, curb * 0.6, dirt[SHADOW]);
  for (const b of bits) thickLine(ctx, c, mids[b], curb, dirt[SHADOW]);
  // The roadbed.
  fillDiamond(ctx, c, w * 1.2, w * 0.6, dirt[BASE]);
  for (const b of bits) thickLine(ctx, c, mids[b], w, dirt[BASE]);
  // A lighter packed-dirt centre rut down each arm.
  for (const b of bits) thickLine(ctx, c, mids[b], Math.max(1, 1.6 * zoom), dirt[LIGHT]);
}

// A power line: a short pole at the tile centre with slack wires to each connected neighbour.
function drawPowerline(ctx, faces, mask, zoom) {
  const c = faces.center;
  const mids = edgeMidpoints(faces);
  const poleH = 9 * zoom;
  const top = { x: c.x, y: c.y - poleH };
  ctx.strokeStyle = WIRE;
  ctx.lineWidth = Math.max(1, 1 * zoom);
  for (const b of [DIR.SE.bit, DIR.SW.bit, DIR.NW.bit, DIR.NE.bit]) {
    if (!(mask & b)) continue;
    const m = mids[b];
    ctx.beginPath();
    ctx.moveTo(top.x, top.y);
    ctx.lineTo(m.x, m.y - poleH * 0.6); // wire dips toward the neighbour pole
    ctx.stroke();
  }
  // The pole itself.
  ctx.strokeStyle = POLE;
  ctx.lineWidth = Math.max(1, 1.5 * zoom);
  ctx.beginPath();
  ctx.moveTo(c.x, c.y);
  ctx.lineTo(top.x, top.y);
  ctx.stroke();
}

// A filled diamond (2:1) centred at c with the given half-extents.
function fillDiamond(ctx, c, hw, hh, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(c.x, c.y - hh);
  ctx.lineTo(c.x + hw, c.y);
  ctx.lineTo(c.x, c.y + hh);
  ctx.lineTo(c.x - hw, c.y);
  ctx.closePath();
  ctx.fill();
}

// A filled rectangle along A->B with the given half-width (a thick line as a quad).
function thickLine(ctx, a, b, halfWidth, color) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const px = (-dy / len) * halfWidth;
  const py = (dx / len) * halfWidth;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(a.x + px, a.y + py);
  ctx.lineTo(b.x + px, b.y + py);
  ctx.lineTo(b.x - px, b.y - py);
  ctx.lineTo(a.x - px, a.y - py);
  ctx.closePath();
  ctx.fill();
}

function fillPoly(ctx, pts, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fill();
}

// --- ambient animation (M9): the living world drawn over the map -------------------------------
// Projects the pure ambient entities (src/ambient.js, world coordinates) to the screen and draws
// them: sea shadows and figures at ground level, fog over the town, gulls on top. Cheap period art,
// no gradients required (a flat wash where a gradient is unavailable). Never reads or writes game
// state; it only paints what src/ambient.js already computed.
function drawAmbient(ctx, ambient, camera) {
  if (!ambient) return;
  const z = camera.zoom;
  const inView = (p, m) => p.x >= -m && p.x <= camera.viewportW + m && p.y >= -m && p.y <= camera.viewportH + m;

  // Shadows gliding under the sea surface: soft dark ellipses, below everything else.
  for (const s of ambient.waterShadows) {
    const p = camera.worldToScreen(s.x, s.y);
    if (!inView(p, 60)) continue;
    ctx.fillStyle = 'rgba(6, 13, 19, 0.18)';
    ambEllipse(ctx, p.x, p.y, Math.max(6, s.rad * z), Math.max(3, s.rad * z * 0.5));
  }

  // A cart trundling its lane: a small weathered body on two dark wheels.
  for (const c of ambient.carts) {
    const p = camera.worldToScreen(c.x, c.y);
    if (!inView(p, 40)) continue;
    drawCart(ctx, p.x, p.y, z);
  }

  // A procession of hooded figures walking up to a shrine.
  for (const pr of ambient.processions) {
    for (const f of pr.figures) {
      const p = camera.worldToScreen(f.x, f.y);
      if (!inView(p, 30)) continue;
      drawFigure(ctx, p.x, p.y, z);
    }
  }

  // Fog banks drifting across the town: broad, soft, cold-grey banks with a diffuse edge.
  for (const f of ambient.fog) {
    const p = camera.worldToScreen(f.x, f.y);
    const w = f.w * z;
    const h = f.h * z;
    if (p.x + w < -40 || p.x - w > camera.viewportW + 40) continue;
    if (typeof ctx.createRadialGradient === 'function') {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(w, h));
      g.addColorStop(0, `rgba(176, 184, 190, ${f.alpha})`);
      g.addColorStop(0.6, `rgba(170, 178, 186, ${f.alpha * 0.7})`);
      g.addColorStop(1, 'rgba(170, 178, 186, 0)');
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = `rgba(172, 180, 187, ${f.alpha})`;
    }
    ambEllipse(ctx, p.x, p.y, w, h);
  }

  // Gulls wheeling on top: a small dark V that opens and closes as it flaps.
  for (const g of ambient.gulls) {
    const p = camera.worldToScreen(g.x, g.y);
    if (!inView(p, 20)) continue;
    drawGull(ctx, p.x, p.y, g.wing, z);
  }
}

function ambEllipse(ctx, cx, cy, rx, ry) {
  ctx.beginPath();
  if (typeof ctx.ellipse === 'function') {
    ctx.ellipse(cx, cy, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
  } else {
    // Fallback: a circle scaled to the ellipse (older contexts). Keeps the wash even if squat.
    ctx.arc(cx, cy, Math.abs((rx + ry) / 2), 0, Math.PI * 2);
  }
  ctx.fill();
}

function drawGull(ctx, cx, cy, wing, z) {
  // Two short strokes meeting at the body, forming a shallow V; `wing` (0..1) raises the tips.
  const span = Math.max(4, 6 * z);
  const lift = (0.3 + 0.7 * wing) * span * 0.7;
  ctx.strokeStyle = '#2c323a';
  ctx.lineWidth = Math.max(1.2, 1.3 * z);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - span, cy - lift + span * 0.25);
  ctx.lineTo(cx, cy);
  ctx.lineTo(cx + span, cy - lift + span * 0.25);
  ctx.stroke();
}

function drawCart(ctx, cx, cy, z) {
  const w = Math.max(5, 8 * z);
  const h = Math.max(3, 5 * z);
  // The bed.
  ctx.fillStyle = '#5a4632';
  ctx.fillRect(cx - w / 2, cy - h, w, h * 0.7);
  // A darker top rail.
  ctx.fillStyle = '#413020';
  ctx.fillRect(cx - w / 2, cy - h, w, Math.max(1, h * 0.2));
  // Two wheels.
  ctx.fillStyle = '#241a12';
  const wr = Math.max(1.2, h * 0.35);
  ambEllipse(ctx, cx - w * 0.3, cy - wr * 0.4, wr, wr);
  ambEllipse(ctx, cx + w * 0.3, cy - wr * 0.4, wr, wr);
}

function drawFigure(ctx, cx, cy, z) {
  // A small hooded figure: a near-black robe (a narrow triangle) under a round head.
  const h = Math.max(4, 7 * z);
  const w = Math.max(2, 3.2 * z);
  ctx.fillStyle = '#1f242b';
  ctx.beginPath();
  ctx.moveTo(cx, cy - h); // the peak of the hood
  ctx.lineTo(cx - w / 2, cy);
  ctx.lineTo(cx + w / 2, cy);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#2a3038';
  ambEllipse(ctx, cx, cy - h * 0.85, Math.max(1, w * 0.34), Math.max(1, w * 0.34));
}


// ===== src/ui.js =====
// OS-window UI chrome for INNSMOUTH 2000 (STUDY section 3).
//
// The reference's beveled-panel look: raised grey panels with a light top-left bevel and a dark
// bottom-right bevel, a coloured title bar, chunky labels, tool buttons as pressed/raised wells.
// Layout and hit-testing are pure so node --test covers them; the ctx drawing is browser-side.
// Player-facing wording stays plain English, period register, no em-dashes (hard rule 10).







const CLASS_LABEL = { unwary: 'The Unwary', cultist: 'Cultists', deepone: 'Deep Ones', scholar: 'Scholars' };

// Chrome text-scale (M7): a legibility setting independent of the map zoom. The reference's canvas
// monospace at 11-13px is a hard floor on small screens; this multiplies every chrome font AND the
// text-bearing windows/bar that hold it, so enlarged text still fits. The pictographic toolbar is
// left alone (it is not the text floor and would overflow a short viewport if scaled). Tests run at
// the default 1.0 and never touch this, so the pure-layout geometry assertions are unaffected.
const CHROME_SCALES = [1, 1.25, 1.5];
let CHROME_SCALE = 1;
function setChromeScale(s) { CHROME_SCALE = s; return CHROME_SCALE; }
function getChromeScale() { return CHROME_SCALE; }
// Advance to the next scale in the ring; returns the new value.
function cycleChromeScale() {
  const i = CHROME_SCALES.indexOf(CHROME_SCALE);
  CHROME_SCALE = CHROME_SCALES[(i + 1) % CHROME_SCALES.length];
  return CHROME_SCALE;
}
// A scaled pixel count (rounded), and a scaled monospace font string.
function sc(px) { return Math.round(px * CHROME_SCALE); }
function fpx(px) { return `${sc(px)}px monospace`; }

// --- the one shared padding standard (M10 padding sweep, operator feedback 2026-08-05) ---------
// A box that ends immediately after its text reads as a rendering defect, not chrome. Before this
// pass every popup carried its own magic number (Query 6-8px, the Ledger/Wrath/Help/Advisor 12px,
// Favor 16px, the Courier paper 14px...). PANEL_PAD is now the ONE dial every window below insets
// its title and body text by (scaled, so it still holds the M7 legibility floor at every chrome
// scale); MIN_POPUP_W is the floor a small popup's content box is never squeezed under, so a
// single short word never renders as a bare sliver. Raw, unscaled px -- callers apply their own
// scale helper (sc() here, s()/scale in advisor.js and overlays.js).
const PANEL_PAD = 16;
const MIN_POPUP_W = 120;

// --- monospace text fitting (M8 text-overflow) -------------------------------------------
// Headless Chrome's generic `monospace` measures ~0.60 * px advance per glyph (2026-08-06),
// noticeably wider than the old 0.55 calibration. Deriving the advance from the active font size
// keeps wrapping, sizing, and the text-overflow detector honest at every chrome scale. These
// pure helpers let layout size a box to its text without a ctx, so the same box the headless
// build renders is the box the detector measures. Kept here (the chrome hub) and shared by
// strips.js and the detector.
function monoAdvance(px) { return 0.6; }
function monoWidth(text, px) { return String(text).length * px * monoAdvance(px); }

// Truncate a run to fit maxWidth at font px, appending an ellipsis when it must cut.
function fitMono(text, maxWidth, px) {
  const s = String(text);
  if (monoWidth(s, px) <= maxWidth) return s;
  let n = Math.max(0, Math.floor(maxWidth / (px * monoAdvance(px))) - 1);
  while (n > 0 && monoWidth(s.slice(0, n) + '…', px) > maxWidth) n--;
  return s.slice(0, n) + '…';
}

// Greedy word-wrap to maxWidth at font px, at most maxLines; the final line is truncated with an
// ellipsis if the text does not fit. Never breaks below one word per line (a single over-long word
// is itself ellipsized).
function wrapMono(text, maxWidth, px, maxLines = 2) {
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for (let i = 0; i < words.length; i++) {
    const trial = cur ? `${cur} ${words[i]}` : words[i];
    if (!cur || monoWidth(trial, px) <= maxWidth) {
      cur = trial;
    } else {
      lines.push(cur);
      if (lines.length === maxLines - 1) { cur = words.slice(i).join(' '); break; }
      cur = words[i];
    }
  }
  lines.push(fitMono(cur, maxWidth, px));
  return lines;
}

// The toolbar's tools, in order, with a plain label for the tooltip/aria.
const TOOLBAR_TOOLS = [
  { tool: TOOL.QUERY, label: 'Query' },
  { tool: TOOL.BULLDOZE, label: 'Bulldoze' },
  { tool: TOOL.ROAD, label: 'Road' },
  { tool: TOOL.POWERLINE, label: 'Power line' },
  { tool: TOOL.GASWORKS, label: 'Gasworks' },
  { tool: TOOL.WHALEOIL, label: 'Whale-Oil Works' },
  { tool: TOOL.ZONE_R, label: 'Residential' },
  { tool: TOOL.ZONE_C, label: 'Commercial' },
  { tool: TOOL.ZONE_I, label: 'Industrial' },
  { tool: TOOL.CONSTABULARY, label: 'Constabulary' },
  { tool: TOOL.ASYLUM, label: 'Asylum' },
  { tool: TOOL.CHAPEL, label: 'Chapel' },
  { tool: TOOL.SHRINE, label: 'Shrine' },
  { tool: TOOL.UNIVERSITY, label: 'University' },
];

// Build the toolbar layout: a vertical strip docked top-left. Pure geometry.
function buildToolbar(opts = {}) {
  const btn = opts.btn || 34;
  const pad = opts.pad || 6;
  const gap = opts.gap || 4;
  const x = opts.x ?? 12;
  const y = opts.y ?? 12;
  const buttons = TOOLBAR_TOOLS.map((t, i) => ({
    tool: t.tool,
    label: t.label,
    rect: { x: x + pad, y: y + pad + i * (btn + gap), w: btn, h: btn },
  }));
  const panel = {
    x, y,
    w: btn + pad * 2,
    h: pad * 2 + TOOLBAR_TOOLS.length * btn + (TOOLBAR_TOOLS.length - 1) * gap,
  };
  return { panel, buttons };
}

// Point-in-rect.
function inRect(r, px, py) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

// Which toolbar tool (if any) is under a screen point.
function hitToolbar(toolbar, px, py) {
  for (const b of toolbar.buttons) {
    if (inRect(b.rect, px, py)) return b.tool;
  }
  return null;
}

// Whether a screen point is anywhere on the toolbar panel (so map clicks there are swallowed).
function overToolbar(toolbar, px, py) {
  return inRect(toolbar.panel, px, py);
}

// The number-key shortcut for a toolbar tool, real and reachable: a keydown event reports one
